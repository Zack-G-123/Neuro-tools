ness. Repeat if effort was poor; time duration when useful.","abnormal":"Listen for breathiness, strain, tremor, instability, reduced loudness, or unusually short duration. A short duration is nonspecific and can reflect respiratory weakness, glottic insufficiency, effort, or technique.","evidence":"Sustained phonation is a recommended motor-speech assessment task.","tags":["sustained vowel","maximum phonation","voice","dysarthria","bulbar","speech","HIF"],"refs":[{"label":"Oral/laryngeal diadochokinesis scoping review","url":"https://pubmed.ncbi.nlm.nih.gov/34958599/"},{"label":"Speech recording/acoustic analysis recommendations in dysarthria","url":"https://pubmed.ncbi.nlm.nih.gov/33373483/"}],"pitfalls":"","tool":"nihssstimuli","generalize":""},{"section":"HIF","title":"Tool-selection / mechanical problem solving","purpose":"Tests ability to choose a mechanically appropriate tool rather than merely recall a learned gesture.","localization":"Left inferior parietal technical-reasoning network with broader visuospatial/executive support.","perform":"Present a simple mechanical goal with several safe candidate objects/tools and ask which tool would work best and, if feasible, to demonstrate why.","abnormal":"Choosing a mechanically inappropriate tool despite understanding the goal suggests impaired technical reasoning/tool-use cognition rather than simple weakness.","evidence":"Mechanical problem solving can dissociate from pantomime and familiar tool semantics.","tags":["apraxia","praxis","tool selection","mechanical problem solving","technical reasoning","parietal","HIF"],"refs":[{"label":"Tool use and mechanical problem solving in apraxia","url":"https://pubmed.ncbi.nlm.nih.gov/9723930/"},{"label":"Tool use and action planning in apraxia","url":"https://pubmed.ncbi.nlm.nih.gov/21241720/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Transitive gesture pantomime to command","purpose":"Tests pantomime of learned tool use without the tool present.","localization":"Left-lateralized praxis network including inferior parietal, frontal, and lateral occipitotemporal regions; semantic-language processes also contribute.","perform":"Name a familiar tool action without showing the tool, such as 'Show me how you would use a hammer.' Ask for the full movement, not merely identification of the tool.","abnormal":"Abnormal errors include using a body part as the object, wrong hand posture/orientation, wrong movement trajectory, or a semantically incorrect action. Compare with actual tool use and imitation before calling the deficit apraxic.","evidence":"Pantomime is a core validated praxis domain, but it is not equivalent to actual tool use.","tags":["apraxia","praxis","transitive gesture","tool pantomime","hammer","dominant parietal","HIF"],"refs":[{"label":"Ideomotor apraxia — review","url":"https://pubmed.ncbi.nlm.nih.gov/17507030/"},{"label":"Neural correlates of limb apraxia — 2024 lesion meta-analysis","url":"https://pubmed.ncbi.nlm.nih.gov/38754714/"},{"label":"Pantomime of tool use — meta-analytic framework","url":"https://pubmed.ncbi.nlm.nih.gov/35350708/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Verbal category fluency","purpose":"Rapid lexical-semantic retrieval and executive search strategy.","localization":"Dominant temporal semantic stores plus frontal executive retrieval network; reduced output is nonspecific.","perform":"Ask the patient to name as many animals as possible in 60 seconds. Note total, clustering, switching, perseverations, and rule violations.","abnormal":"Low output with poor switching may reflect executive dysfunction; loss of semantic clustering/knowledge can suggest temporal semantic dysfunction.","evidence":"Widely used neuropsychological paradigm; best interpreted as network-level rather than focal localization.","tags":["verbal fluency","animals","executive","frontal","temporal","dementia","HIF"],"refs":[{"label":"Higher cortical dysfunction bedside review","url":"https://pubmed.ncbi.nlm.nih.gov/15651306/"},{"label":"Cortical function deficits review","url":"https://pubmed.ncbi.nlm.nih.gov/19566501/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Visual extinction on double simultaneous stimulation","purpose":"Tests competitive spatial attention when each visual field is perceived normally alone.","localization":"Attention network, classically right temporoparietal/inferior parietal regions for left-sided extinction.","perform":"First confirm that a unilateral finger wiggle or target is detected in each hemifield. Then unpredictably present left alone, right alone, or both simultaneously while fixation remains central.","abnormal":"Failure to report the contralesional target only during bilateral trials is visual extinction. This is different from a fixed visual-field defect.","evidence":"Extinction is a validated component of multimodal neglect assessment.","tags":["visual extinction","double simultaneous","neglect","parietal","spatial attention","HIF"],"refs":[{"label":"Quantitative unilateral neglect battery validation","url":"https://pubmed.ncbi.nlm.nih.gov/17119304/"},{"label":"Neglect and extinction across sensory modalities — review","url":"https://pubmed.ncbi.nlm.nih.gov/17119300/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Visual object recognition","purpose":"Distinguishes visual agnosia from naming failure.","localization":"Ventral occipitotemporal visual-association pathways; bilateral or dominant/nondominant posterior lesions depending on subtype.","perform":"Show familiar objects or drawings. If the patient cannot name one, ask them to describe its shape/use, match it to another view, then allow tactile identification.","abnormal":"Failure to recognize visually despite adequate acuity/fields and preserved recognition by touch supports visual agnosia; recognition with naming failure supports anomia.","evidence":"Higher-cortical localization literature supports modality-specific agnosia testing.","tags":["visual agnosia","object recognition","occipital","temporal","ventral stream","HIF"],"refs":[{"label":"Higher cortical dysfunction bedside review","url":"https://pubmed.ncbi.nlm.nih.gov/15651306/"},{"label":"Cortical function deficits review","url":"https://pubmed.ncbi.nlm.nih.gov/19566501/"}],"pitfalls":"","tool":"nihssstimuli","generalize":""},{"section":"HIF","title":"Writing to dictation","purpose":"Tests auditory-to-orthographic conversion and language-writing networks.","localization":"Dominant language network including inferior parietal/angular and frontal-premotor writing systems; pattern of errors matters more than a single locus.","perform":"Dictate several words and a short sentence. If abnormal, compare with copying and spontaneous writing to separate language-based agraphia from motor/visuospatial limitations.","abnormal":"Phonologic/semantic spelling errors with preserved copying support language-based agraphia. Marked motor distortion alone suggests weakness, tremor, dystonia, or apraxia rather than language loss.","evidence":"Localization evidence from agraphia lesion literature.","tags":["agraphia","writing","dictation","Gerstmann","angular gyrus","language","HIF","dominant parietal"],"refs":[{"label":"Alexia/agraphia localization review","url":"https://pubmed.ncbi.nlm.nih.gov/21878722/"},{"label":"Angular-gyrus stimulation study","url":"https://pubmed.ncbi.nlm.nih.gov/14567608/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Written copying","purpose":"Separates graphomotor/visuospatial ability from language-based spelling generation.","localization":"Visual-motor and premotor writing systems; preserved copying despite impaired spontaneous/dictated writing supports language-level agraphia.","perform":"Show a short printed sentence and ask the patient to copy it exactly.","abnormal":"Poor copying suggests motor, visuospatial, visual, or praxis impairment. Good copying with impaired dictation/spontaneous writing points more toward language-based agraphia.","evidence":"Useful component of alexia/agraphia localization.","tags":["copy writing","agraphia","writing","visuospatial","language","HIF","dominant parietal","Gerstmann"],"refs":[{"label":"Alexia/agraphia localization review","url":"https://pubmed.ncbi.nlm.nih.gov/21878722/"},{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Alternate cover test","purpose":"Breaks fusion to reveal total manifest + latent deviation (tropia + phoria).","localization":"Ocular alignment pathways; useful in subtle vertical/horizontal deviations and skew.","perform":"Rapidly alternate an occluder between eyes while the patient fixates, without allowing binocular fusion between covers. Observe each eye as it is uncovered.","abnormal":"Refixation movements quantify direction of latent/manifest deviation; vertical correction can reveal skew.","evidence":"Standard ocular-motor examination maneuver.","tags":["alternate cover","phoria","skew","diplopia","ocular alignment","CN"],"refs":[{"label":"Neuro-ophthalmological examination review","url":"https://pubmed.ncbi.nlm.nih.gov/21601063/"},{"label":"Bedside neuro-ophthalmology examination","url":"https://pubmed.ncbi.nlm.nih.gov/12870107/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Alternate cover test for skew","purpose":"Vertical ocular misalignment from otolith/brainstem pathways; central AVS sign.","perform":"Have the patient fixate a target. Alternately cover each eye and watch the uncovered eye for vertical corrective refixation.","abnormal":"Vertical refixation movement indicates skew deviation.","evidence":"A — low sensitivity but very high specificity for central causes in AVS meta-analysis.","tags":["skew","HINTS","vertigo","dizziness","vestibular","brainstem","stroke","CN"],"refs":[{"label":"HINTS meta-analysis","url":"https://pubmed.ncbi.nlm.nih.gov/36453134/"},{"label":"Comprehensive neuro-ophthalmology examination review","url":"https://pubmed.ncbi.nlm.nih.gov/21601063/"}],"pitfalls":"","localization":"Otolith-ocular pathways in brainstem/cerebellum; skew in AVS is a central sign.","tool":null,"generalize":""},{"section":"CN","title":"Anisocoria in bright versus dim light","purpose":"Helps identify whether unequal pupils reflect parasympathetic (large pupil) or sympathetic (small pupil) dysfunction.","localization":"Greater anisocoria in bright light points toward impaired parasympathetic constriction of the larger pupil; greater anisocoria in darkness points toward impaired sympathetic dilation of the smaller pupil.","perform":"Measure/compare pupils after allowing adaptation in room light, brighter light, and dim light. Note ptosis and extraocular movements.","abnormal":"If the size difference increases in bright light, focus on the larger pupil. If it increases in darkness, focus on the smaller pupil. Small stable physiologic anisocoria is common.","evidence":"Core neuro-ophthalmic localization technique.","tags":["anisocoria","pupil","Horner","CN III","parasympathetic","sympathetic","CN"],"refs":[{"label":"Neuro-ophthalmological examination review","url":"https://pubmed.ncbi.nlm.nih.gov/21601063/"},{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":"pupil","generalize":""},{"section":"CN","title":"Bielschowsky head-tilt test","purpose":"Assesses whether vertical ocular misalignment changes with head tilt, classically used in suspected trochlear/superior-oblique palsy.","localization":"CN IV/superior oblique versus other causes of vertical strabismus; modern data show limited sensitivity, especially in bilateral palsy.","perform":"Measure/observe the vertical deviation in primary position, then with the head tilted right and left while the patient fixates a target. Keep the face turned forward.","abnormal":"Increase in hypertropia with a particular head tilt can support the expected superior-oblique pattern, but a negative test does not exclude CN IV palsy and positive patterns can occur in mimics.","evidence":"Useful classic ocular-motor maneuver with important sensitivity limitations.","tags":["Bielschowsky","head tilt","trochlear palsy","CN IV","diplopia","vertical diplopia","CN"],"refs":[{"label":"Bielschowsky/Parks sensitivity in bilateral superior oblique palsy","url":"https://pubmed.ncbi.nlm.nih.gov/24412122/"},{"label":"Head tilt test: trochlear palsy vs sagging eye syndrome","url":"https://pubmed.ncbi.nlm.nih.gov/38141057/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Brightness comparison","purpose":"Asymmetric afferent optic dysfunction.","perform":"Present the same bright white stimulus monocularly and ask the patient to compare perceived brightness.","abnormal":"Consistent substantial inter-eye brightness asymmetry.","evidence":"A — strong diagnostic performance in asymmetric RAPD cohorts.","tags":["brightness","optic neuritis","optic neuropathy","RAPD","vision","CN"],"refs":[{"label":"Brightness comparison study","url":"https://pubmed.ncbi.nlm.nih.gov/17652731/"},{"label":"Neuro-ophthalmological examination review","url":"https://pubmed.ncbi.nlm.nih.gov/21601063/"}],"pitfalls":"","localization":"Afferent visual pathway, especially asymmetric optic neuropathy/retinal disease.","tool":"bright","generalize":"Primarily compare the same target between eyes. Repeated serial measurements can be useful in optic neuritis/optic neuropathy, but room illumination and screen brightness should be kept constant."},{"section":"CN","title":"Cogan lid twitch","purpose":"Ocular myasthenia / fatigable neuromuscular-junction dysfunction.","perform":"Have the patient look down for ~10–15 seconds, then rapidly return to primary gaze and observe the upper lid.","abnormal":"Brief upward lid overshoot/twitch before settling.","evidence":"A/B — high specificity in neuro-ophthalmology cohorts.","tags":["Cogan","myasthenia","MG","neuromuscular","NMJ","ptosis","diplopia","CN"],"refs":[{"label":"Cogan lid twitch diagnostic study","url":"https://pubmed.ncbi.nlm.nih.gov/21654336/"},{"label":"Neuro-ophthalmological examination review","url":"https://pubmed.ncbi.nlm.nih.gov/21601063/"}],"pitfalls":"","localization":"Neuromuscular junction; commonly ocular myasthenia.","tool":null,"generalize":""},{"section":"CN","title":"Color vision","purpose":"Detects dyschromatopsia, useful in optic neuropathy and retinal disease.","localization":"Afferent visual pathway, particularly optic nerve when acquired and asymmetric.","perform":"Test each eye separately under consistent lighting with validated pseudoisochromatic plates when available. Compare errors and inter-eye asymmetry.","abnormal":"New asymmetric color desaturation or plate errors support afferent visual dysfunction; congenital red-green deficiency is typically bilateral and longstanding.","evidence":"Digital color testing can perform well but varies substantially by display/app; exact Ishihara plates require validated presentation.","tags":["color vision","Ishihara","dyschromatopsia","optic neuritis","optic neuropathy","CN"],"refs":[{"label":"Smartphone color testing validity","url":"https://pubmed.ncbi.nlm.nih.gov/29438263/"},{"label":"Smartphone vs Ishihara comparison","url":"https://pubmed.ncbi.nlm.nih.gov/27092927/"}],"pitfalls":"","tool":"color","generalize":""},{"section":"CN","title":"Confrontation visual fields","purpose":"Gross homonymous/monocular visual-field deficit.","perform":"Have the patient fixate your nose. Compare quadrants using finger wiggle and/or a small red target, testing each eye when appropriate.","abnormal":"Reproducible quadrant/hemianopic loss compared with examiner or the opposite side.","evidence":"A/B — kinetic red target plus finger wiggle improves bedside sensitivity.","tags":["visual field","hemianopia","quadrantanopia","vision","occipital","optic nerve","CN","stroke"],"refs":[{"label":"Confrontation visual field techniques","url":"https://pubmed.ncbi.nlm.nih.gov/20385890/"},{"label":"Neuro-ophthalmological examination review","url":"https://pubmed.ncbi.nlm.nih.gov/21601063/"}],"pitfalls":"","localization":"Retina/optic nerve/chiasm/tract/radiations/occipital cortex according to monocular vs homonymous field pattern.","tool":"field","generalize":"Use finger counting/wiggle for broad screening and a small red target for subtle desaturation or peripheral comparison. You can test monocularly to localize prechiasmal disease, then binocularly for homonymous patterns. Formal perimetry remains necessary for quantification."},{"section":"CN","title":"Convergence","purpose":"Tests medial rectus activation and near-response pathways.","localization":"Midbrain near-response network, bilateral CN III medial rectus pathways; impaired in some INO/vergence disorders.","perform":"Bring a small target slowly toward the bridge of the nose while the patient maintains fixation. Observe symmetric adduction and ask when diplopia occurs.","abnormal":"Asymmetric or absent convergence is abnormal; preserved convergence with impaired adduction on horizontal saccades can support internuclear ophthalmoplegia.","evidence":"Standard ocular-motor examination maneuver.","tags":["convergence","INO","MLF","diplopia","CN III","CN"],"refs":[{"label":"Neuro-ophthalmological examination review","url":"https://pubmed.ncbi.nlm.nih.gov/21601063/"},{"label":"Bedside neuro-ophthalmology examination","url":"https://pubmed.ncbi.nlm.nih.gov/12870107/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Corneal reflex","purpose":"Tests trigeminal V1 afferent and bilateral facial CN VII efferent blink pathways.","localization":"Afferent V1/nasociliary → pons; efferent facial nuclei/nerves bilaterally.","perform":"Approach from the side and lightly touch the cornea with a fine cotton wisp if clinically indicated. Observe bilateral blink. Avoid contact lenses/ocular injury situations.","abnormal":"No blink in either eye when one cornea is stimulated suggests same-side (ipsilateral) V1 afferent failure; unilateral failure to blink regardless of stimulated eye suggests same-side (ipsilateral) CN VII efferent failure.","evidence":"Classic brainstem localization maneuver; technique and patient safety matter.","tags":["corneal reflex","CN V","V1","CN VII","facial nerve","pons","coma","CN"],"refs":[{"label":"Neuro-ophthalmologic exam including coma","url":"https://pubmed.ncbi.nlm.nih.gov/11370569/"},{"label":"Bedside neuro-ophthalmology examination","url":"https://pubmed.ncbi.nlm.nih.gov/12870107/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Cover-uncover test","purpose":"Detects manifest ocular misalignment (tropia).","localization":"Extraocular-muscle alignment; pattern helps localize CN III/IV/VI, orbit, NMJ, or supranuclear disease.","perform":"Patient fixates a small target. Cover one eye while watching the uncovered eye for a refixation movement; repeat on the other side at distance and near.","abnormal":"Movement of the uncovered eye to regain fixation indicates a tropia; direction of correction reveals the underlying deviation.","evidence":"Standard ocular-alignment examination maneuver.","tags":["cover test","strabismus","diplopia","tropia","ocular alignment","CN III","CN IV","CN VI","CN"],"refs":[{"label":"Neuro-ophthalmological examination review","url":"https://pubmed.ncbi.nlm.nih.gov/21601063/"},{"label":"Bedside neuro-ophthalmology examination","url":"https://pubmed.ncbi.nlm.nih.gov/12870107/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Dynamic visual acuity","purpose":"Tests functional vestibulo-ocular reflex performance during head motion.","localization":"Bilateral or unilateral peripheral vestibular hypofunction can cause excessive loss of acuity during head movement; central and visual factors can also contribute.","perform":"Establish static acuity first. Then have the patient read the same optotype format while the head is oscillated horizontally at a consistent moderate-fast rate; compare the number of lines lost.","abnormal":"A substantial drop in acuity during head motion beyond expected normal loss supports deficient gaze stabilization/VOR. Exact thresholds depend on protocol and age.","evidence":"Computerized DVA has demonstrated high sensitivity/specificity in vestibular hypofunction; bedside versions are less standardized.","tags":["dynamic visual acuity","DVA","vestibular","VOR","oscillopsia","bilateral vestibulopathy","CN"],"refs":[{"label":"Computerized dynamic visual acuity diagnostic study","url":"https://pubmed.ncbi.nlm.nih.gov/9831156/"},{"label":"Dynamic visual acuity vs head impulse validation","url":"https://pubmed.ncbi.nlm.nih.gov/20644064/"}],"pitfalls":"","tool":"acuity","generalize":""},{"section":"CN","title":"Enhanced ptosis / curtain sign","purpose":"Looks for contralateral ptosis that worsens when the more ptotic lid is manually elevated.","localization":"Neuromuscular junction with Hering-law interactions; supportive of ocular myasthenia but not completely specific.","perform":"In asymmetric ptosis, gently lift the more ptotic upper lid while the patient maintains primary gaze and observe the opposite eyelid.","abnormal":"Worsening of the opposite eyelid droop after lifting the first lid is enhanced ptosis/curtaining. Use as supportive evidence, not a stand-alone diagnosis.","evidence":"Recognized ocular-MG sign; mimics including mitochondrial myopathy have been reported.","tags":["enhanced ptosis","curtain sign","myasthenia","NMJ","ptosis","CN"],"refs":[{"label":"Diagnostic approach to diplopia / ocular myasthenia discussion","url":"https://pubmed.ncbi.nlm.nih.gov/25099102/"},{"label":"Enhanced ptosis mimic in mitochondrial myopathy","url":"https://pubmed.ncbi.nlm.nih.gov/19078772/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Extraocular movements by cardinal positions","purpose":"Detects ophthalmoplegia and characterizes cranial-nerve versus supranuclear patterns.","localization":"CN III, IV, VI nuclei/fascicles/nerves, NMJ, extraocular muscles, orbit, and supranuclear gaze pathways.","perform":"Have the patient follow a target through horizontal and vertical gaze, pausing at symptomatic positions. Ask about diplopia and observe range, alignment, nystagmus, ptosis, and pupil abnormalities.","abnormal":"A consistent muscle-pattern deficit suggests CN/nuclear/orbital disease; conjugate gaze limitation suggests supranuclear pathways; variability/fatigability suggests NMJ.","evidence":"Core neuro-ophthalmology technique; localization derives from the pattern rather than a single accuracy metric.","tags":["EOM","extraocular movements","diplopia","CN III","CN IV","CN VI","ophthalmoplegia","CN"],"refs":[{"label":"Neuro-ophthalmological examination review","url":"https://pubmed.ncbi.nlm.nih.gov/21601063/"},{"label":"Bedside neuro-ophthalmology examination","url":"https://pubmed.ncbi.nlm.nih.gov/12870107/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Facial sensation V1/V2/V3","purpose":"Tests trigeminal somatic afferent function.","localization":"Trigeminal peripheral divisions → ganglion → brainstem nuclei/tracts → thalamus/cortex.","perform":"With eyes closed, compare light touch or pin across forehead, cheek, and jaw bilaterally. Map any deficit rather than sampling only one point.","abnormal":"Division-specific loss suggests peripheral trigeminal disease; crossed facial/body sensory patterns can localize to brainstem; hemisensory loss can be central.","evidence":"Core cranial-nerve examination; localization is pattern-based.","tags":["trigeminal","V1","V2","V3","facial numbness","face sensation","CN V","CN"],"refs":[{"label":"Neuro-ophthalmological examination review","url":"https://pubmed.ncbi.nlm.nih.gov/21601063/"},{"label":"Bedside neuro-ophthalmology examination","url":"https://pubmed.ncbi.nlm.nih.gov/12870107/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Finger-rub hearing screen","purpose":"Quickly detects gross asymmetric hearing loss.","localization":"External/middle ear, cochlea, or CN VIII; does not by itself distinguish conductive from sensorineural loss.","perform":"Occlude the non-test ear and gently rub fingers at a standardized distance from the test ear, then compare sides. Avoid visual cues.","abnormal":"Clear side-to-side asymmetry or inability to hear near-ear finger rub is abnormal and should prompt formal hearing assessment or tuning-fork comparison.","evidence":"Routine screening maneuver; not calibrated audiometry.","tags":["hearing","finger rub","CN VIII","hearing loss","CN"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Forced eye closure","purpose":"Tests orbicularis oculi strength.","localization":"Facial nucleus/CN VII and neuromuscular junction.","perform":"Ask the patient to close both eyes as tightly as possible while you gently try to open each eyelid.","abnormal":"Asymmetric ease of opening indicates weakness. Peripheral CN VII palsy commonly weakens closure; fatigable weakness can occur in myasthenia.","evidence":"Routine facial motor examination.","tags":["eye closure","orbicularis oculi","CN VII","Bell palsy","myasthenia","CN"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Forehead elevation","purpose":"Tests upper facial motor function.","localization":"Facial nucleus/CN VII; bilateral corticobulbar input to upper facial nucleus means central hemispheric lesions often spare forehead strength.","perform":"Ask the patient to raise both eyebrows while you observe forehead wrinkling and symmetry.","abnormal":"Clear unilateral forehead weakness supports an same-side (ipsilateral) peripheral/nuclear CN VII lesion when paired with lower-face weakness. Forehead sparing with lower-face weakness favors a central corticobulbar lesion.","evidence":"Classic facial-weakness localization maneuver.","tags":["forehead","facial weakness","CN VII","Bell palsy","stroke","CN"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Gag reflex","purpose":"Tests a pharyngeal reflex arc, but has limited value as a stand-alone swallow or vagal test.","localization":"Afferent predominantly CN IX and efferent predominantly CN X through medullary circuitry.","perform":"Only when clinically needed, lightly stimulate the posterior pharyngeal wall on each side and observe palatal/pharyngeal contraction.","abnormal":"Asymmetry can support a focal reflex-arc lesion, but absent gag can occur in healthy people and a present gag does not prove safe swallowing.","evidence":"Traditional maneuver with important limitations; do not use as a swallowing-safety screen.","tags":["gag reflex","CN IX","CN X","bulbar","dysphagia","CN"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"An absent gag reflex is not synonymous with dysphagia, and a present gag does not establish safe swallowing.","tool":null,"generalize":""},{"section":"CN","title":"Gaze-evoked nystagmus","purpose":"Tests gaze-holding neural integrator function.","localization":"Cerebellum/brainstem gaze-holding networks; medication/toxin effects can also cause it.","perform":"Ask the patient to hold gaze about 20–30° right, left, up, and down for several seconds. Avoid extreme eccentric gaze, which can cause physiologic endpoint nystagmus.","abnormal":"Sustained direction-changing nystagmus that beats in the direction of eccentric gaze supports central gaze-holding dysfunction.","evidence":"Important central vestibular/ocular-motor sign.","tags":["gaze evoked nystagmus","cerebellar","brainstem","vertigo","CN"],"refs":[{"label":"HINTS meta-analysis","url":"https://pubmed.ncbi.nlm.nih.gov/36453134/"},{"label":"Neuro-ophthalmological examination review","url":"https://pubmed.ncbi.nlm.nih.gov/21601063/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Head impulse test","purpose":"Vestibulo-ocular reflex; helps separate peripheral vestibulopathy from central causes in acute vestibular syndrome.","perform":"Patient fixes your nose. Deliver small, rapid, unpredictable ~10–20° head impulses from center while observing for catch-up saccades.","abnormal":"Corrective saccade suggests same-side (ipsilateral) peripheral vestibular hypofunction; a normal HIT in true AVS raises concern for central disease.","evidence":"A — moderate sensitivity and high specificity as an individual AVS sign; strongest within trained HINTS use.","tags":["head impulse","HIT","HINTS","vertigo","dizziness","vestibular","VOR","CN","brainstem","stroke"],"refs":[{"label":"HINTS meta-analysis","url":"https://pubmed.ncbi.nlm.nih.gov/36453134/"},{"label":"Comprehensive neuro-ophthalmology examination review","url":"https://pubmed.ncbi.nlm.nih.gov/21601063/"}],"pitfalls":"Use only in the appropriate syndrome; do not apply HINTS to brief positional dizziness.","localization":"Peripheral vestibular apparatus/CN VIII and vestibulo-ocular reflex arc; a normal HIT in AVS can suggest central vestibular pathology.","tool":null,"generalize":"Test both horizontal canals with small unpredictable impulses. Vertical-canal bedside impulses are possible but much harder to perform/interpret reliably without video head-impulse equipment."},{"section":"CN","title":"Head rotation against resistance","purpose":"Tests sternocleidomastoid strength.","localization":"Each SCM is supplied by the ipsilateral spinal accessory nerve and rotates the head toward the opposite side.","perform":"Ask the patient to turn the head left while you resist at the cheek, then repeat right.","abnormal":"Weak head turn to the left implicates the right SCM; weak turn to the right implicates the left SCM. Interpret alongside trapezius strength.","evidence":"Routine CN XI examination.","tags":["head rotation","SCM","sternocleidomastoid","CN XI","CN"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Jaw strength","purpose":"Tests trigeminal motor output to muscles of mastication.","localization":"Motor CN V nucleus/nerve, predominantly V3; supranuclear corticobulbar input is bilateral.","perform":"Palpate masseters/temporalis while the patient clenches. Ask them to open the jaw against resistance and move side-to-side.","abnormal":"Weakness/asymmetry suggests trigeminal motor or severe corticobulbar dysfunction. Jaw may deviate toward a weak pterygoid side on opening.","evidence":"Core cranial-nerve localization technique.","tags":["jaw strength","masseter","trigeminal motor","CN V","V3","CN"],"refs":[{"label":"Neurological examination review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"},{"label":"Comprehensive neuro-ophthalmology examination review","url":"https://pubmed.ncbi.nlm.nih.gov/21601063/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Near response / light-near dissociation","purpose":"Tests accommodation-convergence-miosis pathways and identifies light-near dissociation.","localization":"Supranuclear midbrain near-response circuitry plus CN III parasympathetic and medial-rectus output.","perform":"Have the patient alternate fixation between a distant target and a near target ~10 cm away; observe convergence and pupillary constriction.","abnormal":"Convergence/miosis preserved despite impaired light response is light-near dissociation; interpret with the rest of the pupil/ocular-motor examination.","evidence":"Established neuro-ophthalmic examination sign; etiologies are syndrome-dependent.","tags":["near response","light near dissociation","Argyll Robertson","Adie","pupil","CN III","CN"],"refs":[{"label":"Neuro-ophthalmological examination review","url":"https://pubmed.ncbi.nlm.nih.gov/21601063/"},{"label":"Bedside neuro-ophthalmology examination","url":"https://pubmed.ncbi.nlm.nih.gov/12870107/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Ocular myasthenia peek sign","purpose":"Tests fatigable orbicularis oculi weakness.","localization":"Neuromuscular junction, particularly ocular/facial myasthenia.","perform":"Ask the patient to close the eyes gently but firmly and sustain closure for about 20–30 seconds while you watch the lid margins.","abnormal":"Progressive separation of the eyelids with visible sclera—the patient appears to 'peek'—is positive. It is specific in classic small studies but not sensitive.","evidence":"Classic MG sign; original report found it uncommon but highly specific versus controls and other facial weakness.","tags":["peek sign","myasthenia","orbicularis oculi","NMJ","ptosis","CN"],"refs":[{"label":"Original peek-sign report","url":"https://pubmed.ncbi.nlm.nih.gov/426681/"},{"label":"Ocular myasthenia review","url":"https://pubmed.ncbi.nlm.nih.gov/29655447/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Optokinetic nystagmus (OKN)","purpose":"Reflexive visual tracking; can demonstrate preserved visual processing in limited-cooperation or functional visual-loss contexts.","perform":"Present moving high-contrast stripes across the visual field and observe alternating slow pursuit and quick refixation phases.","abnormal":"Absent/asymmetric OKN can reflect visual pathway, ocular-motor, or attentional dysfunction; preserved OKN can contradict claimed profound binocular blindness.","evidence":"B — computerized OKN thresholds correlate with subjective acuity; bedside interpretation remains context-dependent.","tags":["OKN","optokinetic","functional visual loss","blindness","vision","eye movement","CN","nystagmus"],"refs":[{"label":"Computerized OKN acuity study","url":"https://pubmed.ncbi.nlm.nih.gov/19834033/"},{"label":"Neuro-ophthalmological examination review","url":"https://pubmed.ncbi.nlm.nih.gov/21601063/"}],"pitfalls":"","localization":"Retina/visual pathways plus cortical/brainstem ocular-motor circuitry; asymmetry can also reflect hemispheric attention.","tool":"okr","generalize":""},{"section":"CN","title":"Palatal elevation","purpose":"Tests pharyngeal/vagal motor symmetry.","localization":"Nucleus ambiguus/CN X, vagal motor branches, and corticobulbar pathways.","perform":"Ask the patient to open the mouth and say 'ah' while you observe soft-palate elevation on both sides.","abnormal":"Reduced elevation on one side can support same-side (ipsilateral) vagal/pharyngeal weakness, but palatal/uvular asymmetry alone is imperfect and should be paired with voice, swallow, and cough findings.","evidence":"Routine bulbar examination maneuver.","tags":["palate","CN X","vagus","bulbar","dysphagia","CN"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Primary-position spontaneous nystagmus","purpose":"Detects spontaneous vestibular imbalance or central ocular-motor abnormality.","localization":"Peripheral vestibular apparatus/CN VIII versus brainstem/cerebellar vestibular pathways.","perform":"Have the patient look straight ahead at a stationary target. Observe direction, horizontal/vertical/torsional components, and whether fixation changes it.","abnormal":"A persistent spontaneous jerk nystagmus is abnormal. Direction-fixed horizontal-torsional nystagmus is common in peripheral vestibulopathy; pure vertical or certain torsional patterns are more concerning for central disease.","evidence":"Strong acute-vestibular-syndrome literature.","tags":["spontaneous nystagmus","vertigo","vestibular","central vertigo","CN"],"refs":[{"label":"HINTS meta-analysis","url":"https://pubmed.ncbi.nlm.nih.gov/36453134/"},{"label":"Acute dizziness diagnostic approach","url":"https://pubmed.ncbi.nlm.nih.gov/29395695/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Ptosis inspection","purpose":"Identifies eyelid droop and associated patterns that help separate CN III, sympathetic, NMJ, and mechanical causes.","localization":"CN III levator palpebrae, sympathetic Müller's muscle, neuromuscular junction, or local eyelid/orbital pathology.","perform":"Compare upper-lid position at primary gaze. Look for associated anisocoria, extraocular-movement deficit, fatigability, lid retraction, and variability.","abnormal":"Marked ptosis with a large pupil/EOM deficit raises concern for CN III pathology; mild ptosis with miosis suggests Horner syndrome; variable/fatigable ptosis suggests NMJ disease.","evidence":"Core neuro-ophthalmic examination.","tags":["ptosis","Horner","CN III","myasthenia","NMJ","CN"],"refs":[{"label":"Neuro-ophthalmological examination review","url":"https://pubmed.ncbi.nlm.nih.gov/21601063/"},{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Pupillary light response","purpose":"Tests afferent CN II input and bilateral parasympathetic CN III efferent response.","localization":"Afferent retina/optic nerve → pretectal nuclei; efferent Edinger-Westphal/CN III/ciliary ganglion.","perform":"In dim light, illuminate each eye from below/side and observe direct and consensual constriction. Compare pupil size before stimulation and speed/amplitude of response.","abnormal":"Absent direct and consensual response when one eye is illuminated suggests afferent failure; anisocoria plus efferent abnormalities suggests parasympathetic or sympathetic dysfunction.","evidence":"Core neuro-ophthalmic examination maneuver.","tags":["pupil","light reflex","CN II","CN III","anisocoria","optic nerve","CN"],"refs":[{"label":"Neuro-ophthalmological examination review","url":"https://pubmed.ncbi.nlm.nih.gov/21601063/"},{"label":"Bedside neuro-ophthalmology examination","url":"https://pubmed.ncbi.nlm.nih.gov/12870107/"}],"pitfalls":"","tool":"rapd","generalize":""},{"section":"CN","title":"Red desaturation","purpose":"Asymmetric optic neuropathy / afferent visual dysfunction.","perform":"Test each eye separately with the same vivid red stimulus and ask whether saturation differs.","abnormal":"One eye perceives the same target as washed out/desaturated.","evidence":"A/B — correlates strongly with RAPD in asymmetric optic neuropathy.","tags":["red desaturation","optic neuritis","optic neuropathy","RAPD","vision","CN","multiple sclerosis"],"refs":[{"label":"Color/brightness vs RAPD","url":"https://pubmed.ncbi.nlm.nih.gov/17652731/"},{"label":"Neuro-ophthalmological examination review","url":"https://pubmed.ncbi.nlm.nih.gov/21601063/"}],"pitfalls":"","localization":"Afferent visual pathway, especially optic nerve when asymmetric.","tool":"red","generalize":"Best used as an inter-eye comparison. You can also ask whether the same red target looks different in different field locations, but quadrant comparisons are much less standardized and should prompt formal visual-field/ophthalmic testing rather than being treated as a quantitative result."},{"section":"CN","title":"Rinne test","purpose":"Compares air versus bone conduction in each ear.","localization":"Conductive hearing apparatus versus cochlea/CN VIII.","perform":"Activate a 512-Hz tuning fork, place on mastoid until no longer heard, then move next to the ear canal without re-striking.","abnormal":"Air > bone is normal or sensorineural loss; bone ≥ air suggests conductive loss. Combine with Weber rather than interpreting alone.","evidence":"Classic bedside hearing test; moderate diagnostic performance depending on degree of loss.","tags":["Rinne","hearing loss","CN VIII","sensorineural","conductive","tuning fork","CN"],"refs":[{"label":"Neurologic examination methods review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"},{"label":"Comprehensive neuro-ophthalmology examination review","url":"https://pubmed.ncbi.nlm.nih.gov/21601063/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Saccades","purpose":"Rapid conjugate eye movements; cortical, brainstem, cerebellar ocular-motor systems.","perform":"Ask the patient to alternate fixation between two stationary targets horizontally and vertically.","abnormal":"Hypometric/hypermetric saccades, slowing, latency, asymmetry, or inability to initiate.","evidence":"B/C — phenomenologically useful; interpretation depends on pattern and context.","tags":["saccades","eye movements","PSP","cerebellar","brainstem","CN","oculomotor"],"refs":[{"label":"Bedside ocular motor examination review","url":"https://pubmed.ncbi.nlm.nih.gov/36453134/"},{"label":"Comprehensive neuro-ophthalmology examination review","url":"https://pubmed.ncbi.nlm.nih.gov/21601063/"}],"pitfalls":"","localization":"Frontal eye fields/superior colliculus/paramedian pontine reticular formation or riMLF, with cerebellar calibration.","tool":null,"generalize":""},{"section":"CN","title":"Shoulder shrug","purpose":"Tests trapezius strength.","localization":"Ipsilateral spinal accessory nerve (CN XI) and cervical motor contributions.","perform":"Ask the patient to elevate both shoulders while you press downward symmetrically.","abnormal":"Reduced shoulder elevation or easy depression on one side indicates trapezius weakness; inspect for scapular position/atrophy.","evidence":"Routine CN XI examination.","tags":["shoulder shrug","trapezius","CN XI","spinal accessory","CN"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Smile / lower facial activation","purpose":"Tests lower facial motor output and corticobulbar asymmetry.","localization":"Contralateral corticobulbar pathway for central lower-face weakness; ipsilateral CN VII for peripheral weakness.","perform":"Ask the patient to show teeth or smile symmetrically. Compare nasolabial fold depth and corner-of-mouth excursion.","abnormal":"Isolated lower-face weakness with preserved forehead movement favors a opposite-side (contralateral) central lesion; upper + lower facial weakness favors same-side (ipsilateral) peripheral/nuclear CN VII disease.","evidence":"Classic facial-localization maneuver.","tags":["smile","lower facial weakness","CN VII","stroke","central facial palsy","CN"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Smooth pursuit","purpose":"Cerebellar/brainstem/cortical ocular-motor tracking.","perform":"Move a fixation target smoothly horizontally and vertically while the patient follows with eyes only.","abnormal":"Saccadic pursuit, marked asymmetry, or inability out of proportion to vision/attention.","evidence":"B/C — useful descriptive ocular-motor sign; not a stand-alone localization test.","tags":["pursuit","eye movements","cerebellar","brainstem","nystagmus","CN","vertigo","dizziness"],"refs":[{"label":"Bedside ocular motor examination review","url":"https://pubmed.ncbi.nlm.nih.gov/36453134/"},{"label":"Comprehensive neuro-ophthalmology examination review","url":"https://pubmed.ncbi.nlm.nih.gov/21601063/"}],"pitfalls":"","localization":"Distributed occipito-parietal-frontal pursuit network, cerebellum, vestibular nuclei, and brainstem gaze pathways.","tool":null,"generalize":""},{"section":"CN","title":"Sustained upgaze fatigability","purpose":"Fatigable ptosis in myasthenia gravis.","perform":"Document baseline lid position, then have the patient maintain upgaze for up to ~2 minutes and reassess ptosis.","abnormal":"Worsening ptosis with sustained activation.","evidence":"B — supportive but imperfect sensitivity/specificity.","tags":["myasthenia","MG","neuromuscular","NMJ","ptosis","fatigability","CN"],"refs":[{"label":"Ocular MG bedside tests","url":"https://pubmed.ncbi.nlm.nih.gov/22361625/"},{"label":"Neuro-ophthalmological examination review","url":"https://pubmed.ncbi.nlm.nih.gov/21601063/"}],"pitfalls":"","localization":"Neuromuscular junction when ptosis fatigues; can also be limited by mechanical/central causes.","tool":"timer","generalize":""},{"section":"CN","title":"Swinging flashlight test (RAPD)","purpose":"Relative afferent pupillary defect from asymmetric retinal/optic-nerve disease.","perform":"In dim light, illuminate one eye for ~3 seconds, rapidly swing to the other for ~3 seconds, and repeat while observing both pupils.","abnormal":"Paradoxical dilation or less constriction when light is moved to the affected eye.","evidence":"A/B — standardized timing correlates with neutral-density filter quantification.","tags":["RAPD","Marcus Gunn pupil","pupil","optic nerve","retina","optic neuritis","CN"],"refs":[{"label":"Standardized swinging flashlight test","url":"https://pubmed.ncbi.nlm.nih.gov/8328935/"},{"label":"Neuro-ophthalmological examination review","url":"https://pubmed.ncbi.nlm.nih.gov/21601063/"}],"pitfalls":"","localization":"Afferent limb: retina/optic nerve; efferent limb: parasympathetic CN III pathway.","tool":"rapd","generalize":""},{"section":"CN","title":"Tongue at rest: bulk and fasciculations","purpose":"Looks for lower motor neuron/bulbar denervation.","localization":"Hypoglossal nucleus/nerve or more diffuse motor-neuron disease affecting tongue motor units.","perform":"Ask the patient to rest the tongue loosely in the mouth. Inspect both sides for focal atrophy and spontaneous fasciculations before asking for movement.","abnormal":"Focal tongue atrophy/fasciculations support lower motor neuron disease. Fine normal movements should not be overcalled as fasciculations.","evidence":"Routine bulbar LMN examination.","tags":["tongue atrophy","tongue fasciculations","CN XII","ALS","bulbar","CN"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Tongue protrusion","purpose":"Tests hypoglossal motor symmetry.","localization":"CN XII nucleus/nerve and corticobulbar pathways.","perform":"Ask the patient to protrude the tongue straight out and hold it. Then move it rapidly left/right.","abnormal":"With a unilateral LMN CN XII lesion, the tongue typically deviates toward the weak side. Supranuclear patterns can be subtler and are less reliable in isolation.","evidence":"Classic hypoglossal localization maneuver.","tags":["tongue deviation","CN XII","hypoglossal","bulbar","CN"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Tongue strength","purpose":"Tests lingual motor strength, especially useful in bulbar weakness.","localization":"CN XII motor unit, neuromuscular junction, or corticobulbar systems depending on pattern.","perform":"Ask the patient to push the tongue firmly into each cheek while you resist from outside with a finger.","abnormal":"Clear side-to-side force asymmetry suggests focal tongue weakness; bilateral weakness can occur in motor neuron, NMJ, or myopathic disease.","evidence":"Routine bulbar motor examination.","tags":["tongue strength","CN XII","bulbar weakness","ALS","myasthenia","CN"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Visual acuity","purpose":"Quantifies central visual function and helps separate afferent visual loss from ocular-motor complaints.","localization":"Eye/retina/optic nerve and visual pathway; monocular acuity loss usually localizes anterior to the chiasm.","perform":"Test each eye separately with habitual correction. Use a calibrated distance/near chart when possible; record the smallest line/optotype read and whether pinhole improves acuity.","abnormal":"Reduced monocular acuity is abnormal. Pinhole improvement favors refractive blur; poor acuity with color/RAPD abnormalities raises concern for optic neuropathy.","evidence":"Smartphone VA testing has validation evidence but depends on calibration and display.","tags":["visual acuity","Snellen","logMAR","vision loss","optic nerve","CN"],"refs":[{"label":"Neuro-ophthalmological examination review","url":"https://pubmed.ncbi.nlm.nih.gov/21601063/"},{"label":"Bedside neuro-ophthalmology examination","url":"https://pubmed.ncbi.nlm.nih.gov/12870107/"},{"label":"Mobile VA systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/35156935/"}],"pitfalls":"","tool":"acuity","generalize":""},{"section":"CN","title":"Voluntary cough","purpose":"Samples glottic closure and expiratory/bulbar strength.","localization":"Vagal/recurrent laryngeal function plus respiratory muscles and corticobulbar control.","perform":"Ask for one strong cough and listen to its force and whether the patient can achieve a crisp glottic closure.","abnormal":"A weak, breathy, or 'bovine' cough suggests impaired glottic closure or respiratory weakness; it is not specific to one lesion level.","evidence":"Useful bulbar/airway bedside sign; definitive laryngeal assessment may require visualization.","tags":["cough","bulbar","CN X","vagus","respiratory weakness","CN"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"CN","title":"Weber test","purpose":"Compares bone-conducted sound between ears to distinguish conductive from sensorineural asymmetry.","localization":"External/middle ear versus cochlea/CN VIII; bedside screen, not formal audiometry.","perform":"Activate a 512-Hz tuning fork and place it firmly at the midline forehead or vertex. Ask where the sound is heard louder.","abnormal":"Lateralizes to the affected ear in conductive loss and to the better ear in sensorineural loss; interpret with Rinne.","evidence":"Traditional validated bedside hearing paradigm; accuracy depends on frequency and technique.","tags":["Weber","hearing loss","CN VIII","sensorineural","conductive","tuning fork","CN"],"refs":[{"label":"Bedside neuro-ophthalmic/cranial exam review","url":"https://pubmed.ncbi.nlm.nih.gov/12870107/"},{"label":"Comprehensive neuro-ophthalmology examination review","url":"https://pubmed.ncbi.nlm.nih.gov/21601063/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Ankle dorsiflexion strength","purpose":"Tests tibialis anterior-dominant dorsiflexion.","localization":"L4–L5 roots, predominantly L4; deep fibular/peroneal nerve.","perform":"Ask the patient to pull the foot upward toward the shin while you press down on the dorsum of the foot.","abnormal":"Weak upward ankle/foot movement (dorsiflexion) occurs in L4/L5 radiculopathy and fibular neuropathy. Test inversion and eversion to distinguish them.","evidence":"Structured lower-limb manual muscle testing is a core localization method.","tags":["dorsiflexion","foot drop","L4","L5","deep peroneal","Motor"],"refs":[{"label":"Structured manual muscle testing of the lower limbs","url":"https://pubmed.ncbi.nlm.nih.gov/37928783/"},{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Ankle eversion strength","purpose":"Tests fibularis/peroneus longus and brevis.","localization":"L5–S1 roots, superficial fibular/peroneal nerve.","perform":"Ask the patient to turn the sole outward while you resist at the lateral forefoot.","abnormal":"Weak eversion accompanies common/superficial fibular neuropathy and L5 lesions; pair with inversion to distinguish levels.","evidence":"Structured lower-limb manual muscle testing is a core localization method.","tags":["ankle eversion","L5","superficial peroneal","fibular neuropathy","Motor"],"refs":[{"label":"Structured manual muscle testing of the lower limbs","url":"https://pubmed.ncbi.nlm.nih.gov/37928783/"},{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Ankle inversion strength","purpose":"Tests tibialis posterior/anterior contribution and is useful in foot-drop localization.","localization":"L4–L5 roots; tibial nerve is important for tibialis posterior, unlike common fibular neuropathy.","perform":"Ask the patient to turn the sole inward while you resist at the medial forefoot.","abnormal":"Weak inversion supports L5/root or more proximal sciatic/plexus disease; preserved inversion with upward ankle/foot movement (dorsiflexion)/eversion weakness favors common fibular neuropathy.","evidence":"Structured lower-limb manual muscle testing is a core localization method.","tags":["ankle inversion","L5","tibial nerve","fibular neuropathy","foot drop","Motor"],"refs":[{"label":"Structured manual muscle testing of the lower limbs","url":"https://pubmed.ncbi.nlm.nih.gov/37928783/"},{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Barré leg drift","purpose":"Subtle lower-extremity pyramidal weakness.","localization":"Contralateral corticospinal tract above the lumbosacral motor neurons.","perform":"Prone: flex both knees to ~90° and ask the patient to maintain the position with eyes closed; alternatively use supine hip/knee flexion when prone positioning is impractical.","abnormal":"Gradual downward drift of one leg suggests pyramidal weakness; pain/orthopedic limitations can confound.","evidence":"Traditional bedside maneuver; evidence is less extensive than for pronator drift.","tags":["Barre leg","leg drift","subtle weakness","UMN","corticospinal","Motor"],"refs":[{"label":"Subtle motor deficit study","url":"https://pubmed.ncbi.nlm.nih.gov/12463489/"},{"label":"FND diagnostic-accuracy systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/36868109/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Co-contraction sign","purpose":"Functional weakness from simultaneous antagonist activation.","perform":"Palpate agonist and antagonist while the patient attempts an isolated movement against resistance.","abnormal":"Strong simultaneous antagonist contraction producing little net movement supports functional weakness.","evidence":"B/C — low sensitivity but high specificity in small controlled studies.","tags":["co-contraction","functional","FND","weakness","Motor","antagonist"],"refs":[{"label":"Functional weakness review","url":"https://link.springer.com/article/10.1007/s00415-025-13139-4"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Positive sign of functional motor disorder; does not localize to a structural neuroanatomic lesion.","tool":null,"generalize":""},{"section":"Motor","title":"Drift without pronation","purpose":"Functional arm weakness.","perform":"Arms extended, palms fully supinated, fingers together, eyes closed ~10 seconds.","abnormal":"Downward drift without the expected pronation of pyramidal weakness supports functional weakness.","evidence":"A/B — reported sensitivity 100% and specificity 93% in a validation study.","tags":["drift without pronation","functional","FND","arm weakness","pronator drift","Motor"],"refs":[{"label":"Drift without pronation validation","url":"https://pubmed.ncbi.nlm.nih.gov/23548051/"},{"label":"FND diagnostic-accuracy systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/36868109/"}],"pitfalls":"","localization":"Positive sign of functional motor disorder; does not localize to a structural neuroanatomic lesion.","tool":null,"generalize":""},{"section":"Motor","title":"Elbow extension strength","purpose":"Tests triceps-dominant elbow extension.","localization":"C7 root (with C6/C8 contribution), radial nerve.","perform":"Start with elbow flexed and ask the patient to straighten it while you resist above the wrist.","abnormal":"Weakness with reduced triceps reflex and middle-finger sensory symptoms supports C7 radiculopathy; broader radial-pattern weakness suggests radial neuropathy.","evidence":"Routine manual muscle testing; interpret strength together with reflexes and sensory distribution.","tags":["elbow extension","C7","radial nerve","triceps","Motor"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Elbow flexion strength","purpose":"Tests biceps/brachialis-dominant elbow flexion.","localization":"C5–C6 roots, musculocutaneous nerve.","perform":"With elbows partly flexed and forearms supinated, pull the forearms toward extension while the patient resists.","abnormal":"Weakness with biceps/brachioradialis reflex loss supports C5–C6/root or musculocutaneous localization depending on accompanying findings.","evidence":"Routine manual muscle testing; interpret strength together with reflexes and sensory distribution.","tags":["elbow flexion","C5","C6","musculocutaneous","biceps","Motor"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Elbow flexion-extension sign","purpose":"Functional unilateral upper-limb weakness based on automatic contralateral force generation.","perform":"Hold both forearms with elbows slightly flexed. Ask the normal arm to flex or extend strongly while feeling for automatic opposing force in the weak arm.","abnormal":"Automatic force inconsistent with claimed severe weakness supports functional etiology.","evidence":"B — promising single-cohort validation.","tags":["elbow flexion extension","functional","FND","arm weakness","Motor"],"refs":[{"label":"Elbow flex-ex sign","url":"https://pubmed.ncbi.nlm.nih.gov/23695497/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Positive sign of functional motor disorder; does not localize to a structural neuroanatomic lesion.","tool":null,"generalize":""},{"section":"Motor","title":"Fasciculation inspection","purpose":"Looks for spontaneous motor-unit discharges visible under the skin.","localization":"Anterior horn cell, root, peripheral nerve, or benign fasciculation syndromes; distribution and accompanying weakness matter.","perform":"Observe relaxed muscles for at least several seconds, especially tongue, shoulder girdle, arms, thighs, and calves when clinically relevant.","abnormal":"Fasciculations become more concerning for active lower motor neuron disease when accompanied by weakness, atrophy, and neurogenic reflex patterns.","evidence":"Routine LMN examination; fasciculations alone are nonspecific.","tags":["fasciculations","LMN","ALS","motor neuron disease","Motor"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Finger abduction sign","purpose":"Functional severe unilateral arm weakness.","perform":"In severe arm weakness, resist maximal finger abduction of the normal hand while observing for synkinetic abduction on the weak side, especially digit 5.","abnormal":"Preserved involuntary abduction despite claimed severe paralysis supports functional weakness.","evidence":"B — excellent performance in a small blinded cohort.","tags":["finger abduction","functional","FND","arm weakness","functional weakness","Motor"],"refs":[{"label":"Finger abduction sign","url":"https://movementdisorders.onlinelibrary.wiley.com/doi/10.1002/mds.22268"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Positive sign of functional motor disorder; does not localize to a structural neuroanatomic lesion.","tool":null,"generalize":""},{"section":"Motor","title":"Finger abduction strength","purpose":"Tests dorsal interossei.","localization":"T1>C8 roots, ulnar nerve.","perform":"Have the patient spread fingers apart while you push them together, testing both hands symmetrically.","abnormal":"Weak finger abduction suggests ulnar neuropathy or C8–T1/root/lower-trunk pathology; sensory/reflex/other muscle findings distinguish them.","evidence":"Routine manual muscle testing; interpret strength together with reflexes and sensory distribution.","tags":["finger abduction strength","ulnar nerve","T1","C8","interossei","Motor"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Finger extension strength","purpose":"Tests extensor digitorum/posterior interosseous function.","localization":"C7–C8 roots, posterior interosseous branch of radial nerve.","perform":"With MCP joints flexed slightly, ask the patient to straighten fingers at the MCP joints against your resistance.","abnormal":"Finger-extension weakness with preserved wrist extension/sensation strongly suggests posterior interosseous neuropathy; C7–C8 root disease usually has additional deficits.","evidence":"Routine manual muscle testing; interpret strength together with reflexes and sensory distribution.","tags":["finger extension","posterior interosseous","radial nerve","C7","C8","Motor"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Finger rolling","purpose":"Subtle unilateral cerebral/corticospinal motor deficit.","perform":"Have the patient rapidly rotate index fingers around one another and compare symmetry.","abnormal":"One finger/hand orbits less or is consistently slower.","evidence":"B — among more sensitive bedside maneuvers for subtle focal deficits.","tags":["finger roll","rolling","subtle weakness","UMN","corticospinal","stroke","Motor"],"refs":[{"label":"Subtle weakness maneuvers","url":"https://pubmed.ncbi.nlm.nih.gov/20130296/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Contralateral corticospinal/cerebral motor system; useful for subtle unilateral deficits.","tool":null,"generalize":""},{"section":"Motor","title":"Finger tapping for subtle unilateral weakness","purpose":"Rapid distal movement can reveal mild pyramidal slowing even when manual strength is normal.","localization":"Contralateral corticospinal/cerebral motor system; decrement/rhythm abnormalities can instead suggest bradykinesia.","perform":"Ask for maximal rapid thumb-index taps for ~10 seconds on each side. Compare speed, excursion, interruptions, and fatigue.","abnormal":"Persistent unilateral slowing with otherwise normal coordination can support subtle corticospinal weakness; progressive decrement with bradykinetic features suggests parkinsonism.","evidence":"Validated as a subtle motor-deficit maneuver and in smartphone bradykinesia studies.","tags":["finger tapping","subtle weakness","bradykinesia","stroke","Parkinson","Motor"],"refs":[{"label":"Subtle motor deficit study","url":"https://pubmed.ncbi.nlm.nih.gov/12463489/"},{"label":"Smartphone finger tapping PD study","url":"https://pubmed.ncbi.nlm.nih.gov/27467066/"}],"pitfalls":"","tool":"tapping","generalize":""},{"section":"Motor","title":"Foot tapping","purpose":"Rapid distal lower-extremity movement for subtle weakness or bradykinesia.","localization":"Contralateral corticospinal system or basal-ganglia bradykinesia depending on phenotype.","perform":"With heel supported, ask the patient to tap the forefoot up/down as quickly and widely as possible for ~10 seconds; compare sides.","abnormal":"Marked unilateral slowing, reduced amplitude, or decrement is abnormal. Interpret alongside strength, tone, reflexes, and gait.","evidence":"Common neurologic/movement-disorder bedside maneuver; quantitative validation is emerging.","tags":["foot tapping","bradykinesia","subtle weakness","Parkinson","Motor"],"refs":[{"label":"Smartphone motor testing PD","url":"https://pubmed.ncbi.nlm.nih.gov/27061062/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":"tapping","generalize":""},{"section":"Motor","title":"Forearm rolling","purpose":"Mild unilateral UMN/cerebral dysfunction.","perform":"Hold forearms horizontally and rapidly rotate one around the other.","abnormal":"The weaker forearm makes less excursion while the normal arm tends to orbit it.","evidence":"B — specific adjunct with variable sensitivity.","tags":["forearm roll","subtle weakness","UMN","corticospinal","stroke","Motor"],"refs":[{"label":"Subtle weakness maneuvers","url":"https://pubmed.ncbi.nlm.nih.gov/20130296/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Contralateral corticospinal/cerebral motor system; useful for subtle unilateral deficits.","tool":null,"generalize":""},{"section":"Motor","title":"Give-way / collapsing weakness","purpose":"Functional weakness when abrupt collapse is inconsistent with anatomy and effort can be demonstrated elsewhere.","perform":"Apply gradually increasing resistance to a sustained contraction rather than sudden pressure.","abnormal":"Abrupt collapse with otherwise preserved power or marked inconsistency across tasks supports functional weakness.","evidence":"B/C — common positive sign, but accuracy is variable and technique-dependent.","tags":["give way","collapsing weakness","functional","FND","weakness","Motor"],"refs":[{"label":"Validated functional weakness review","url":"https://link.springer.com/article/10.1007/s00415-025-13139-4"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"Pain, fear, tremor, myoclonus and poor attention can all produce apparent give-way.","localization":"Positive sign of functional motor disorder; does not localize to a structural neuroanatomic lesion.","tool":null,"generalize":"Can be assessed in many muscle groups, but choose a joint without significant pain and apply resistance smoothly. The sign is least useful where pain, tremor, myoclonus, fatigue, or fear would reasonably make force collapse."},{"section":"Motor","title":"Gowers maneuver","purpose":"Demonstrates clinically significant proximal hip/trunk weakness during rising from the floor.","localization":"Proximal muscle groups; classically myopathy but can occur with other causes of proximal weakness.","perform":"If safe, ask the patient to rise from the floor without furniture. Observe whether they push on the thighs with their hands to 'climb' up the legs.","abnormal":"Using the hands on the thighs to compensate for weak hip/trunk extensors is a positive Gowers maneuver. It indicates proximal weakness, not a specific diagnosis.","evidence":"Classic proximal-weakness sign; interpret with age, pain, and orthopedic limitations.","tags":["Gowers","proximal weakness","myopathy","muscular dystrophy","Motor"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Great-toe extension strength","purpose":"Tests extensor hallucis longus.","localization":"L5 root, deep fibular/peroneal nerve.","perform":"Stabilize the foot and ask the patient to lift the great toe while you press it downward at the proximal phalanx.","abnormal":"Weak great-toe extension is a useful L5/deep-fibular sign but should be interpreted with ankle inversion/eversion and sensory findings.","evidence":"Structured lower-limb manual muscle testing is a core localization method.","tags":["great toe extension","EHL","L5","deep peroneal","Motor"],"refs":[{"label":"Structured manual muscle testing of the lower limbs","url":"https://pubmed.ncbi.nlm.nih.gov/37928783/"},{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Hip abduction strength","purpose":"Tests gluteus medius/minimus.","localization":"L4–S1 roots, predominantly L5; superior gluteal nerve.","perform":"Side-lying or supine, ask the patient to move the leg outward while you resist above the lateral knee.","abnormal":"Weakness is useful for L5/superior-gluteal localization and may produce pelvic drop during gait.","evidence":"Structured lower-limb manual muscle testing is a core localization method.","tags":["hip abduction strength","L5","superior gluteal","gluteus medius","Motor"],"refs":[{"label":"Structured manual muscle testing of the lower limbs","url":"https://pubmed.ncbi.nlm.nih.gov/37928783/"},{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Hip abductor sign","purpose":"Functional unilateral leg weakness using automatic synergistic activation.","perform":"Test hip abduction directly. Then resist abduction of the opposite leg while monitoring involuntary abduction of the weak leg.","abnormal":"Discrepancy between weak voluntary abduction and preserved synergistic activation supports functional weakness.","evidence":"B — striking original validation but small cohort; replication is limited.","tags":["hip abductor","functional","FND","nonorganic","weakness","leg weakness","Motor"],"refs":[{"label":"Abductor sign original study","url":"https://pubmed.ncbi.nlm.nih.gov/14707320/"},{"label":"FND diagnostic-accuracy systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/36868109/"}],"pitfalls":"","localization":"Positive sign of functional motor disorder; does not localize to a structural neuroanatomic lesion.","tool":null,"generalize":"Useful when Hoover is difficult to interpret, especially if hip extension is painful or mechanically limited. The same core principle—preserved automatic synergistic force despite impaired voluntary force—appears in several other validated functional motor signs."},{"section":"Motor","title":"Hip adduction strength","purpose":"Tests hip adductors.","localization":"L2–L4 roots, obturator nerve.","perform":"Place your hand between the knees and ask the patient to squeeze the legs together while you resist.","abnormal":"Isolated weakness supports obturator neuropathy; broader L2–L4 root/plexus disease produces additional deficits.","evidence":"Structured lower-limb manual muscle testing is a core localization method.","tags":["hip adduction","obturator nerve","L2","L3","L4","Motor"],"refs":[{"label":"Structured manual muscle testing of the lower limbs","url":"https://pubmed.ncbi.nlm.nih.gov/37928783/"},{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Hip extension strength","purpose":"Tests gluteus maximus-dominant hip extension.","localization":"L5–S2 roots, predominantly S1; inferior gluteal nerve.","perform":"Prone if feasible, bend the knee to reduce hamstring contribution and ask the patient to lift the thigh off the bed against resistance.","abnormal":"Weakness can occur with S1/inferior-gluteal lesions or generalized proximal weakness; compare with downward ankle/foot movement (plantarflexion) and reflexes.","evidence":"Structured lower-limb manual muscle testing is a core localization method.","tags":["hip extension","S1","inferior gluteal","gluteus maximus","Motor"],"refs":[{"label":"Structured manual muscle testing of the lower limbs","url":"https://pubmed.ncbi.nlm.nih.gov/37928783/"},{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Hip flexion strength","purpose":"Tests iliopsoas-dominant hip flexion.","localization":"L1–L3 roots, predominantly L2; femoral nerve contributes to iliacus while psoas has direct lumbar plexus branches.","perform":"Seated or supine, ask the patient to lift the thigh toward the chest while you press downward above the knee.","abnormal":"Proximal bilateral weakness can suggest myopathy; asymmetric weakness with other L2–L3 findings suggests root/plexus/femoral-region disease.","evidence":"Structured lower-limb manual muscle testing is a core localization method.","tags":["hip flexion","L2","L3","iliopsoas","proximal weakness","Motor"],"refs":[{"label":"Structured manual muscle testing of the lower limbs","url":"https://pubmed.ncbi.nlm.nih.gov/37928783/"},{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Hoover sign","purpose":"Positive sign of functional leg weakness based on involuntary synergistic hip extension.","perform":"Test weak hip extension directly. Then ask the opposite hip to flex strongly against resistance while feeling under the weak-side heel for involuntary extension.","abnormal":"Weak voluntary extension that normalizes during opposite-side (contralateral) resisted hip flexion supports functional weakness.","evidence":"A — prospective suspected-stroke cohort: specificity 100%, sensitivity ~63%.","tags":["Hoover","functional","FND","nonorganic","psychogenic","weakness","leg weakness","functional weakness","Motor"],"refs":[{"label":"Hoover sign prospective validation","url":"https://pubmed.ncbi.nlm.nih.gov/22118379/"},{"label":"FND diagnostic-accuracy systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/36868109/"}],"pitfalls":"Pain, neglect, severe opposite-side (contralateral) weakness, and poor comprehension can invalidate the sign.","localization":"Positive sign of functional motor disorder; does not localize to a structural neuroanatomic lesion.","tool":null,"generalize":"The principle is involuntary synergistic activation during a task different from the requested weak movement. For the upper limb, do not improvise a 'Hoover equivalent'; use separately described positive signs such as finger abduction, elbow flexion-extension, or drift without pronation."},{"section":"Motor","title":"Knee extension strength","purpose":"Tests quadriceps.","localization":"L2–L4 roots, predominantly L3–L4; femoral nerve.","perform":"Seated with knee flexed, ask the patient to straighten the knee while you push downward at the distal shin.","abnormal":"Weakness with reduced patellar reflex supports femoral/L3–L4 dysfunction; sensory pattern helps separate root from nerve.","evidence":"Structured lower-limb manual muscle testing is a core localization method.","tags":["knee extension","quadriceps","femoral nerve","L3","L4","Motor"],"refs":[{"label":"Structured manual muscle testing of the lower limbs","url":"https://pubmed.ncbi.nlm.nih.gov/37928783/"},{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Knee flexion strength","purpose":"Tests hamstrings.","localization":"L5–S2 roots, mainly S1; sciatic nerve branches.","perform":"With knee flexed, ask the patient to pull the heel backward while you try to straighten the knee.","abnormal":"Weakness with other sciatic/S1 findings supports peripheral/root disease; compare medial versus lateral hamstring patterns when needed.","evidence":"Structured lower-limb manual muscle testing is a core localization method.","tags":["knee flexion","hamstrings","sciatic nerve","S1","Motor"],"refs":[{"label":"Structured manual muscle testing of the lower limbs","url":"https://pubmed.ncbi.nlm.nih.gov/37928783/"},{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Mingazzini leg-hold test","purpose":"Reveals subtle lower-extremity weakness by sustained antigravity posture.","localization":"Contralateral corticospinal system or focal leg motor pathway depending on the distribution of drift.","perform":"Supine, flex both hips and knees to about 90° and ask the patient to maintain both legs in the air without touching each other. Observe for at least 10–20 seconds.","abnormal":"Gradual downward drift of one leg is abnormal. Pain, poor effort, hip disease, and inability to understand the position can mimic weakness.","evidence":"Traditional subtle-paresis maneuver; less formally validated than pronator drift.","tags":["Mingazzini","leg hold","subtle weakness","hemiparesis","corticospinal","Motor"],"refs":[{"label":"Neurologic examination: from symptoms to localization","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Muscle bulk inspection","purpose":"Looks for focal or generalized muscle atrophy/hypertrophy before formal strength testing.","localization":"Lower motor neuron, peripheral nerve, root, muscle, or disuse depending on distribution.","perform":"Compare homologous muscles side-to-side and proximal-to-distal. Inspect intrinsic hand muscles, shoulder girdle, quadriceps, anterior compartments, calves, and any symptomatic region.","abnormal":"Focal neurogenic-appearing atrophy following a nerve/root pattern supports peripheral/LMN disease; diffuse proximal wasting can suggest myopathy but is not specific.","evidence":"Routine neurologic motor examination.","tags":["muscle bulk","atrophy","LMN","neuropathy","myopathy","Motor"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Neck extension strength","purpose":"Tests axial extensor strength.","localization":"Cervical extensor muscles; can be involved in myopathy, motor-neuron disease, parkinsonian antecollis/camptocormia syndromes, or NMJ disorders.","perform":"Ask the patient to extend the head backward against resistance applied to the occiput.","abnormal":"Weakness is abnormal but nonspecific; compare with neck flexion and proximal limb strength.","evidence":"Routine neuromuscular examination maneuver.","tags":["neck extension","dropped head","myopathy","neuromuscular","Motor"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://
