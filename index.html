pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Neck flexion strength","purpose":"Screens axial/proximal weakness, often useful in neuromuscular junction disease or myopathy.","localization":"Cervical flexor muscles; generalized myopathic, NMJ, motor-neuron, or high cervical processes rather than one peripheral nerve.","perform":"Supine or seated, ask the patient to flex the neck/chin toward the chest while you apply resistance at the forehead.","abnormal":"Clear weakness, especially with preserved limb strength, can be clinically important in generalized neuromuscular disease. Interpret with respiratory/bulbar symptoms.","evidence":"Routine neuromuscular examination maneuver.","tags":["neck flexion","myopathy","myasthenia","neuromuscular","proximal weakness","Motor"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Paradoxical wrist flexion","purpose":"Functional wrist/hand weakness exploiting length-tension physiology.","perform":"Compare wrist-flexion strength in neutral versus maximally flexed wrist positions.","abnormal":"Paradoxically stronger force in the mechanically disadvantaged maximally flexed position supports functional weakness.","evidence":"A/B — 67% sensitivity / 100% specificity in one controlled study.","tags":["paradoxical wrist flexion","functional","FND","hand weakness","wrist weakness","Motor"],"refs":[{"label":"Paradoxical wrist flexion study","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7735966/"},{"label":"FND diagnostic-accuracy systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/36868109/"}],"pitfalls":"","localization":"Positive sign of functional motor disorder; does not localize to a structural neuroanatomic lesion.","tool":null,"generalize":""},{"section":"Motor","title":"Plantarflexion strength","purpose":"Tests gastrocnemius/soleus; single-leg heel raises are more sensitive than bed resistance for mild weakness.","localization":"S1–S2 roots, predominantly S1; tibial nerve.","perform":"At bedside, ask the patient to push the foot downward against your hand. If ambulatory and safe, use repeated single-leg heel raises.","abnormal":"Failure to perform repeated heel raises or clear asymmetry supports S1/tibial dysfunction; correlate with Achilles reflex.","evidence":"Structured lower-limb manual muscle testing is a core localization method.","tags":["plantarflexion","S1","tibial nerve","heel raise","Motor"],"refs":[{"label":"Structured manual muscle testing of the lower limbs","url":"https://pubmed.ncbi.nlm.nih.gov/37928783/"},{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Platysma asymmetry","purpose":"Organic counterpart that can support structural hemiparesis.","perform":"Ask the patient to open the mouth widely or flex the neck against resistance and compare platysma contraction.","abnormal":"Asymmetric platysma weakness on the paretic side supports structural corticobulbar/corticospinal disease.","evidence":"B — insensitive but highly specific for structural weakness in one cohort.","tags":["platysma","organic","structural","hemiparesis","stroke","Motor"],"refs":[{"label":"SCM/platysma study","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6174474/"},{"label":"FND diagnostic-accuracy systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/36868109/"}],"pitfalls":"","localization":"Contralateral corticobulbar pathway; asymmetry may support structural hemispheric weakness.","tool":null,"generalize":""},{"section":"Motor","title":"Pronator drift / Barré arm test","purpose":"Subtle contralateral corticospinal dysfunction.","perform":"Arms straight forward, palms fully supinated, eyes closed for ~10–20 seconds.","abnormal":"Pronation with downward drift favors pyramidal weakness.","evidence":"A — high sensitivity/specificity in unilateral cerebral motor lesions.","tags":["pronator drift","Barré","weakness","hemiparesis","corticospinal","UMN","stroke","Motor"],"refs":[{"label":"Subtle motor deficit study","url":"https://pubmed.ncbi.nlm.nih.gov/12463489/"},{"label":"FND diagnostic-accuracy systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/36868109/"}],"pitfalls":"","localization":"Contralateral corticospinal tract above the cervical enlargement; often cortical/subcortical hemispheric lesion.","tool":null,"generalize":"For lower-limb analogues use a separately described Barré/Mingazzini leg-holding maneuver rather than simply adapting the arm position. Sensory/proprioceptive drift and cerebellar upward/outward drift have different implications than pyramidal pronation/downward drift."},{"section":"Motor","title":"Scapular fixation during shoulder abduction","purpose":"Helps distinguish true deltoid weakness from scapular stabilization or pain-limited shoulder movement.","localization":"Shoulder-girdle muscles/long thoracic/accessory pathways versus axillary/C5 motor function.","perform":"Observe the scapula while the patient abducts the arm. If abduction is weak or painful, manually stabilize the scapula and repeat the movement/strength test.","abnormal":"Improved movement after scapular stabilization suggests a scapulothoracic/orthopedic contribution rather than isolated deltoid weakness.","evidence":"Clinical localization maneuver; primarily a refinement of routine shoulder testing.","tags":["scapular fixation","shoulder abduction","scapular winging","C5","axillary","Motor"],"refs":[{"label":"Neurologic examination: from symptoms to localization","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"SCM sign","purpose":"Functional hemiparesis; looks for incongruent sternocleidomastoid weakness.","perform":"Test resisted head rotation in both directions and compare with the side of limb weakness.","abnormal":"Weakness turning toward the clinically weak side is incongruent with the usual hemispheric pattern and supports functional weakness.","evidence":"B — moderate sensitivity and high specificity in a prospective study.","tags":["SCM","sternocleidomastoid","functional","FND","hemiparesis","Motor"],"refs":[{"label":"SCM/platysma study","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6174474/"},{"label":"FND diagnostic-accuracy systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/36868109/"}],"pitfalls":"","localization":"Positive sign of functional motor disorder; does not localize to a structural neuroanatomic lesion.","tool":null,"generalize":""},{"section":"Motor","title":"Shoulder abduction strength","purpose":"Tests deltoid/supraspinatus-dominant shoulder abduction.","localization":"C5 root; axillary nerve for deltoid, suprascapular nerve for supraspinatus.","perform":"Raise both arms to ~90° abduction. Press downward above the elbows while the patient resists.","abnormal":"Weakness with reduced biceps reflex/upper-arm sensory findings supports C5 radiculopathy; isolated deltoid weakness can suggest axillary neuropathy.","evidence":"Routine manual muscle testing; interpret strength together with reflexes and sensory distribution.","tags":["shoulder abduction","C5","axillary nerve","deltoid","radiculopathy","Motor"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Spinal Injuries Center test","purpose":"Functional severe leg weakness / inconsistency.","perform":"Passively position the knee flexed with foot supported, distract attention, and cautiously reduce external support while observing whether the patient maintains the posture.","abnormal":"Maintenance against gravity despite claimed severe paralysis supports functional weakness.","evidence":"B — very high accuracy in a small initial cohort.","tags":["SIC test","Spinal Injuries Center","functional","FND","leg weakness","Motor"],"refs":[{"label":"Validated functional weakness review","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12116663/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Positive sign of functional motor disorder; does not localize to a structural neuroanatomic lesion.","tool":null,"generalize":""},{"section":"Motor","title":"Thumb abduction strength (APB)","purpose":"Tests abductor pollicis brevis, useful for median neuropathy at the wrist.","localization":"C8–T1 roots, median nerve recurrent motor branch.","perform":"Place the palm up. Ask the patient to lift the thumb straight perpendicular to the palm while you push it back down.","abnormal":"Weak perpendicular thumb abduction supports median motor dysfunction; then compare other median-innervated muscles to distinguish carpal tunnel from proximal median/root disease.","evidence":"Routine manual muscle testing; interpret strength together with reflexes and sensory distribution.","tags":["thumb abduction","APB","median nerve","carpal tunnel","C8","T1","Motor"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Thumb opposition strength","purpose":"Tests thenar opposition.","localization":"C8–T1 roots, median nerve with contribution from intrinsic hand mechanics.","perform":"Ask the patient to touch thumb tip to small-finger tip and resist as you try to pull them apart.","abnormal":"Weak opposition can support median/thenar dysfunction but is less anatomically pure than APB testing; pain or arthritis can confound.","evidence":"Routine manual muscle testing; interpret strength together with reflexes and sensory distribution.","tags":["thumb opposition","median nerve","thenar","carpal tunnel","Motor"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Thumb rolling","purpose":"Very subtle distal corticospinal deficit.","perform":"Rotate thumbs rapidly around one another with hands positioned together; compare excursion and speed.","abnormal":"Reduced excursion/slowness on the affected side.","evidence":"B — small stroke cohort suggested higher sensitivity than pronator drift.","tags":["thumb roll","subtle weakness","UMN","corticospinal","stroke","Motor"],"refs":[{"label":"Thumb rolling study","url":"https://pubmed.ncbi.nlm.nih.gov/21156442/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Contralateral corticospinal/cerebral motor system; useful for subtle unilateral deficits.","tool":null,"generalize":""},{"section":"Motor","title":"Tone: paratonia / gegenhalten","purpose":"Variable involuntary resistance associated with frontal/executive dysfunction, commonly advanced dementia.","localization":"Frontal-subcortical dysfunction; not a corticospinal sign.","perform":"Move the limb passively while instructing the patient to relax. Vary the speed and direction and observe whether resistance seems to match your applied force rather than velocity.","abnormal":"Inconsistent, task-dependent opposition that increases with examiner force rather than velocity supports paratonia.","evidence":"Clinical sign with limited specificity; distinguish from rigidity and active guarding.","tags":["paratonia","gegenhalten","dementia","frontal","tone","Motor"],"refs":[{"label":"Higher cortical dysfunction bedside review","url":"https://pubmed.ncbi.nlm.nih.gov/15651306/"},{"label":"Cortical function deficits review","url":"https://pubmed.ncbi.nlm.nih.gov/19566501/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Tone: rigidity","purpose":"Velocity-independent resistance supporting parkinsonian/extrapyramidal dysfunction.","localization":"Basal-ganglia motor network; not a focal tract localization.","perform":"Passively flex/extend wrist, elbow, and neck while the patient relaxes. If subtle, ask the opposite hand to perform an activation maneuver such as opening/closing.","abnormal":"Uniform lead-pipe resistance or ratchety cogwheeling that is relatively velocity-independent supports rigidity.","evidence":"Established movement-disorder sign; severity ratings are examiner dependent.","tags":["rigidity","cogwheel","Parkinson","parkinsonism","tone","basal ganglia","Motor"],"refs":[{"label":"Parkinsonian gait/clinical syndrome review","url":"https://pubmed.ncbi.nlm.nih.gov/24132843/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Tone: spasticity","purpose":"Velocity-dependent increase in tone indicating upper motor neuron dysfunction.","localization":"Corticospinal/descending motor pathways above the tested segment; pattern often helps distinguish cerebral versus spinal disease.","perform":"With the patient relaxed, move the limb passively through the joint slowly and then rapidly. Test at more than one velocity and compare sides.","abnormal":"Velocity-dependent catch or increasing resistance favors spasticity; document distribution and any clonus rather than simply 'increased tone.'","evidence":"Core UMN examination; bedside grading is examiner-dependent.","tags":["spasticity","tone","UMN","stroke","myelopathy","Motor"],"refs":[{"label":"Neurologic examination methods review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"},{"label":"DCM systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/37903098/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Motor","title":"Wrist extension strength","purpose":"Tests wrist extensors and helps separate radial neuropathy from root disease.","localization":"C6–C7 roots, radial nerve.","perform":"Ask the patient to extend the wrist while keeping fingers relaxed; resist over the dorsum of the hand. Note whether the wrist deviates radially.","abnormal":"Weak extension suggests radial/C6–C7 dysfunction. Radial deviation during attempted extension can occur when extensor carpi ulnaris is weaker than radial wrist extensors.","evidence":"Routine manual muscle testing; interpret strength together with reflexes and sensory distribution.","tags":["wrist extension","C6","C7","radial nerve","wrist drop","Motor"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Sensory","title":"Barognosis / weight discrimination","purpose":"Tests higher-order comparison of object weight when basic sensation and strength are adequate.","localization":"Contralateral parietal association cortex with intact peripheral/proprioceptive input; not highly specific.","perform":"With vision blocked, place two visually identical objects of different known weights sequentially in the same hand and ask which is heavier. Repeat on the other side and vary order.","abnormal":"Repeated inability to discriminate a clear weight difference on one side despite intact primary sensation suggests higher-order cortical sensory dysfunction.","evidence":"Traditional cortical-sensory maneuver; modern diagnostic-accuracy data are limited.","tags":["barognosis","weight discrimination","cortical sensory","parietal","Sensory"],"refs":[{"label":"Clinical assessment of parietal lobe function","url":"https://pubmed.ncbi.nlm.nih.gov/37328276/"},{"label":"Sensory syndromes in parietal stroke","url":"https://pubmed.ncbi.nlm.nih.gov/8413950/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Sensory","title":"Bowlus–Currier maneuver","purpose":"Attempts to reveal inconsistent lateralized sensory reporting when limb identity is made cognitively difficult.","perform":"Cross arms, turn thumbs down, interlock fingers, and rotate hands inward toward the chest; then test individual digits and ask which side is abnormal.","abnormal":"Inconsistent side assignment can support nonphysiologic sensory loss.","evidence":"C — classic maneuver with limited modern validation.","tags":["Bowlus Currier","functional sensory","FND","nonorganic","Sensory"],"refs":[{"label":"Bedside functional signs review","url":"https://pubmed.ncbi.nlm.nih.gov/16791776/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Functional sensory disorder is supported by inconsistency/incongruence; no structural localization should be inferred from the positive sign alone.","tool":null,"generalize":""},{"section":"Sensory","title":"Dermatomal pin comparison","purpose":"Tests whether sensory symptoms follow a nerve-root distribution.","localization":"Spinal nerve root versus peripheral nerve/plexus depending on pattern.","perform":"Compare pin sensation at representative neighboring dermatomal regions rather than testing one isolated point. Look for a reproducible gradient that matches weakness/reflex findings.","abnormal":"A single slightly numb dermatome is weak evidence. A consistent dermatomal sensory change plus corresponding myotomal weakness/reflex change more strongly supports radiculopathy.","evidence":"Routine localization technique; dermatomes overlap substantially.","tags":["dermatome","radiculopathy","root","pinprick","Sensory"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"},{"label":"Neurodynamic tests review","url":"https://pubmed.ncbi.nlm.nih.gov/28231784/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Sensory","title":"Distal-to-proximal pin gradient","purpose":"Looks for length-dependent small-fiber sensory loss.","localization":"Distal peripheral sensory nerves, especially in polyneuropathy.","perform":"Starting distally at toes/fingers, compare pin sharpness with more proximal sites while moving gradually toward the trunk.","abnormal":"A symmetric 'stocking-glove' gradient that improves proximally supports length-dependent polyneuropathy; asymmetry or a sharp level suggests a different localization.","evidence":"Common peripheral-neuropathy examination strategy; bedside sensory measures have imperfect reliability.","tags":["stocking glove","polyneuropathy","pinprick","small fiber","Sensory"],"refs":[{"label":"Light-touch somatosensory measures systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/36794517/"},{"label":"Measures of sensation in neurologic conditions systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/21971756/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Sensory","title":"Double simultaneous stimulation / extinction","purpose":"Spatial attention and cortical sensory integration, classically parietal.","perform":"After confirming unilateral stimuli are detected, deliver unpredictable left, right, and simultaneous bilateral touches.","abnormal":"Contralesional stimulus is missed only during bilateral stimulation.","evidence":"B — established post-stroke attentional sensory phenomenon.","tags":["extinction","double simultaneous stimulation","neglect","parietal","stroke","Sensory","cortical"],"refs":[{"label":"Tactile extinction after stroke","url":"https://pubmed.ncbi.nlm.nih.gov/8091440/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Attention network, especially contralateral parietal/temporoparietal cortex.","tool":null,"generalize":"The same attentional principle can be tested visually, tactilely, or even auditorily. Cross-modal extinction patterns can help characterize spatial attention, but ensure each unilateral stimulus is reliably detected before testing simultaneous stimuli."},{"section":"Sensory","title":"Forced-choice / below-chance sensory performance","purpose":"Response validity when a truly binary discrimination is claimed to be absent.","perform":"Use a binary stimulus such as great-toe position up/down, randomized across enough trials, only when the sensory channel and cognition permit valid testing.","abnormal":"Performance substantially below chance implies information about the stimulus is being acquired despite reported inability.","evidence":"C — high specificity for non-organic responding in older literature, but does not distinguish unconscious FND from intentional symptom production.","tags":["forced choice","below chance","functional sensory","FND","symptom validity","toe position","Sensory"],"refs":[{"label":"Forced-choice symptom validity literature","url":"https://pubmed.ncbi.nlm.nih.gov/12917866/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"Interpret ethically and cautiously; this is not a malingering test.","localization":"Functional sensory disorder is supported by inconsistency/incongruence; no structural localization should be inferred from the positive sign alone.","tool":null,"generalize":""},{"section":"Sensory","title":"Graphesthesia","purpose":"Higher-order tactile processing; contralateral parietal cortical sensory function.","perform":"Confirm primary sensation is adequate. With eyes closed, trace a large number or letter on the palm using a consistent orientation.","abnormal":"Inability to identify symbols on one side despite intact primary touch and comprehension.","evidence":"B — cortical sensory deficit associated with superior-posterior parietal injury.","tags":["graphesthesia","agraphesthesia","cortical sensory","parietal","stroke","Sensory","higher cortical"],"refs":[{"label":"Cortical sensory stroke study","url":"https://pubmed.ncbi.nlm.nih.gov/8413950/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Contralateral parietal association cortex after intact primary sensation is established.","tool":null,"generalize":"The palm is easiest and most standardized. You can compare dorsal hand or sole when necessary, but thresholds and symbol recognition are less familiar there; avoid overinterpreting a difficult nonstandard site. Compare homologous sites side-to-side."},{"section":"Sensory","title":"Joint position sense","purpose":"Large-fiber proprioception / dorsal-column function.","localization":"Peripheral large fibers → dorsal columns/medial lemniscus → thalamocortical pathways.","perform":"Hold the sides of the distal phalanx to avoid pressure cues. Move the digit a small amount up or down with eyes closed and ask direction; enlarge excursions or move proximally if incorrect.","abnormal":"Repeated direction errors indicate impaired proprioception. Pair with vibration and Romberg to determine functional significance.","evidence":"Standard neurologic examination maneuver; technique is crucial to avoid tactile cues.","tags":["proprioception","joint position","dorsal column","large fiber","sensory ataxia","Sensory"],"refs":[{"label":"Neurologic exam localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Sensory","title":"Light touch","purpose":"Screens large-fiber cutaneous sensation and maps gross sensory asymmetry.","localization":"Peripheral nerve/root, dorsal column-medial lemniscus contribution, thalamus, and cortex depending on distribution.","perform":"With eyes closed, lightly touch symmetric sites using a fingertip or cotton. Ask whether the sensation is present and whether it feels the same on both sides.","abnormal":"A reproducible side-to-side or distal-proximal difference is abnormal. Map the boundary rather than recording only 'decreased sensation.'","evidence":"Light-touch testing is common but technique affects reliability; standardized pressure measures perform better.","tags":["light touch","sensory loss","numbness","neuropathy","Sensory"],"refs":[{"label":"Light-touch somatosensory measures systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/36794517/"},{"label":"Measures of sensation in neurologic conditions systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/21971756/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Sensory","title":"Midline splitting","purpose":"Classic functional sensory sign; exact sagittal sensory boundary.","perform":"Compare symmetric stimuli across the trunk/face while carefully controlling intensity and expectation.","abnormal":"Very sharp midline boundary may be incongruent with many peripheral patterns.","evidence":"C — substantially weaker than classic teaching; can occur in structural disease including thalamic stroke.","tags":["midline splitting","functional sensory","FND","stroke mimic","numbness","Sensory"],"refs":[{"label":"2026 case-control sensory signs study","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12909258/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"Do not use alone; midline splitting is neither sensitive nor specific enough to establish FND.","localization":"Functional sensory disorder is supported by inconsistency/incongruence; no structural localization should be inferred from the positive sign alone.","tool":null,"generalize":"You can test sharp hemisensory boundaries on the face/forehead and trunk, but do not treat an exact midline as diagnostic of FND. The sternum is particularly useful for *vibration splitting* because vibration is conducted through one continuous bone. Thalamic and other central lesions can still produce striking hemisensory boundaries."},{"section":"Sensory","title":"Nonanatomic sensory distribution","purpose":"Pattern incongruent with plausible nerve/root/tract anatomy; may support functional sensory symptoms in context.","perform":"Map boundaries carefully for light touch/pin, comparing with expected neuroanatomy and testing multiple modalities.","abnormal":"Sharp joint-line, geometric, or otherwise neuroanatomically implausible boundaries may support functional symptoms.","evidence":"C — supportive only; structural disease can produce surprising patterns.","tags":["functional sensory","FND","nonorganic","numbness","tingling","sensory loss","nonanatomic","Sensory"],"refs":[{"label":"Functional sensory review","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12909258/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"Never diagnose FND from distribution alone; thalamic/cortical stroke, plexopathy and small-fiber disease can look unusual.","localization":"Functional sensory disorder is supported by inconsistency/incongruence; no structural localization should be inferred from the positive sign alone.","tool":null,"generalize":""},{"section":"Sensory","title":"Pinprick","purpose":"Small-fiber spinothalamic modality; maps peripheral, dermatomal, spinal, crossed brainstem, or hemisensory patterns.","localization":"Aδ/small-fiber peripheral nerves → dorsal root → spinothalamic tract → thalamus/cortex.","perform":"Use a disposable sharp stimulus. Demonstrate the sensation first, then compare symmetric distal/proximal sites and map boundaries. Ask 'same or different?' rather than leading the patient.","abnormal":"Reduced sharpness or absent pin sensation in a reproducible neuroanatomic distribution is abnormal.","evidence":"Standard sensory examination; inter-rater reliability is only moderate unless technique is standardized.","tags":["pinprick","pain sensation","spinothalamic","small fiber","neuropathy","sensory level","Sensory"],"refs":[{"label":"Diabetic neuropathy exam reliability","url":"https://pubmed.ncbi.nlm.nih.gov/2707114/"},{"label":"Peripheral neuropathy chairside reliability review","url":"https://pubmed.ncbi.nlm.nih.gov/34952841/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Sensory","title":"Point localization","purpose":"Tests ability to localize a tactile stimulus after basic detection is intact.","localization":"Contralateral parietal somatosensory association cortex, with peripheral and primary sensory pathways required first.","perform":"With eyes closed, touch one point on the limb and ask the patient to point to the exact location with the opposite hand.","abnormal":"Large or consistent localization errors despite intact detection can support higher-order cortical sensory dysfunction.","evidence":"Traditional cortical sensory maneuver; quantitative reliability is less established than basic sensory testing.","tags":["point localization","cortical sensory","parietal","Sensory"],"refs":[{"label":"Testing sensibility review","url":"https://pubmed.ncbi.nlm.nih.gov/8393725/"},{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Sensory","title":"Repeated sensory mapping / inconsistency","purpose":"Internal inconsistency of reported sensory loss.","perform":"Map the boundary once, examine another domain, then repeat without showing the original map and compare.","abnormal":"Substantial boundary shifts not explained by attention, pain, cognition, or stimulus technique support functional symptoms.","evidence":"C — conceptually useful but definitions and validation are heterogeneous.","tags":["functional sensory","FND","inconsistency","sensory mapping","numbness","Sensory"],"refs":[{"label":"Functional sensory review","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12909258/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Functional sensory disorder is supported by inconsistency/incongruence; no structural localization should be inferred from the positive sign alone.","tool":null,"generalize":"This can be applied to face, trunk, or limbs. Change the order/direction of mapping and repeat later without showing the prior boundary. The more important finding is reproducible internal inconsistency, not whether a boundary looks unusual on a single pass."},{"section":"Sensory","title":"Saddle/perineal sensation","purpose":"Sacral root/conus/cauda equina sensory function when clinically indicated.","localization":"S2-S5 roots, cauda equina/conus medullaris.","perform":"With consent and appropriate chaperoning, compare light touch/pin in perianal/saddle distribution only when the result will affect urgent localization/management.","abnormal":"New saddle anesthesia with bladder/bowel dysfunction or leg deficits raises concern for cauda equina/conus pathology.","evidence":"High-stakes localization exam; not required routinely in every neurologic examination.","tags":["saddle anesthesia","cauda equina","conus","S2","S3","S4","S5","Sensory"],"refs":[{"label":"Neurologic exam from symptoms to localization","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Sensory","title":"Semmes-Weinstein monofilament","purpose":"Provides a more standardized touch-pressure threshold than examiner fingertip touch.","localization":"Peripheral large-fiber cutaneous sensation, especially useful in distal neuropathy.","perform":"Apply the monofilament perpendicular to the skin until it bends, using the manufacturer-specific technique and standardized test sites. Test unpredictably with eyes closed.","abnormal":"Failure to detect the specified monofilament at validated sites indicates reduced protective/light-touch sensation; interpretation depends on filament size and protocol.","evidence":"Systematic review supports monofilaments as among the better-validated light-touch pressure measures.","tags":["monofilament","Semmes Weinstein","neuropathy","light touch","diabetes","Sensory"],"refs":[{"label":"Light-touch somatosensory measures systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/36794517/"},{"label":"Measures of sensation in neurologic conditions systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/21971756/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Sensory","title":"Sensory level","purpose":"Identifies a possible spinal cord level when trunk sensation changes across a horizontal boundary.","localization":"Spinal cord; clinical level may lie below or above the structural lesion depending on tract and disease.","perform":"With the patient supine, compare pin/temperature and light touch upward from a clearly abnormal region toward normal sensation on both sides of the trunk. Confirm the transition repeatedly.","abnormal":"A reproducible horizontal level, especially with UMN signs below or sphincter symptoms, strongly raises concern for myelopathy.","evidence":"Core spinal-localization maneuver.","tags":["sensory level","myelopathy","spinal cord","transverse myelitis","Sensory"],"refs":[{"label":"Neurologic exam from symptoms to localization","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Sensory","title":"Stereognosis","purpose":"Cortical integration of tactile object recognition.","perform":"With eyes closed and primary sensation intact, place a familiar object in one hand and ask the patient to identify it by manipulation.","abnormal":"Failure on one side not explained by weakness, primary sensory loss, aphasia, or unfamiliarity.","evidence":"B — standardized stereognosis instruments show strong reliability.","tags":["stereognosis","astereognosis","cortical sensory","parietal","Sensory"],"refs":[{"label":"Stereognosis reliability","url":"https://pubmed.ncbi.nlm.nih.gov/12449346/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Contralateral parietal association cortex after intact primary sensation is established.","tool":null,"generalize":"Any familiar object with distinctive shape/texture can work (coin, key, safety pin, cap). Test each hand separately with vision excluded. For unusual objects, first confirm the patient knows what the object is by sight."},{"section":"Sensory","title":"Tactile extinction quality comparison","purpose":"Looks for subtler extinction when bilateral stimuli are both detected but the contralesional stimulus is perceived as weaker or different.","localization":"Parietal/attention network; concept extends classic double simultaneous stimulation.","perform":"After establishing unilateral sensation, deliver simultaneous comparable touches bilaterally and ask not only whether both are felt but whether they feel equally strong/similar.","abnormal":"Consistently reporting the contralesional stimulus as diminished or qualitatively altered only during bilateral stimulation can reveal subtler extinction.","evidence":"Quality-extinction methods may be more sensitive than simple present/absent double simultaneous stimulation.","tags":["quality extinction","tactile extinction","double simultaneous","parietal","Sensory"],"refs":[{"label":"Quality Extinction Test vs traditional DSS","url":"https://pubmed.ncbi.nlm.nih.gov/14589611/"},{"label":"Neglect and extinction across modalities","url":"https://pubmed.ncbi.nlm.nih.gov/17119300/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Sensory","title":"Temperature","purpose":"Small-fiber spinothalamic function; useful when pinprick is equivocal or small-fiber dysfunction is suspected.","localization":"Peripheral small fibers → spinothalamic tract → thalamocortical sensory pathways.","perform":"Use clearly cool and warm objects of safe temperature and compare sides/levels, ideally after demonstrating normal sensation.","abnormal":"Reproducible inability to distinguish warm/cool or asymmetric perception is abnormal.","evidence":"Clinically useful small-fiber modality; quantitative thermal testing is more standardized than bedside objects.","tags":["temperature","small fiber","spinothalamic","neuropathy","Sensory"],"refs":[{"label":"Diabetic neuropathy clinical vs quantitative sensory testing","url":"https://pubmed.ncbi.nlm.nih.gov/2707114/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Sensory","title":"Texture discrimination","purpose":"Tests higher-order tactile discrimination beyond simple touch detection.","localization":"Contralateral parietal somatosensory association network plus intact peripheral large-fiber input.","perform":"With eyes closed, present clearly different textured materials to one hand and ask the patient to match or distinguish them. Compare sides using the same stimuli.","abnormal":"Side-specific inability to distinguish textures despite intact light touch supports cortical/discriminative sensory dysfunction.","evidence":"Useful conceptual cortical-sensory test; standardized bedside norms are limited.","tags":["texture discrimination","cortical sensory","parietal","tactile discrimination","Sensory"],"refs":[{"label":"Clinical assessment of parietal lobe function","url":"https://pubmed.ncbi.nlm.nih.gov/37328276/"},{"label":"Sensory syndromes in parietal stroke","url":"https://pubmed.ncbi.nlm.nih.gov/8413950/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Sensory","title":"Two-point discrimination","purpose":"Tactile spatial acuity; peripheral plus cortical sensory processing.","perform":"Randomly alternate one versus two points at standardized force/separation with eyes closed, determining the smallest reliably discriminated distance.","abnormal":"Marked side-to-side threshold asymmetry or inability at distances normally perceived.","evidence":"B — can be reliable when standardized, but classic methods have psychophysical limitations.","tags":["two point discrimination","2 point","cortical sensory","peripheral nerve","Sensory","hand"],"refs":[{"label":"Two-point discrimination reliability","url":"https://pubmed.ncbi.nlm.nih.gov/28505993/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Peripheral sensory pathways plus contralateral primary/association somatosensory cortex; poor standalone localization.","tool":null,"generalize":"Can be used at fingertips, palm, face, trunk, or feet, but normal separation thresholds vary enormously by body region. For bedside localization, side-to-side comparison at homologous sites is usually more useful than applying one universal cutoff."},{"section":"Sensory","title":"Vibration splitting across a continuous bone","purpose":"Classic but weak functional sensory sign.","perform":"Apply the same tuning fork over symmetric points on a continuous bone such as sternum or frontal bone and ask about intensity.","abnormal":"Large claimed asymmetry despite common bony conduction may be inconsistent.","evidence":"C — poor specificity in older studies; associated with FND in newer work but common enough in structural disease to have low diagnostic weight.","tags":["vibration splitting","functional sensory","FND","nonorganic","tuning fork","Sensory"],"refs":[{"label":"Classic vibration splitting study","url":"https://pubmed.ncbi.nlm.nih.gov/3183653/"},{"label":"2026 sensory signs study","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12909258/"}],"pitfalls":"","localization":"Functional sensory disorder is supported by inconsistency/incongruence; no structural localization should be inferred from the positive sign alone.","tool":null,"generalize":"The classic sites are the frontal bone/forehead and sternum because each is a single continuous bony structure. Compare symmetric points using the same fork and pressure. This logic should not be casually generalized to two separate bones or joints, where true asymmetry can occur."},{"section":"Sensory","title":"Vibration with 128-Hz tuning fork","purpose":"Large-fiber/dorsal-column sensory function.","localization":"Peripheral large myelinated fibers → dorsal columns → medial lemniscus → thalamus/cortex.","perform":"Strike a 128-Hz tuning fork and place it on a distal bony prominence (great toe/DIP). Ask when vibration starts/stops; compare examiner perception and move proximally if absent.","abnormal":"Distal loss with proximal preservation suggests length-dependent large-fiber neuropathy; asymmetric or level-specific loss suggests focal/root/cord disease.","evidence":"Bedside vibration can be reliable when standardized, though inter-rater performance varies.","tags":["vibration","128 Hz","dorsal column","large fiber","neuropathy","Sensory"],"refs":[{"label":"Timed vibration reliability","url":"https://pubmed.ncbi.nlm.nih.gov/19145659/"},{"label":"Peripheral neuropathy chairside reliability review","url":"https://pubmed.ncbi.nlm.nih.gov/34952841/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Reflexes","title":"Achilles reflex","purpose":"S1–S2 muscle-stretch reflex, predominantly S1.","localization":"Tibial nerve; S1–S2 roots; sacral spinal segments; descending UMN modulation.","perform":"Slightly dorsiflex the relaxed foot and strike the Achilles tendon directly; kneeling or supine positioning may help relaxation.","abnormal":"Observe downward ankle/foot movement (plantarflexion). Loss with S1 weakness/sensory findings supports S1/tibial pathology; clonus suggests UMN hyperexcitability.","evidence":"Reflex grading has moderate inter-rater reliability; asymmetry and multi-reflex patterns are most informative.","tags":["Achilles reflex","ankle jerk","S1","tibial nerve","radiculopathy","Reflexes"],"refs":[{"label":"NINDS myotatic reflex scale reliability","url":"https://pubmed.ncbi.nlm.nih.gov/8857728/"},{"label":"Deep tendon reflexes review","url":"https://pubmed.ncbi.nlm.nih.gov/30285397/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Reflexes","title":"Anal wink","purpose":"Tests sacral reflex arc and sacral cord/root integrity.","localization":"S2–S4 sensory-motor reflex arc via pudendal pathways.","perform":"With consent and appropriate chaperoning, lightly stimulate perianal skin and observe external anal sphincter contraction.","abnormal":"Absent response can support sacral root/conus/cauda equina dysfunction when paired with other sacral findings.","evidence":"Selective high-yield maneuver in suspected conus/cauda equina or spinal cord disease.","tags":["anal wink","S2","S3","S4","cauda equina","conus","Reflexes"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Reflexes","title":"Babinski / extensor plantar response","purpose":"Pyramidal tract dysfunction.","perform":"Stroke the lateral sole from heel toward forefoot then curve medially across the ball, using a noninjurious stimulus.","abnormal":"Great-toe extension with or without fanning.","evidence":"A — highly specific but insensitive for pyramidal-tract disease.","tags":["Babinski","plantar response","UMN","pyramidal","corticospinal","stroke","Reflexes"],"refs":[{"label":"Babinski diagnostic accuracy","url":"https://pubmed.ncbi.nlm.nih.gov/24906707/"},{"label":"NINDS myotatic reflex scale reliability","url":"https://pubmed.ncbi.nlm.nih.gov/8857728/"}],"pitfalls":"","localization":"Corticospinal tract anywhere from motor cortex through spinal cord above the involved segment.","tool":null,"generalize":""},{"section":"Reflexes","title":"Biceps reflex","purpose":"C5–C6 muscle-stretch reflex, predominantly C5.","localization":"Musculocutaneous nerve; C5–C6 roots; spinal segment; descending UMN modulation.","perform":"Support the relaxed arm, place your thumb/finger over the biceps tendon, and strike your digit with the reflex hammer. Compare sides.","abnormal":"Observe elbow flexion/biceps contraction. Asymmetry or a pattern of hypo/hyperreflexia is more meaningful than an isolated numeric grade.","evidence":"Reflex grading has moderate inter-rater reliability; asymmetry and multi-reflex patterns are most informative.","tags":["biceps reflex","C5","C6","musculocutaneous","radiculopathy","Reflexes"],"refs":[{"label":"NINDS myotatic reflex scale reliability","url":"https://pubmed.ncbi.nlm.nih.gov/8857728/"},{"label":"Deep tendon reflexes review","url":"https://pubmed.ncbi.nlm.nih.gov/30285397/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Reflexes","title":"Brachioradialis reflex","purpose":"C5–C6 muscle-stretch reflex, predominantly C6.","localization":"Radial nerve; C5–C6 roots; spinal segment; descending UMN modulation.","perform":"With forearm relaxed in neutral/semi-pronation, strike the brachioradialis tendon several centimeters above the radial styloid.","abnormal":"Expected response is elbow flexion/supination. Finger flexion with reduced brachioradialis response suggests an inverted supinator pattern.","evidence":"Reflex grading has moderate inter-rater reliability; asymmetry and multi-reflex patterns are most informative.","tags":["brachioradialis","C6","radial nerve","radiculopathy","Reflexes"],"refs":[{"label":"NINDS myotatic reflex scale reliability","url":"https://pubmed.ncbi.nlm.nih.gov/8857728/"},{"label":"Deep tendon reflexes review","url":"https://pubmed.ncbi.nlm.nih.gov/30285397/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Reflexes","title":"Chaddock sign","purpose":"Alternative way to elicit an extensor plantar response when the standard Babinski maneuver is equivocal or provokes excessive withdrawal.","localization":"Corticospinal (pyramidal) tract anywhere above the lumbosacral reflex arc; it has the same localization meaning as an upgoing Babinski response.","perform":"Using a blunt object, stroke the skin just below and then forward around the outside ankle bone (lateral malleolus), continuing along the outer top edge of the foot toward the little-toe side. Watch the great toe.","abnormal":"Upward movement of the great toe, with or without spreading of the other toes, is positive. The response has the same general upper-motor-neuron significance as Babinski.","evidence":"Classic Babinski-equivalent sign; useful mainly as a confirmatory alternative rather than an independent localization test.","tags":["Chaddock","Babinski equivalent","extensor plantar","UMN","corticospinal","Reflexes"],"refs":[{"label":"Chaddock reflex / Babinski-equivalent review","url":"https://www.ncbi.nlm.nih.gov/books/NBK519555/"},{"label":"Babinski reflex clinical review","url":"https://www.ncbi.nlm.nih.gov/books/NBK397/"}],"pitfalls":"Use a blunt stimulus. A rapid whole-leg withdrawal from tickle/pain is not the same as an isolated extensor great-toe response.","tool":null,"generalize":""},{"section":"Reflexes","title":"Clonus","purpose":"Marked UMN hyperexcitability.","perform":"Rapidly dorsiflex the ankle and maintain stretch; alternatively test patellar clonus in appropriate contexts.","abnormal":"Sustained rhythmic oscillation is abnormal.","evidence":"A for rule-in — highly specific but insensitive for cervical myelopathy/UMN disease.","tags":["clonus","UMN","myelopathy","spasticity","Reflexes","corticospinal"],"refs":[{"label":"DCM signs systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/40011743/"},{"label":"Deep tendon reflex examination review","url":"https://pubmed.ncbi.nlm.nih.gov/30285397/"}],"pitfalls":"","localization":"Upper motor neuron/cervical cord dysfunction; interpret with the full reflex/myelopathy pattern.","tool":null,"generalize":""},{"section":"Reflexes","title":"Cremasteric reflex","purpose":"Tests L1–L2 reflex arc when clinically relevant.","localization":"Afferent ilioinguinal/femoral branch of genitofemoral pathways; efferent genitofemoral motor fibers; L1–L2 spinal segments.","perform":"With appropriate consent/exposure, lightly stroke the upper medial thigh and observe for same-side (ipsilateral) testicular elevation.","abnormal":"Absent response can reflect L1–L2/root/cord or peripheral pathway dysfunction but has age/technique variability.","evidence":"Traditional segmental reflex; mainly useful in selected spinal/acute scrotal contexts.","tags":["cremasteric reflex","L1","L2","spinal cord","Reflexes"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Reflexes","title":"Crossed adductor reflex","purpose":"Spread of the patellar reflex suggesting lower-extremity hyperreflexia.","localization":"Spinal reflex circuitry with reduced descending inhibition; supports UMN/myelopathic pattern rather than a single root.","perform":"With legs relaxed and slightly abducted, strike one patellar tendon while watching the opposite thigh for adduction.","abnormal":"Contralateral hip adduction after unilateral patellar percussion is abnormal when clearly reproducible and especially meaningful with other UMN signs.","evidence":"Supportive myelopathy sign; standalone diagnostic accuracy is limited.","tags":["crossed adductor","hyperreflexia","myelopathy","UMN","Reflexes"],"refs":[{"label":"DCM systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/37903098/"},{"label":"DCM clinical-sign scoping review","url":"https://pubmed.ncbi.nlm.nih.gov/40011743/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Reflexes","title":"Glabellar tap / Myerson sign","purpose":"Blink habituation / frontal-basal ganglia disinhibition; historically used in parkinsonism and frontal-release assessment.","localization":"Frontal-subcortical/basal-ganglia modulation of brainstem blink circuitry; nonspecific.","perform":"Ask the patient to look at a distant target. Tap the glabella repeatedly at a steady rate, avoiding the visual threat of the hammer.","abnormal":"Persistent blinking without habituation is abnormal but common in several neurologic disorders and older adults.","evidence":"C — limited specificity and only modest inter-rater reliability.","tags":["glabellar","Myerson","frontal release","Parkinson","primitive reflex","Reflexes"],"refs":[{"label":"Release reflexes review","url":"https://pubmed.ncbi.nlm.nih.gov/8201145/"},{"label":"Primitive-sign inter-rater reliability","url":"https://pubmed.ncbi.nlm.nih.gov/31639632/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Reflexes","title":"Gordon sign","purpose":"Alternative Babinski-family maneuver using calf compression.","localization":"Corticospinal tract dysfunction; same broad localization as Babinski.","perform":"Firmly squeeze the calf muscles while watching the great toe. Do not use this maneuver when the calf is acutely painful, swollen, injured, or there is concern for deep-vein thrombosis.","abnormal":"Upward movement of the great toe, sometimes with fanning of the other toes, is positive.","evidence":"Recognized Babinski-equivalent sign; generally less useful than standard Babinski/Chaddock because technique and reliability are less standardized.","tags":["Gordon sign","Babinski equivalent","extensor plantar","UMN","corticospinal","Reflexes"],"refs":[{"label":"Gordon reflex clinical review","url":"https://www.ncbi.nlm.nih.gov/books/NBK513343/"},{"label":"Chaddock/Babinski-equivalent review","url":"https://www.ncbi.nlm.nih.gov/books/NBK519555/"}],"pitfalls":"Avoid squeezing a calf with suspected DVT, acute injury, marked swelling, or severe pain.","tool":null,"generalize":""},{"section":"Reflexes","title":"Grasp reflex","purpose":"Primitive/frontal-release sign reflecting impaired inhibition of grasping behavior.","localization":"Contralateral medial frontal/anterior cingulate-premotor networks can be involved; also seen in diffuse cerebral disease.","perform":"Stroke the patient's palm from radial toward ulnar side while asking them to remain relaxed; avoid explicitly asking them to grasp.","abnormal":"Involuntary grasp that is difficult to release is positive, especially when asymmetric.","evidence":"C/B — asymmetry is more informative than mere presence; specificity is limited.","tags":["grasp reflex","frontal release","frontal lobe","primitive reflex","Reflexes"],"refs":[{"label":"Release reflexes review","url":"https://pubmed.ncbi.nlm.nih.gov/8201145/"},{"label":"Primitive-sign inter-rater reliability","url":"https://pubmed.ncbi.nlm.nih.gov/31639632/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Reflexes","title":"Hoffmann sign","purpose":"Pathologic finger-flexion response that can support cervical corticospinal-tract hyperexcitability / myelopathy.","perform":"Support the patient's relaxed middle finger. Hold the middle segment lightly, then press/flick the fingernail or fingertip downward and let it snap back upward. Watch the thumb and index finger rather than the finger you are flicking.","abnormal":"A positive response is involuntary thumb flexion/adduction and/or index-finger flexion after the middle finger snaps back. A positive Hoffmann sign supports an upper motor neuron pattern but can occur without symptomatic cervical cord disease, so interpret it with the rest of the exam.","evidence":"C — variable diagnostic accuracy; should not be used alone.","tags":["Hoffmann","myelopathy","cervical cord","UMN","Reflexes","hand reflex"],"refs":[{"label":"DCM clinical signs systematic review/meta-analysis","url":"https://journals.sagepub.com/doi/10.1177/21925682231209869"},{"label":"Cervical cord compression signs: accuracy/reliability","url":"https://pubmed.ncbi.nlm.nih.gov/40223840/"}],"pitfalls":"Different from Trömner: Hoffmann uses a downward flick of the middle fingernail/tip and relies on the finger snapping back; Trömner directly taps the palm-side of the fingertip. Neither sign alone diagnoses cervical myelopathy.","localization":"Upper motor neuron/cervical cord dysfunction; interpret with the full reflex/myelopathy pattern.","tool":null,"generalize":""},{"section":"Reflexes","title":"Inverted supinator reflex","purpose":"C5–6 cervical cord dysfunction / myelopathy.","perform":"Tap the brachioradialis tendon and observe for finger flexion with reduced/absent brachioradialis response.","abnormal":"Finger flexion replacing the expected brachioradialis response.","evidence":"A/B — among the more specific bedside DCM signs.","tags":["inverted supinator","myelopathy","cervical cord","C5","C6","Reflexes"],"refs":[{"label":"DCM signs systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/40011743/"},{"label":"Deep tendon reflex examination review","url":"https://pubmed.ncbi.nlm.nih.gov/30285397/"}],"pitfalls":"","localization":"Upper motor neuron/cervical cord dysfunction; interpret with the full reflex/myelopathy pattern.","tool":null,"generalize":""},{"section":"Reflexes","title":"Jaw jerk","purpose":"Trigeminal muscle-stretch reflex; helps identify bilateral corticobulbar hyperreflexia.","localization":"Afferent/efferent CN V with pontine trigeminal motor circuitry; brisk response can occur with supranuclear corticobulbar disease.","perform":"Patient lets the jaw hang slightly open. Place a finger on the chin and tap your finger gently downward with the reflex hammer.","abnormal":"A slight closure can be normal; a clearly brisk jaw jerk is more concerning when accompanied by other pseudobulbar/UMN findings.","evidence":"Reflex grading has moderate inter-rater reliability; asymmetry and multi-reflex patterns are most informative.","tags":["jaw jerk","CN V","pseudobulbar","corticobulbar","Reflexes"],"refs":[{"label":"NINDS myotatic reflex scale reliability","url":"https://pubmed.ncbi.nlm.nih.gov/8857728/"},{"label":"Deep tendon reflexes review","url":"https://pubmed.ncbi.nlm.nih.gov/30285397/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Reflexes","title":"Jendrassik reinforcement","purpose":"Facilitates lower-extremity deep tendon reflexes when the patient cannot relax or the reflex is difficult to elicit.","localization":"Modulates spinal reflex excitability; it is an examination technique rather than a lesion-localizing sign.","perform":"Ask the patient to hook flexed fingers together and pull firmly just as you strike the patellar or Achilles tendon.","abnormal":"A reflex that appears only with reinforcement can still be physiologic. Document reinforcement rather than calling the reflex pathologically brisk.","evidence":"Established reflex-examination technique.","tags":["Jendrassik","reinforcement","reflex technique","patellar","Achilles","Reflexes"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Reflexes","title":"Oppenheim sign","purpose":"Alternative Babinski-family maneuver for eliciting an extensor great-toe response.","localization":"Corticospinal tract dysfunction; same broad localization as a positive Babinski sign.","perform":"Press firmly with your thumb and fingers along the inner edge of the shin bone (tibia), moving downward from just below the knee toward the ankle while watching the great toe.","abnormal":"Upward movement of the great toe is positive. Interpret it as another way of demonstrating an extensor plantar response, not as a separate disease-specific sign.","evidence":"Classic Babinski-equivalent maneuver; modern utility is mainly redundancy when plantar stimulation is difficult or equivocal.","tags":["Oppenheim","Babinski equivalent","extensor plantar","UMN","corticospinal","Reflexes"],"refs":[{"label":"Chaddock reflex / Babinski-equivalent review","url":"https://www.ncbi.nlm.nih.gov/books/NBK519555/"},{"label":"Babinski reflex clinical review","url":"https://www.ncbi.nlm.nih.gov/books/NBK397/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Reflexes","title":"Palmomental reflex","purpose":"Primitive/frontal-release sign; low-specificity marker of diffuse cerebral disease.","localization":"Frontal-subcortical disinhibition of brainstem reflex circuitry; not a focal frontal localization.","perform":"Firmly scratch/stroke the thenar eminence from proximal to distal and observe the same-side (ipsilateral) mentalis/chin.","abnormal":"Brief same-side (ipsilateral) chin contraction is a positive response.","evidence":"C — common in older adults and several disorders; weak standalone specificity/reliability.","tags":["palmomental","frontal release","primitive reflex","dementia","Reflexes"],"refs":[{"label":"Release reflexes review","url":"https://pubmed.ncbi.nlm.nih.gov/8201145/"},{"label":"Primitive-sign inter-rater reliability","url":"https://pubmed.ncbi.nlm.nih.gov/31639632/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Reflexes","title":"Patellar reflex","purpose":"L2–L4 muscle-stretch reflex, predominantly L4.","localization":"Femoral nerve; L2–L4 roots; lumbar spinal segments; descending UMN modulation.","perform":"With knee flexed and quadriceps relaxed, strike the patellar tendon. Use Jendrassik reinforcement if needed.","abnormal":"Observe knee extension. Asymmetric loss can support femoral/L4 pathology; briskness with other UMN signs supports central disease.","evidence":"Reflex grading has moderate inter-rater reliability; asymmetry and multi-reflex patterns are most informative.","tags":["patellar reflex","knee jerk","L4","femoral nerve","radiculopathy","Reflexes"],"refs":[{"label":"NINDS myotatic reflex scale reliability","url":"https://pubmed.ncbi.nlm.nih.gov/8857728/"},{"label":"Deep tendon reflexes review","url":"https://pubmed.ncbi.nlm.nih.gov/30285397/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Reflexes","title":"Pendular patellar response","purpose":"Looks for reduced damping of a leg swing after the patellar reflex, classically associated with cerebellar hypotonia.","localization":"Cerebellar tone-regulation systems; also affected by joint mechanics and baseline tone.","perform":"With the legs hanging freely, elicit the patellar reflex and observe how many times the lower leg swings before coming to rest.","abnormal":"Several exaggerated back-and-forth swings may support cerebellar hypotonia, but this is a low-specificity classic sign and depends on relaxation and joint mechanics.","evidence":"Traditional cerebellar sign with limited modern diagnostic-accuracy data.","tags":["pendular knee jerk","pendular patellar","cerebellar","hypotonia","Reflexes"],"refs":[{"label":"Instrumented objective cerebellar examination — review","url":"https://pubmed.ncbi.nlm.nih.gov/33852136/"},{"label":"SARA usefulness/validation","url":"https://pubmed.ncbi.nlm.nih.gov/17950753/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Reflexes","title":"Rooting reflex","purpose":"Primitive/frontal-release oral reflex.","localization":"Frontal-subcortical disinhibition of brainstem oral reflex circuitry; low focal specificity.","perform":"Stroke the skin near the corner of the mouth or cheek and observe for an automatic turning/pursing movement toward the stimulus.","abnormal":"Reproducible orienting of the mouth toward the stimulus is positive. Interpret cautiously in older adults and diffuse neurologic disease.","evidence":"Classic release reflex with limited specificity.","tags":["rooting reflex","frontal release","primitive reflex","dementia","Reflexes"],"refs":[{"label":"Release reflexes clinical-utility review","url":"https://pubmed.ncbi.nlm.nih.gov/8201145/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Reflexes","title":"Schaefer sign","purpose":"Alternative Babinski-family maneuver using Achilles-tendon compression.","localization":"Corticospinal tract dysfunction; same broad localization as a positive Babinski sign.","perform":"Firmly compress the Achilles tendon between your fingers while watching the great toe.","abnormal":"Upward movement of the great toe is positive.","evidence":"Historical Babinski-equivalent sign. It can be useful when the sole cannot be tested, but evidence is much thinner than for the standard plantar response.","tags":["Schaefer","Babinski equivalent","Achilles","extensor plantar","UMN","Reflexes"],"refs":[{"label":"Chaddock reflex / Babinski-equivalent review","url":"https://www.ncbi.nlm.nih.gov/books/NBK519555/"},{"label":"Babinski reflex clinical review","url":"https://www.ncbi.nlm.nih.gov/books/NBK397/"}],"pitfalls":"Do not use when the Achilles tendon is acutely injured, very tender, or recently repaired.","tool":null,"generalize":""},{"section":"Reflexes","title":"Snout reflex","purpose":"Primitive/frontal-release reflex with limited specificity.","localization":"Frontal-subcortical disinhibition of brainstem oral reflex circuitry; common in diffuse cerebral disease and aging.","perform":"Lightly tap the midline upper lip just below the nose several times with a reflex hammer or finger.","abnormal":"Puckering/protrusion of the lips is positive. Persistent robust responses are more meaningful than a minimal single movement.","evidence":"Classic release reflex; presence alone is nonspecific and common in older adults.","tags":["snout reflex","frontal release","primitive reflex","dementia","frontal","Reflexes"],"refs":[{"label":"Release reflexes clinical-utility review","url":"https://pubmed.ncbi.nlm.nih.gov/8201145/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Reflexes","title":"Superficial abdominal reflex","purpose":"Tests a superficial cutaneous reflex that can support thoracic cord/UMN localization.","localization":"Segmental T7–T12 pathways plus descending corticospinal modulation.","perform":"With the patient supine and abdomen relaxed, lightly stroke each quadrant from lateral toward the umbilicus.","abnormal":"Normal response is local abdominal contraction with umbilical movement toward the stimulus. Consistent unilateral loss can support corticospinal or segmental disease, but bilateral absence is common with age, obesity, prior surgery, or pregnancy.","evidence":"Traditional localization sign with important physiologic confounders.","tags":["abdominal reflex","T7","T12","myelopathy","UMN","Reflexes"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Reflexes","title":"Triceps reflex","purpose":"C6–C8 muscle-stretch reflex, predominantly C7.","localization":"Radial nerve; C6–C8 roots; spinal segment; descending UMN modulation.","perform":"Support the arm so the elbow hangs relaxed, then strike the triceps tendon just above the olecranon.","abnormal":"Observe elbow extension. Reduced reflex with matching C7 weakness/sensory change supports a root/peripheral lesion.","evidence":"Reflex grading has moderate inter-rater reliability; asymmetry and multi-reflex patterns are most informative.","tags":["triceps reflex","C7","radial nerve","radiculopathy","Reflexes"],"refs":[{"label":"NINDS myotatic reflex scale reliability","url":"https://pubmed.ncbi.nlm.nih.gov/8857728/"},{"label":"Deep tendon reflexes review","url":"https://pubmed.ncbi.nlm.nih.gov/30285397/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Reflexes","title":"Trömner sign","purpose":"Pathologic finger-flexion response used to look for cervical corticospinal-tract hyperexcitability / myelopathy.","perform":"Let the hand hang relaxed. Support the middle finger lightly, then tap upward on the palm-side of the tip segment of the middle finger (the underside of the fingertip just beyond the last finger joint). Watch the thumb and index finger.","abnormal":"A positive response is brisk involuntary flexion of the thumb and/or index finger. Marked asymmetry makes the finding more convincing. Modern cervical-myelopathy reviews generally find Trömner more sensitive than Hoffmann, but it still belongs in a pattern of findings rather than being used alone.","evidence":"A/B — among more sensitive DCM signs in systematic-review literature.","tags":["Tromner","Trömner","myelopathy","cervical cord","UMN","Reflexes"],"refs":[{"label":"DCM clinical signs systematic review/meta-analysis","url":"https://journals.sagepub.com/doi/10.1177/21925682231209869"},{"label":"Cervical cord compression signs: accuracy/reliability","url":"https://pubmed.ncbi.nlm.nih.gov/40223840/"}],"pitfalls":"Different from Hoffmann: Trömner directly taps the palm-side of the middle fingertip upward; Hoffmann flicks the middle fingernail/tip downward and observes the rebound response.","localization":"Upper motor neuron/cervical cord dysfunction; interpret with the full reflex/myelopathy pattern.","tool":null,"generalize":""},{"section":"Coordination","title":"Ballistic target overshoot","purpose":"Tests hypermetria/hypometria during a rapid single-joint or pointing movement.","localization":"Ipsilateral cerebellar hemisphere and its output pathways.","perform":"Ask the patient to make a rapid movement from a fixed start position to a visible target and stop exactly on it, rather than slowly correcting toward it. Repeat several times.","abnormal":"Consistent overshoot is hypermetria; undershoot is hypometria. Cerebellar errors are typically variable and may worsen with speed.","evidence":"Ballistic tracking is among the better-performing instrumented cerebellar upper-limb tasks.","tags":["ballistic movement","hypermetria","hypometria","cerebellar","dysmetria","Coordination"],"refs":[{"label":"Instrumented objective cerebellar examination — review","url":"https://pubmed.ncbi.nlm.nih.gov/33852136/"},{"label":"SARA usefulness/validation","url":"https://pubmed.ncbi.nlm.nih.gov/17950753/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Coordination","title":"Finger chase","purpose":"Dynamic appendicular dysmetria.","perform":"Move your finger unpredictably through several positions and ask the patient to rapidly touch it with their index finger.","abnormal":"Repeated overshoot/undershoot or decomposition.","evidence":"B — validated within ataxia examination frameworks.","tags":["finger chase","dysmetria","ataxia","cerebellar","Coordination"],"refs":[{"label":"SARA examination study","url":"https://pubmed.ncbi.nlm.nih.gov/17516493/"},{"label":"Instrumented clinical examination of cerebellar ataxia review","url":"https://pubmed.ncbi.nlm.nih.gov/33852136/"}],"pitfalls":"","localization":"Ipsilateral cerebellar hemisphere/peduncles for appendicular ataxia; can be confounded by weakness or sensory loss.","tool":null,"generalize":""},{"section":"Coordination","title":"Finger-nose-finger","purpose":"Appendicular dysmetria and intention tremor.","perform":"Have the patient alternate between touching their nose and your moving finger with each arm.","abnormal":"Overshoot/undershoot, decomposition, intention tremor, or marked side-to-side asymmetry.","evidence":"B — component of validated ataxia rating systems.","tags":["finger nose finger","dysmetria","ataxia","cerebellar","Coordination","intention tremor"],"refs":[{"label":"SARA validation","url":"https://pubmed.ncbi.nlm.nih.gov/16769946/"},{"label":"Instrumented clinical examination of cerebellar ataxia review","url":"https://pubmed.ncbi.nlm.nih.gov/33852136/"}],"pitfalls":"","localization":"Ipsilateral cerebellar hemisphere/peduncles for appendicular ataxia; can be confounded by weakness or sensory loss.","tool":null,"generalize":""},{"section":"Coordination","title":"Finger-to-nose with eyes closed","purpose":"Adds proprioceptive dependence to a reaching task.","localization":"Dorsal-column/proprioceptive pathways and cerebellar coordination both contribute.","perform":"First confirm finger-to-nose with eyes open. Then repeat with eyes closed and compare whether endpoint accuracy worsens disproportionately.","abnormal":"Marked worsening only after eye closure suggests sensory/proprioceptive contribution; dysmetria present with eyes open and closed is more consistent with cerebellar dysfunction.","evidence":"Traditional sensory-versus-cerebellar differentiation maneuver.","tags":["finger nose eyes closed","sensory ataxia","proprioception","cerebellar","Coordination"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"},{"label":"Instrumented cerebellar examination review","url":"https://pubmed.ncbi.nlm.nih.gov/33852136/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Coordination","title":"Heel-knee-shin","purpose":"Lower-limb dysmetria.","perform":"Supine, place one heel on the opposite knee and slide it down the shin repeatedly.","abnormal":"Oscillation off the shin, decomposition, or clear side-to-side asymmetry.","evidence":"B — validated ataxia examination component.","tags":["heel knee shin","heel shin","dysmetria","ataxia","cerebellar","Coordination"],"refs":[{"label":"SARA validation","url":"https://pubmed.ncbi.nlm.nih.gov/16769946/"},{"label":"Instrumented clinical examination of cerebellar ataxia review","url":"https://pubmed.ncbi.nlm.nih.gov/33852136/"}],"pitfalls":"","localization":"Ipsilateral cerebellar hemisphere/peduncles for appendicular ataxia; can be confounded by weakness or sensory loss.","tool":null,"generalize":""},{"section":"Coordination","title":"Past pointing","purpose":"Compares visually guided and eyes-closed reaching for vestibular/cerebellar directional bias.","localization":"Cerebellar or vestibular systems depending on paradigm; not highly specific.","perform":"Have the patient touch your finger, raise the arm, close the eyes, then attempt to return to the same target position. Repeat several times and compare sides.","abnormal":"Consistent directional deviation can support vestibular/cerebellar dysfunction; random error is less meaningful.","evidence":"Classic sign with limited modern validation; interpret as an adjunct.","tags":["past pointing","cerebellar","vestibular","ataxia","Coordination"],"refs":[{"label":"Cerebellar instrumented exam review","url":"https://pubmed.ncbi.nlm.nih.gov/33852136/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Coordination","title":"Rapid alternating movements","purpose":"Dysdiadochokinesia / cerebellar timing.","perform":"Ask the patient to rapidly alternate pronation/supination or tap palm/dorsum on the thigh.","abnormal":"Irregular rhythm, slowed alternation, decomposition, or asymmetric excursion.","evidence":"B — standard validated ataxia examination component.","tags":["rapid alternating movements","RAM","dysdiadochokinesia","cerebellar","ataxia","Coordination"],"refs":[{"label":"SARA validation","url":"https://pubmed.ncbi.nlm.nih.gov/16769946/"},{"label":"Instrumented clinical examination of cerebellar ataxia review","url":"https://pubmed.ncbi.nlm.nih.gov/33852136/"}],"pitfalls":"","localization":"Ipsilateral cerebellar hemisphere/peduncles for appendicular ataxia; can be confounded by weakness or sensory loss.","tool":null,"generalize":""},{"section":"Coordination","title":"Rebound phenomenon (Stewart-Holmes)","purpose":"Checks braking of limb movement; can reveal cerebellar dysmetria.","localization":"Ipsilateral cerebellar hemisphere/peduncular circuitry controlling agonist-antagonist timing.","perform":"Have the patient flex the elbow against your resistance with the arm positioned safely away from the face. Warn them, then suddenly release while guarding the limb.","abnormal":"Excessive unchecked movement after release suggests impaired cerebellar braking. Use caution; do not allow the hand to strike the patient.","evidence":"Traditional cerebellar sign; standalone diagnostic accuracy is poorly quantified.","tags":["rebound","Stewart Holmes","cerebellar","ataxia","Coordination"],"refs":[{"label":"Cerebellar instrumented exam review","url":"https://pubmed.ncbi.nlm.nih.gov/33852136/"},{"label":"SARA validation","url":"https://pubmed.ncbi.nlm.nih.gov/16769946/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Coordination","title":"Rhythmic foot tapping","purpose":"Tests timing and regularity of repetitive lower-limb movement.","localization":"Ipsilateral cerebellar lower-limb timing network, with confounding from weakness/spasticity/bradykinesia.","perform":"With the heel supported, ask the patient to tap the forefoot rapidly and rhythmically for several seconds; compare sides.","abnormal":"Marked irregularity of timing/amplitude without a primary strength limitation supports cerebellar dyscoordination.","evidence":"Instrumented rhythmic foot tapping has been validated against clinical ataxia severity.","tags":["rhythmic foot tapping","cerebellar","ataxia","dysrhythmia","Coordination"],"refs":[{"label":"Instrumented objective cerebellar examination — review","url":"https://pubmed.ncbi.nlm.nih.gov/33852136/"},{"label":"SARA usefulness/validation","url":"https://pubmed.ncbi.nlm.nih.gov/17950753/"}],"pitfalls":"","tool":"tapping","generalize":""},{"section":"Coordination","title":"Rhythmic hand tapping","purpose":"Tests regularity and timing of repetitive upper-limb movement.","localization":"Ipsilateral cerebellar timing network, but bradykinesia, weakness, dystonia, and apraxia can also slow tapping.","perform":"Ask the patient to tap one finger or hand on a fixed surface at a rapid self-selected pace for several seconds, then compare sides.","abnormal":"Irregular inter-tap timing and variable amplitude support cerebellar dysrhythmia; progressive decrement is more typical of bradykinesia than cerebellar ataxia.","evidence":"Instrumented rhythmic hand tapping discriminates ataxia and correlates with ataxia severity.","tags":["rhythmic hand tapping","cerebellar","ataxia","dysrhythmia","Coordination"],"refs":[{"label":"Instrumented objective cerebellar examination — review","url":"https://pubmed.ncbi.nlm.nih.gov/33852136/"},{"label":"SARA usefulness/validation","url":"https://pubmed.ncbi.nlm.nih.gov/17950753/"}],"pitfalls":"","tool":"tapping","generalize":""},{"section":"Coordination","title":"Sitting truncal stability","purpose":"Tests axial/truncal ataxia independent of gait.","localization":"Cerebellar vermis/midline cerebellar pathways, vestibular systems, or severe sensory/postural dysfunction.","perform":"Have the patient sit unsupported with feet supported or safely positioned. Observe spontaneous sway before adding limb tasks.","abnormal":"Inability to sit steadily without limb support or marked multidirectional truncal sway is abnormal and may indicate severe midline cerebellar/vestibular dysfunction.","evidence":"Routine severe-ataxia assessment; localization is not perfectly specific.","tags":["truncal ataxia","vermis","cerebellar","sitting balance","Coordination"],"refs":[{"label":"Instrumented cerebellar examination review","url":"https://pubmed.ncbi.nlm.nih.gov/33852136/"},{"label":"SARA validation","url":"https://pubmed.ncbi.nlm.nih.gov/16769946/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Coordination","title":"Tandem stance","purpose":"Tests static balance under a narrow base before asking the patient to tandem walk.","localization":"Cerebellar, vestibular, proprioceptive, and frontal/postural systems; not a pure cerebellar test.","perform":"Place one foot directly in front of the other heel-to-toe and ask the patient to maintain the position while you guard closely. Test both foot orders if needed.","abnormal":"Inability to maintain tandem stance is abnormal but nonspecific. Compare with ordinary stance, Romberg, and tandem gait to determine the dominant system.","evidence":"Useful balance maneuver; narrow-base performance is affected by age and multiple neurologic systems.","tags":["tandem stance","balance","ataxia","vestibular","cerebellar","Coordination"],"refs":[{"label":"Tandem gait review","url":"https://pubmed.ncbi.nlm.nih.gov/28894988/"},{"label":"Instrumented objective cerebellar examination — review","url":"https://pubmed.ncbi.nlm.nih.gov/33852136/"},{"label":"SARA usefulness/validation","url":"https://pubmed.ncbi.nlm.nih.gov/17950753/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Gait","title":"10-meter walk test","purpose":"Quantifies comfortable or fast gait speed for serial comparison.","localization":"Global walking performance; it does not localize a lesion by itself.","perform":"Mark a straight 10-meter course. Use a consistent protocol with acceleration/deceleration allowance when possible and time the defined central distance or full course according to your protocol. Repeat at the same requested speed.","abnormal":"Report gait speed in m/s rather than simply 'slow.' Serial change is more useful than a single disease diagnosis. Use the same protocol each time.","evidence":"Systematic reviews support strong psychometric properties across neurologic populations; the faster of two trials has excellent interrater reliability in one standardized protocol.","tags":["10 meter walk","10MWT","gait speed","walking speed","mobility","Gait"],"refs":[{"label":"Walking/mobility measures systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/19786420/"},{"label":"10-meter walk reliability in neurologic disorders","url":"https://pubmed.ncbi.nlm.nih.gov/31281111/"}],"pitfalls":"","tool":"timer","generalize":""},{"section":"Gait","title":"180-degree turn","purpose":"Tests dynamic balance, step scaling, and freezing during direction change.","localization":"Basal-ganglia, cerebellar, vestibular, sensory, and frontal locomotor networks.","perform":"Ask the patient to walk forward and make a 180° turn at their normal pace. Count steps and observe pivoting, freezing, instability, and en-bloc turning.","abnormal":"Many small steps, freezing, or en-bloc turning can support parkinsonism; ma
