rked instability/veering can suggest cerebellar/vestibular disease.","evidence":"Turning is a high-yield part of neurologic gait assessment.","tags":["turning","180 turn","freezing","Parkinson","balance","Gait"],"refs":[{"label":"Neurological gait assessment (review)","url":"https://pubmed.ncbi.nlm.nih.gov/38135498/"},{"label":"Tandem gait in the neurologic examination (review)","url":"https://pubmed.ncbi.nlm.nih.gov/28894988/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Gait","title":"Arm swing during walking","purpose":"Looks for asymmetric or reduced automatic arm movement.","localization":"Basal-ganglia/parkinsonian networks, corticospinal disease, dystonia, shoulder pain, or peripheral weakness depending on context.","perform":"Observe spontaneous arm swing during normal walking and during a faster pace. Compare sides without instructing the patient how to swing.","abnormal":"Reduced unilateral arm swing can be an early parkinsonian clue but is nonspecific; fixed posturing may suggest dystonia or pain.","evidence":"Useful gait phenotype clue; not diagnostic alone.","tags":["arm swing","Parkinson","parkinsonism","dystonia","Gait"],"refs":[{"label":"Neurological gait assessment (review)","url":"https://pubmed.ncbi.nlm.nih.gov/38135498/"},{"label":"Tandem gait in the neurologic examination (review)","url":"https://pubmed.ncbi.nlm.nih.gov/28894988/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Gait","title":"Backward walking / running / dual-task inconsistency","purpose":"Functional gait disorder; tests whether apparently severe deficits improve with altered task demands.","perform":"If safe, compare ordinary walking with backward walking, brief jogging, tandem, or a simultaneous cognitive/motor task.","abnormal":"Unexpected improvement during a more demanding or distracted task supports functional gait disorder.","evidence":"B/C — central principle of functional gait diagnosis, but organic disorders can also improve with cueing.","tags":["backward walking","dual task","distraction","functional","FND","functional gait","Gait"],"refs":[{"label":"Functional gait review","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7455329/"},{"label":"Neurological gait assessment review","url":"https://pubmed.ncbi.nlm.nih.gov/38135498/"}],"pitfalls":"","localization":"Functional gait disorder when positive incongruence is demonstrated; not a structural localization.","tool":null,"generalize":"Vary the task systematically: backward walking, tandem, running if safe, carrying an object, rhythmic tapping, or cognitive dual task. Improvement on a harder/less attended task is supportive of FND but can also occur with organic cue-responsive disorders such as freezing or dystonia."},{"section":"Gait","title":"Base width and straight-line walking","purpose":"Assesses stance width, lateral stability, stride symmetry, and foot placement.","localization":"Cerebellar, vestibular, sensory, motor, or orthopedic systems depending on pattern.","perform":"Observe at least several meters of comfortable walking from front and behind. Note base width, step length, foot placement, and lateral veering.","abnormal":"A persistently wide base suggests balance/ataxic compensation; narrow scissoring can suggest spasticity; asymmetric stride may reflect weakness, pain, dystonia, or focal motor disease.","evidence":"Core gait phenotype assessment.","tags":["base width","stride","ataxic gait","spastic gait","walking","Gait"],"refs":[{"label":"Neurological gait assessment (review)","url":"https://pubmed.ncbi.nlm.nih.gov/38135498/"},{"label":"Tandem gait in the neurologic examination (review)","url":"https://pubmed.ncbi.nlm.nih.gov/28894988/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Gait","title":"Chair test","purpose":"Functional gait disorder / inconsistency.","perform":"Compare ordinary walking with seated propulsion in a wheeled chair using the legs, if safe and feasible.","abnormal":"Strikingly better leg performance during chair propulsion than during claimed severe gait impairment supports functional gait disorder.","evidence":"B — impressive but small original validation cohort.","tags":["chair test","functional","FND","functional gait","walking","weakness","Gait"],"refs":[{"label":"Chair test original study","url":"https://pubmed.ncbi.nlm.nih.gov/17351529/"},{"label":"Neurological gait assessment review","url":"https://pubmed.ncbi.nlm.nih.gov/38135498/"}],"pitfalls":"","localization":"Functional gait disorder when positive incongruence is demonstrated; not a structural localization.","tool":null,"generalize":""},{"section":"Gait","title":"Dragging monoplegic leg","purpose":"Functional gait pattern clue.","perform":"Observe whether the weak leg is persistently dragged behind with prolonged floor contact rather than showing a typical pyramidal circumduction pattern.","abnormal":"Characteristic dragging can support functional gait in context.","evidence":"C — highly specific but very insensitive in controlled studies.","tags":["dragging gait","functional","FND","functional gait","leg weakness","Gait"],"refs":[{"label":"Functional gait review","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7455329/"},{"label":"Neurological gait assessment review","url":"https://pubmed.ncbi.nlm.nih.gov/38135498/"}],"pitfalls":"","localization":"Functional gait disorder when positive incongruence is demonstrated; not a structural localization.","tool":null,"generalize":""},{"section":"Gait","title":"Dual-task walking","purpose":"Tests the effect of divided attention on gait.","localization":"Frontal-executive/attention systems interacting with locomotor networks; impairment is common across many neurologic disorders.","perform":"Measure or observe normal walking, then repeat while the patient performs a standardized secondary task such as serial subtraction, verbal fluency, or carrying an object. Keep the motor task the same.","abnormal":"A large decline in speed, step regularity, or stability under dual-task conditions indicates impaired cognitive-motor reserve. Unexpected improvement can be informative in functional gait but is not specific.","evidence":"Dual-task walking measures have published reliability/validity across neurologic conditions.","tags":["dual task gait","cognitive motor","executive","walking","falls","Gait"],"refs":[{"label":"Dual-task balance/walking psychometrics systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/27893997/"},{"label":"Neurological gait assessment review","url":"https://pubmed.ncbi.nlm.nih.gov/38135498/"}],"pitfalls":"","tool":"timer","generalize":""},{"section":"Gait","title":"Exaggerated sway without falling","purpose":"Functional balance/gait clue.","perform":"Observe standing and tandem stance while guarding. Compare apparent sway amplitude with actual loss of balance and stepping responses.","abnormal":"Large theatrical-appearing sway with preserved balance and unexpectedly good corrective control supports functional gait disorder.","evidence":"B/C — supportive pattern rather than a stand-alone diagnostic sign.","tags":["sway","functional","FND","functional gait","balance","Gait"],"refs":[{"label":"Functional gait review","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7455329/"},{"label":"Neurological gait assessment review","url":"https://pubmed.ncbi.nlm.nih.gov/38135498/"}],"pitfalls":"","localization":"Functional gait disorder when positive incongruence is demonstrated; not a structural localization.","tool":null,"generalize":""},{"section":"Gait","title":"Excessive effort behavior","purpose":"Functional gait clue when disproportionate to observed motor impairment.","perform":"Observe for marked grimacing, breath holding, grunting, or dramatic effort during relatively preserved walking/standing.","abnormal":"Disproportionate effort behavior supports functional gait disorder in context.","evidence":"B — specific but insensitive; increased odds of functional gait in comparative cohorts.","tags":["huffing puffing","excessive effort","functional","FND","functional gait","Gait"],"refs":[{"label":"Huffing and puffing sign study","url":"https://pubmed.ncbi.nlm.nih.gov/25961068/"},{"label":"Neurological gait assessment review","url":"https://pubmed.ncbi.nlm.nih.gov/38135498/"}],"pitfalls":"","localization":"Functional gait disorder when positive incongruence is demonstrated; not a structural localization.","tool":null,"generalize":""},{"section":"Gait","title":"Freezing provocation","purpose":"Elicits episodic freezing of gait in parkinsonism.","localization":"Basal-ganglia/frontostriatal locomotor network; commonly Parkinson disease/atypical parkinsonism.","perform":"Observe start hesitation, then have the patient perform 180°/360° turns, pass through a narrow doorway, and if safe add a cognitive dual task.","abnormal":"Brief inability or marked reduction in forward stepping despite intention to walk is freezing. Document triggers and response to visual/auditory cues.","evidence":"Supported by parkinsonian gait examination literature.","tags":["freezing of gait","FOG","Parkinson","parkinsonism","doorway","turning","Gait"],"refs":[{"label":"How do I examine Parkinsonian gait?","url":"https://pubmed.ncbi.nlm.nih.gov/30713937/"},{"label":"Parkinsonian gait review","url":"https://pubmed.ncbi.nlm.nih.gov/24132843/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Gait","title":"Gait initiation","purpose":"Tests ability to initiate stepping and looks for start hesitation/freezing.","localization":"Basal-ganglia/frontostriatal locomotor networks; frontal gait disorders can also impair initiation.","perform":"From quiet standing, ask the patient to begin walking normally without a countdown or external cue.","abnormal":"Multiple preparatory movements, start hesitation, or transient inability to step is abnormal. Re-test with a visual or rhythmic cue if freezing is suspected.","evidence":"Routine gait assessment with strong relevance to parkinsonian/frontal gait disorders.","tags":["gait initiation","start hesitation","freezing","Parkinson","frontal gait","Gait"],"refs":[{"label":"Neurological gait assessment (review)","url":"https://pubmed.ncbi.nlm.nih.gov/38135498/"},{"label":"Tandem gait in the neurologic examination (review)","url":"https://pubmed.ncbi.nlm.nih.gov/28894988/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Gait","title":"Heel walking","purpose":"Screens ankle dorsiflexor weakness, especially L4/L5-deep peroneal pathways.","localization":"L4-L5 roots, deep fibular/peroneal nerve, tibialis anterior and other dorsiflexors.","perform":"Ask the patient to walk several steps on the heels with forefeet elevated, guarding if balance is uncertain.","abnormal":"Inability to maintain upward ankle/foot movement (dorsiflexion) or unilateral foot drop supports dorsiflexor weakness; pain/balance can confound.","evidence":"Standard localization maneuver; evidence is primarily clinical/localization based.","tags":["heel walking","foot drop","L4","L5","deep peroneal","radiculopathy","Gait"],"refs":[{"label":"Neurologic exam from symptoms to localization","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"},{"label":"Neurological gait assessment review","url":"https://pubmed.ncbi.nlm.nih.gov/38135498/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Gait","title":"Knee buckling with preserved control","purpose":"Functional gait inconsistency.","perform":"Observe repeated knee buckling, then compare during faster walking, backward walking, tandem, or distraction while guarding.","abnormal":"Slow deep buckling without falling, especially if it improves during a harder task, supports functional gait disorder.","evidence":"B/C — useful incongruence sign; also seen in pain/orthopedic disease.","tags":["knee buckling","functional","FND","functional gait","walking","Gait"],"refs":[{"label":"Functional gait review","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7455329/"},{"label":"Neurological gait assessment review","url":"https://pubmed.ncbi.nlm.nih.gov/38135498/"}],"pitfalls":"","localization":"Functional gait disorder when positive incongruence is demonstrated; not a structural localization.","tool":null,"generalize":""},{"section":"Gait","title":"Romberg","purpose":"Dependence on vision for postural stability; classic firm-surface version emphasizes proprioceptive contribution.","perform":"Feet together, arms safe position, eyes open then closed while guarding.","abnormal":"Marked worsening or fall only after eye closure supports sensory/proprioceptive dependence.","evidence":"C as generic vestibular screen — not specific for vestibular disease.","tags":["Romberg","sensory ataxia","proprioception","vestibular","imbalance","Gait"],"refs":[{"label":"Modified Romberg vestibular accuracy","url":"https://pubmed.ncbi.nlm.nih.gov/21775891/"},{"label":"Neurological gait assessment review","url":"https://pubmed.ncbi.nlm.nih.gov/38135498/"}],"pitfalls":"","localization":"Posterior-column/proprioceptive or vestibular dependence when balance worsens specifically with eye closure.","tool":null,"generalize":"The standard test is firm surface, feet together, eyes open then closed. Standing on foam reduces reliable somatosensory input and increases vestibular weighting ('modified Romberg'), but it is a different test and should be documented as such."},{"section":"Gait","title":"Single-leg stance","purpose":"Tests unilateral postural control and can expose asymmetry hidden during bipedal stance.","localization":"Integrated vestibular, proprioceptive, cerebellar, motor, and musculoskeletal systems; not specifically localizing.","perform":"With close guarding, ask the patient to lift one foot and maintain single-leg stance, then repeat on the other side.","abnormal":"Marked side-to-side difference or inability to maintain stance is abnormal but nonspecific. Pair with hip abductor strength, proprioception, vestibular testing, and cerebellar examination.","evidence":"Common balance test with broad clinical use; best as an adjunct rather than a disease-specific sign.","tags":["single leg stance","balance","vestibular","proprioception","hip abductor","Gait"],"refs":[{"label":"Neurologic walking/mobility measures — systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/19786420/"},{"label":"Neurological gait assessment — review","url":"https://pubmed.ncbi.nlm.nih.gov/38135498/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Gait","title":"Sit-to-stand without arm support","purpose":"Screens functional proximal lower-extremity strength and postural transition.","localization":"Hip/knee extensors; proximal muscle, basal-ganglia, balance, and orthopedic contributions.","perform":"From a standard chair, ask the patient to stand without using the arms if safe.","abnormal":"Needing arm support can reflect proximal weakness, bradykinesia, balance impairment, pain, or deconditioning; pair with formal hip/knee strength testing.","evidence":"Routine functional motor/gait maneuver.","tags":["sit to stand","proximal weakness","myopathy","Parkinson","Gait"],"refs":[{"label":"Neurological gait assessment (review)","url":"https://pubmed.ncbi.nlm.nih.gov/38135498/"},{"label":"Tandem gait in the neurologic examination (review)","url":"https://pubmed.ncbi.nlm.nih.gov/28894988/"},{"label":"Structured manual muscle testing of the lower limbs","url":"https://pubmed.ncbi.nlm.nih.gov/37928783/"},{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Gait","title":"Tandem gait","purpose":"Amplifies mild axial/cerebellar imbalance.","perform":"Have the patient walk heel-to-toe in a straight line while guarding closely.","abnormal":"Repeated side steps, inability to maintain tandem stance, or markedly widened corrective movements.","evidence":"B — sensitive to mild cerebellar/gait impairment but not specific.","tags":["tandem gait","ataxia","cerebellar","imbalance","Gait","multiple sclerosis"],"refs":[{"label":"Tandem gait sensitivity","url":"https://pubmed.ncbi.nlm.nih.gov/12185166/"},{"label":"Neurological gait assessment review","url":"https://pubmed.ncbi.nlm.nih.gov/38135498/"}],"pitfalls":"","localization":"Midline cerebellar/vestibular/sensory systems; abnormality is sensitive but nonspecific.","tool":"timer","generalize":""},{"section":"Gait","title":"Timed Up and Go","purpose":"Functional mobility, transfers, turning, and gait speed; useful for serial quantification.","localization":"Global mobility rather than focal neuroanatomic localization.","perform":"Time the patient rising from a standard chair, walking 3 m, turning, returning, and sitting. Use the same setup for serial comparisons.","abnormal":"Longer time reflects impaired mobility/fall risk but is not disease-specific. Observe *how* the task is performed in addition to the time.","evidence":"Validated mobility measure across older adults and neurologic disorders.","tags":["Timed Up and Go","TUG","falls","mobility","gait speed","Gait"],"refs":[{"label":"Parkinsonian gait examination","url":"https://pubmed.ncbi.nlm.nih.gov/30713937/"},{"label":"Neurological gait assessment review","url":"https://pubmed.ncbi.nlm.nih.gov/38135498/"}],"pitfalls":"","tool":"timer","generalize":""},{"section":"Gait","title":"Toe walking","purpose":"Screens plantarflexor weakness, especially S1/tibial pathways.","localization":"S1 root, tibial nerve, gastrocnemius/soleus.","perform":"Ask the patient to walk several steps on the toes or perform repeated single-leg heel raises if safe.","abnormal":"Inability to maintain heel elevation or marked side-to-side difference supports plantarflexor weakness.","evidence":"Standard localization maneuver.","tags":["toe walking","S1","tibial nerve","plantarflexion","radiculopathy","Gait"],"refs":[{"label":"Neurologic exam from symptoms to localization","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"},{"label":"Neurological gait assessment review","url":"https://pubmed.ncbi.nlm.nih.gov/38135498/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Gait","title":"Unexpected pull / retropulsion test","purpose":"Tests reactive backward postural recovery.","localization":"Postural-control network, particularly basal-ganglia dysfunction in parkinsonism; abnormality also occurs in other balance disorders.","perform":"Stand behind the patient with adequate guarding. After ensuring they understand that you will prevent a fall, deliver a brisk backward shoulder pull sufficient to displace the center of mass. Use the same technique consistently.","abnormal":"More than two recovery steps, inability to recover without assistance, or falling backward is abnormal in commonly used variants. The exact result depends strongly on how the pull is delivered.","evidence":"Validated in Parkinson disease; an unexpected shoulder pull has good specificity for clinically relevant postural instability.","tags":["pull test","retropulsion","Parkinson","postural instability","falls","Gait"],"refs":[{"label":"Clinical tests of postural instability in Parkinson disease","url":"https://pubmed.ncbi.nlm.nih.gov/14639568/"},{"label":"Retropulsion test review","url":"https://pubmed.ncbi.nlm.nih.gov/25613349/"}],"pitfalls":"This is a fall-risk maneuver. Guard closely, clear the area, and do not perform when the patient cannot safely stand.","tool":null,"generalize":""},{"section":"Special Tests","title":"10-second grip-and-release test (myelopathy hand)","purpose":"Screens rapid hand opening/closing dexterity, classically used in cervical myelopathy.","localization":"Cervical spinal cord/corticospinal hand control, but arthritis, pain, peripheral neuropathy, weakness, and bradykinesia can also slow the task.","perform":"Ask the patient to fully open the hand and make a complete fist as rapidly as possible for 10 seconds. Count complete open-close cycles and watch for incomplete extension or progressive loss of rhythm.","abnormal":"A low number of complete cycles, inability to fully open the fingers, or marked irregularity is abnormal. Published thresholds vary with age and protocol, so use side-to-side comparison and overall pattern rather than one universal cutoff.","evidence":"Common myelopathy-hand test with quantitative literature; useful as part of a cervical-myelopathy exam rather than a standalone diagnosis.","tags":["grip release test","myelopathy hand","cervical myelopathy","hand dexterity","Special Tests"],"refs":[{"label":"Finger motion analysis in cervical myelopathy","url":"https://pubmed.ncbi.nlm.nih.gov/16371902/"},{"label":"Clinical review of hand manifestations in cervical myelopathy","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10982913/"}],"pitfalls":"","tool":"tapping","generalize":""},{"section":"Special Tests","title":"Anterior interosseous 'OK' sign","purpose":"Tests flexor pollicis longus and index flexor digitorum profundus supplied by the anterior interosseous nerve.","localization":"Anterior interosseous branch of median nerve; proximal median/C8–T1 lesions can affect additional muscles.","perform":"Ask the patient to make a strong tip-to-tip 'OK' circle using thumb and index finger while you try to pull the circle apart.","abnormal":"A flattened pulp-to-pulp pinch rather than a round tip-to-tip circle indicates weakness of FPL/index FDP and supports anterior interosseous dysfunction.","evidence":"Classic peripheral motor localization maneuver.","tags":["OK sign","anterior interosseous","AIN","median nerve","hand weakness","Special Tests"],"refs":[{"label":"Neurologic examination localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"},{"label":"Electrodiagnostic evaluation of median neuropathy","url":"https://pubmed.ncbi.nlm.nih.gov/33232076/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Special Tests","title":"Beevor sign","purpose":"Tests asymmetric upper-versus-lower abdominal muscle weakness by watching movement of the umbilicus during attempted trunk flexion.","localization":"Classically lower abdominal weakness from thoracic cord disease around T10–T12; also strongly associated with facioscapulohumeral muscular dystrophy (FSHD) and reported in other myopathies.","perform":"With the patient lying flat and the abdomen exposed enough to see the umbilicus, ask them to lift the head/shoulders slightly as if starting a sit-up, preferably without using the arms. Watch which way the umbilicus moves.","abnormal":"Upward movement of the umbilicus indicates relatively weaker lower abdominal muscles (classic Beevor sign). Downward movement is sometimes called an inverted Beevor sign. Sideways movement suggests asymmetric abdominal weakness.","evidence":"Classical neuromuscular/truncal sign. Studies report high specificity for FSHD but variable sensitivity; it is not pathognomonic.","tags":["Beevor","FSHD","facioscapulohumeral","abdominal weakness","T10","T12","myopathy","Special Tests"],"refs":[{"label":"Beevor sign clinical review","url":"https://www.ncbi.nlm.nih.gov/books/NBK545262/"},{"label":"Beevor sign in FSHD","url":"https://pubmed.ncbi.nlm.nih.gov/19838767/"}],"pitfalls":"Obesity, severe generalized weakness, prior abdominal surgery, pain, or inability to perform a small sit-up can make the sign hard to interpret.","tool":null,"generalize":""},{"section":"Special Tests","title":"Brudzinski sign","purpose":"Meningeal irritation adjunct.","localization":"Meninges; not focal localization.","perform":"Supine, gently flex the neck while observing hips and knees.","abnormal":"Involuntary hip/knee flexion is traditionally positive.","evidence":"C — very poor sensitivity in adult meningitis cohorts.","tags":["Brudzinski","meningitis","meningismus","Special Tests"],"refs":[{"label":"Meningeal signs prospective study","url":"https://pubmed.ncbi.nlm.nih.gov/12060874/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"A negative sign does not exclude meningitis.","tool":null,"generalize":""},{"section":"Special Tests","title":"Crossed straight-leg raise","purpose":"A high-specificity provocative maneuver for lumbosacral nerve-root irritation from a large disc herniation.","localization":"Lumbosacral nerve roots, commonly L5/S1 depending on symptom distribution.","perform":"With the patient supine, raise the asymptomatic leg with the knee straight in the same manner as a standard straight-leg raise.","abnormal":"Reproduction of the patient's usual radicular pain down the symptomatic/opposite leg is a positive crossed SLR. Hamstring stretch alone is not positive.","evidence":"Traditionally less sensitive but more specific than ipsilateral SLR for disc-related radiculopathy.","tags":["crossed straight leg raise","crossed SLR","sciatica","disc herniation","radiculopathy","Special Tests"],"refs":[{"label":"Neurodynamic tests diagnostic-accuracy review","url":"https://pubmed.ncbi.nlm.nih.gov/28231784/"},{"label":"Cervical/lumbar nerve-root provocative tests review","url":"https://pubmed.ncbi.nlm.nih.gov/17013656/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Special Tests","title":"Dix-Hallpike","purpose":"Posterior-canal BPPV.","perform":"Turn head ~45° toward tested side and rapidly recline with the neck extended ~20°, then observe for positional nystagmus.","abnormal":"Typical delayed torsional-upbeating nystagmus supports posterior-canal BPPV.","evidence":"B/C — standard maneuver; formal diagnostic-accuracy evidence is limited.","tags":["Dix Hallpike","BPPV","vertigo","dizziness","posterior canal","vestibular","Special Tests"],"refs":[{"label":"Dix-Hallpike diagnostic review","url":"https://pubmed.ncbi.nlm.nih.gov/18469678/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Posterior semicircular canal; the nystagmus pattern helps identify side/canal.","tool":null,"generalize":"If neck extension is unsafe or impractical, a side-lying positional test can be used as an alternative posterior-canal maneuver. Document the variation because the positioning and expected nystagmus geometry differ."},{"section":"Special Tests","title":"Durkan / carpal compression","purpose":"Median neuropathy at the wrist.","perform":"Apply direct pressure over the carpal tunnel for ~30 seconds.","abnormal":"Reproduction of median-distribution paresthesias.","evidence":"A — moderate sensitivity; combine with history and other findings.","tags":["Durkan","carpal compression","carpal tunnel","CTS","median nerve","hand numbness","Special Tests"],"refs":[{"label":"CTS provocative tests meta-analysis","url":"https://pubmed.ncbi.nlm.nih.gov/37621797/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Median nerve at the carpal tunnel.","tool":null,"generalize":""},{"section":"Special Tests","title":"Elbow flexion test for ulnar neuropathy","purpose":"Provokes symptoms from ulnar nerve compression around the elbow.","localization":"Ulnar nerve at cubital tunnel/retrocondylar groove.","perform":"Flex the elbow fully, usually with wrist extension, and maintain the position while asking whether familiar numbness/tingling develops in the ring/small fingers.","abnormal":"Reproduction of the patient's typical ulnar-distribution paresthesias supports ulnar neuropathy at the elbow but is not diagnostic alone.","evidence":"Provocative test with imperfect specificity; use with weakness/sensory findings and electrodiagnostics when needed.","tags":["elbow flexion test","ulnar neuropathy","cubital tunnel","ring finger","small finger","Special Tests"],"refs":[{"label":"Electrodiagnostic evaluation of ulnar neuropathy (clinical review)","url":"https://pubmed.ncbi.nlm.nih.gov/33232078/"},{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Special Tests","title":"Femoral nerve stretch","purpose":"Upper lumbar roots/femoral nerve, typically L2–L4.","perform":"Prone or side-lying, flex the knee and extend the hip while monitoring for familiar anterior-thigh symptoms.","abnormal":"Reproduction of radicular anterior-thigh pain.","evidence":"B — limited but supportive diagnostic-accuracy evidence.","tags":["femoral stretch","L2","L3","L4","lumbar radiculopathy","anterior thigh pain","Special Tests"],"refs":[{"label":"Neurodynamic tests review","url":"https://pubmed.ncbi.nlm.nih.gov/28231784/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Upper lumbar roots/femoral nerve, most often L2-L4.","tool":null,"generalize":""},{"section":"Special Tests","title":"Finger escape sign (myelopathy hand)","purpose":"Looks for loss of sustained finger adduction in cervical myelopathy.","localization":"Cervical spinal cord/corticospinal dysfunction affecting hand control. A similar abducted little finger can also occur in ulnar neuropathy, so the rest of the hand exam matters.","perform":"Ask the patient to hold the hand out with all fingers straight and together. Have them maintain that position for about 30–60 seconds while you watch the ring and little fingers.","abnormal":"Gradual drifting of the ring and especially little finger into flexion and outward separation is positive. It supports a 'myelopathy hand' pattern but does not by itself distinguish cord disease from all peripheral hand weakness.","evidence":"Recent cervical-cord-compression study: low sensitivity (~22%) but high specificity (~98%); interobserver reliability was poor, so use it as an adjunct rather than a screening test.","tags":["finger escape sign","myelopathy hand","cervical myelopathy","little finger","Ono","Special Tests"],"refs":[{"label":"Cervical cord compression signs: accuracy/reliability","url":"https://pubmed.ncbi.nlm.nih.gov/40223840/"},{"label":"Clinical review of hand manifestations in cervical myelopathy","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10982913/"}],"pitfalls":"Do not confuse this with Wartenberg sign from ulnar neuropathy. Persistent little-finger abduction can arise from either; associated reflexes, other intrinsic-hand muscles, sensation, and imaging/electrodiagnostics help separate them.","tool":null,"generalize":""},{"section":"Special Tests","title":"Froment sign","purpose":"Tests ulnar-innervated adductor pollicis weakness.","localization":"Ulnar nerve, especially deep motor branch; C8–T1 roots can mimic this when other muscles are involved.","perform":"Ask the patient to hold a piece of paper between the thumb and side of the index finger while you pull it away.","abnormal":"Flexion of the thumb interphalangeal joint means the patient is substituting median-innervated flexor pollicis longus for weak ulnar adductor pollicis: a positive Froment sign.","evidence":"Established bedside sign for ulnar motor weakness.","tags":["Froment","ulnar neuropathy","adductor pollicis","hand weakness","Special Tests"],"refs":[{"label":"Electrodiagnostic evaluation of ulnar neuropathy (clinical review)","url":"https://pubmed.ncbi.nlm.nih.gov/33232078/"},{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Special Tests","title":"Fukuda stepping test","purpose":"Classic vestibulospinal stepping maneuver, included mainly to show its limitations.","localization":"Historically proposed to detect unilateral vestibular asymmetry; evidence does not support reliable lesion-side screening.","perform":"With adequate safety and space, ask the patient to march in place with eyes closed for a standardized number of steps while you guard. Record rotation/displacement.","abnormal":"Large rotation may appear abnormal, but the test performs poorly for identifying peripheral vestibular asymmetry and should not be used to lateralize vestibular disease.","evidence":"Evidence is weak for screening: large clinical studies found poor diagnostic performance.","tags":["Fukuda","Unterberger","stepping test","vestibular","vertigo","Special Tests"],"refs":[{"label":"Fukuda sensitivity/specificity study","url":"https://pubmed.ncbi.nlm.nih.gov/19585961/"},{"label":"Vestibular screening: stepping, walking, head impulse","url":"https://pubmed.ncbi.nlm.nih.gov/24664545/"}],"pitfalls":"Use as historical/adjunctive information only; do not infer the affected vestibular side from rotation.","tool":null,"generalize":""},{"section":"Special Tests","title":"Functional tremor ballistic pause","purpose":"Positive functional tremor sign.","perform":"Ask for a sudden rapid ballistic movement of the opposite-side (contralateral) limb while observing tremor.","abnormal":"Transient interruption or marked change in tremor supports functional tremor.","evidence":"B — incorporated into validated electrophysiologic/bedside functional tremor batteries.","tags":["functional tremor","FND","tremor","ballistic movement","movement disorder","Special Tests"],"refs":[{"label":"Functional tremor testing study","url":"https://pubmed.ncbi.nlm.nih.gov/21956485/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Functional movement disorder; no structural lesion localization is implied.","tool":null,"generalize":""},{"section":"Special Tests","title":"Functional tremor distractibility","purpose":"Positive functional tremor sign.","perform":"Observe tremor while the patient performs a demanding opposite-side (contralateral) motor or cognitive task.","abnormal":"Marked reduction, interruption, or qualitative change supports functional tremor.","evidence":"A — ~92% sensitivity / 94% specificity in one diagnostic study.","tags":["functional tremor","FND","tremor","distractibility","movement disorder","Special Tests"],"refs":[{"label":"Functional tremor diagnostic study","url":"https://pubmed.ncbi.nlm.nih.gov/27346607/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Functional movement disorder; no structural lesion localization is implied.","tool":null,"generalize":"Distraction can be cognitive (serial subtraction), rhythmic, or motor (ballistic opposite-side (contralateral) movements). Different distractors are useful because one task may simply be too easy or too difficult to compete for attention."},{"section":"Special Tests","title":"Functional tremor entrainment","purpose":"Positive functional tremor sign.","perform":"Ask the unaffected limb to tap at changing externally imposed frequencies while observing the tremulous limb.","abnormal":"Tremor frequency shifts toward the imposed tapping frequency.","evidence":"A — ~91% sensitivity / 91% specificity in one diagnostic study.","tags":["functional tremor","FND","tremor","entrainment","metronome","movement disorder","Special Tests"],"refs":[{"label":"Functional tremor diagnostic study","url":"https://pubmed.ncbi.nlm.nih.gov/27346607/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Functional movement disorder; no structural lesion localization is implied.","tool":null,"generalize":"Try several clearly separated cadences (for example 1, 2, 3, and 4 Hz), and alternate tapping hand or task. Entrainment is more convincing when the tremor shifts toward more than one imposed frequency rather than merely changing once."},{"section":"Special Tests","title":"Functional tremor loading response","purpose":"Functional tremor clue.","perform":"Add a safe standardized weight to the tremulous limb and observe amplitude/frequency.","abnormal":"Paradoxical increase in tremor amplitude can support functional tremor.","evidence":"B/C — relatively specific but insensitive.","tags":["functional tremor","FND","tremor","loading","movement disorder","Special Tests"],"refs":[{"label":"Functional tremor diagnostic study","url":"https://pubmed.ncbi.nlm.nih.gov/27346607/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Functional movement disorder; no structural lesion localization is implied.","tool":null,"generalize":""},{"section":"Special Tests","title":"Head-shaking nystagmus","purpose":"Dynamic vestibular asymmetry.","perform":"Flex head ~30°, oscillate horizontally ~2 Hz for ~20–30 seconds, stop, and immediately observe for post-shake nystagmus.","abnormal":"Post-shake nystagmus can support unilateral vestibular hypofunction.","evidence":"B — high specificity but limited sensitivity against caloric testing.","tags":["head shake","nystagmus","vertigo","vestibular","dizziness","Special Tests"],"refs":[{"label":"Head-shaking nystagmus study","url":"https://pubmed.ncbi.nlm.nih.gov/16240919/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Vestibular tone asymmetry; usually peripheral but not exclusively.","tool":null,"generalize":""},{"section":"Special Tests","title":"HINTS battery","purpose":"Central vs peripheral cause in continuous acute vestibular syndrome.","perform":"Only in true AVS: perform head impulse, characterize spontaneous/gaze nystagmus, and alternate-cover test for skew. HINTS+ adds acute hearing asymmetry.","abnormal":"Any central pattern (normal HIT in AVS, direction-changing/vertical nystagmus, or skew) is concerning for central disease.","evidence":"A — excellent diagnostic accuracy in trained hands and appropriate patients.","tags":["HINTS","vertigo","dizziness","acute vestibular syndrome","stroke","vestibular","Special Tests"],"refs":[{"label":"HINTS meta-analysis","url":"https://pubmed.ncbi.nlm.nih.gov/36453134/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"Do not apply to brief episodic positional dizziness or patients without spontaneous AVS.","localization":"Peripheral vestibular system versus central brainstem/cerebellar pathology in acute vestibular syndrome.","tool":null,"generalize":""},{"section":"Special Tests","title":"Ice-pack test","purpose":"Ocular myasthenia.","perform":"Measure ptosis, apply wrapped ice to the closed lid(s) for ~2–5 minutes, then immediately reassess.","abnormal":"Improvement in ptosis, commonly ≥2 mm, supports myasthenia.","evidence":"A — systematic review supports useful diagnostic accuracy, generally high specificity.","tags":["ice pack","myasthenia","MG","neuromuscular","NMJ","ptosis","Special Tests"],"refs":[{"label":"Ice pack systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/36967601/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Neuromuscular junction, especially ocular myasthenia.","tool":"timer","generalize":""},{"section":"Special Tests","title":"Kernig sign","purpose":"Meningeal irritation adjunct.","localization":"Meninges; not focal localization.","perform":"Supine, flex hip and knee to ~90°, then slowly extend the knee while monitoring pain/resistance.","abnormal":"Pain/resistance that limits knee extension is traditionally positive.","evidence":"C — very poor sensitivity in adult meningitis cohorts.","tags":["Kernig","meningitis","meningismus","Special Tests"],"refs":[{"label":"Meningeal signs prospective study","url":"https://pubmed.ncbi.nlm.nih.gov/12060874/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"A negative Kernig sign does not meaningfully rule out meningitis.","tool":null,"generalize":""},{"section":"Special Tests","title":"Lhermitte sign","purpose":"Provokes a brief electric-shock sensation from neck flexion, suggesting dysfunction of the cervical spinal cord—especially posterior-column/demyelinating pathways.","localization":"Cervical spinal cord. It occurs in multiple sclerosis but also cervical spondylotic myelopathy, B12/copper deficiency, radiation injury, and other cervical cord disorders.","perform":"Ask whether neck flexion has ever caused an electric-shock sensation down the spine or into the limbs. If safe and there is no concern for cervical instability/acute trauma, have the patient gently flex the neck and report any shock-like sensation.","abnormal":"A brief electric or shock-like sensation radiating down the spine and sometimes into the arms/legs with neck flexion is positive. It supports cervical cord involvement but is not specific for multiple sclerosis.","evidence":"Classical cervical-cord sign; relatively specific for cord pathology in the proper context but insensitive for degenerative cervical myelopathy.","tags":["Lhermitte","electric shock","neck flexion","myelopathy","multiple sclerosis","cervical cord","Special Tests"],"refs":[{"label":"Degenerative cervical myelopathy recognition/management review","url":"https://www.aafp.org/pubs/afp/issues/2020/1215/p740.html"},{"label":"Degenerative cervical myelopathy clinical review","url":"https://www.ncbi.nlm.nih.gov/books/NBK482312/"}],"pitfalls":"Do not deliberately flex the neck in a patient with suspected unstable cervical trauma or another contraindication to neck movement.","tool":null,"generalize":""},{"section":"Special Tests","title":"McArdle sign","purpose":"Looks for rapidly reversible upper-motor-neuron-pattern weakness that worsens when the neck is flexed.","localization":"Cervical corticospinal pathways affected by demyelination. Published prospective work found the sign particularly associated with multiple-sclerosis myelopathy rather than other myelopathies.","perform":"Choose a mildly weak movement that can be tested repeatedly—classically finger extension. Test strength with the neck in a neutral/extended position, then again after the patient flexes the neck, and finally after returning the neck to neutral/extension.","abnormal":"A reproducible drop in strength with neck flexion that rapidly improves again when the neck is returned is positive. The original quantitative work used more than a 10% flexion-related strength drop.","evidence":"Prospective study found >10% neck-flexion-induced strength reduction entirely specific and about 65% sensitive for MS compared with other MS-mimicking myelopathies.","tags":["McArdle sign","multiple sclerosis","MS","neck flexion","myelopathy","demyelination","Special Tests"],"refs":[{"label":"McArdle Sign: A Specific Sign of Multiple Sclerosis","url":"https://pubmed.ncbi.nlm.nih.gov/31303427/"},{"label":"McArdle sign and central motor conduction","url":"https://journals.sagepub.com/doi/10.1177/13524585241295868"}],"pitfalls":"This is not the 'second-wind' phenomenon of McArdle metabolic myopathy; despite the shared eponym, they are unrelated clinical phenomena.","tool":null,"generalize":""},{"section":"Special Tests","title":"Nuchal rigidity","purpose":"Meningeal irritation adjunct.","localization":"Meninges; not a focal neurologic localization.","perform":"With the patient supine and relaxed, gently flex the neck while assessing involuntary resistance beyond expected musculoskeletal stiffness.","abnormal":"Marked involuntary resistance/pain can support meningitis or subarachnoid blood in context.","evidence":"C — low sensitivity; absence does not exclude meningitis.","tags":["nuchal rigidity","meningitis","meningismus","neck stiffness","Special Tests"],"refs":[{"label":"Meningeal signs prospective study","url":"https://pubmed.ncbi.nlm.nih.gov/12060874/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"Older age, cervical disease, pain, and paratonia can confound.","tool":null,"generalize":""},{"section":"Special Tests","title":"Phalen maneuver","purpose":"Median neuropathy at the wrist / carpal tunnel syndrome.","perform":"Maximally flex both wrists, usually up to ~60 seconds, and ask about median-distribution paresthesia.","abnormal":"Reproduction of familiar median-digit paresthesias.","evidence":"A — moderate sensitivity with substantial heterogeneity.","tags":["Phalen","carpal tunnel","CTS","median nerve","hand numbness","paresthesia","neuromuscular","Special Tests"],"refs":[{"label":"CTS provocative tests meta-analysis","url":"https://pubmed.ncbi.nlm.nih.gov/37621797/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Median nerve at the carpal tunnel.","tool":null,"generalize":""},{"section":"Special Tests","title":"Push-and-release test","purpose":"Reactive postural stability in parkinsonism.","perform":"Stand behind the patient, have them lean backward against your hands until center of gravity is displaced, then unexpectedly remove support while guarding.","abnormal":"Multiple recovery steps or inability to recover independently indicates impaired postural responses.","evidence":"A/B — more consistent and sensitive than the traditional pull test in comparative validation.","tags":["push and release","Parkinson","parkinsonism","postural instability","falls","Special Tests","movement disorder"],"refs":[{"label":"Push-and-release validation","url":"https://pubmed.ncbi.nlm.nih.gov/16788773/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Postural response network; basal ganglia/parkinsonian dysfunction when impaired.","tool":null,"generalize":""},{"section":"Special Tests","title":"Scapular winging: wall push","purpose":"Provokes scapular winging and helps identify serratus anterior weakness.","localization":"Long thoracic nerve/C5–C7 roots for serratus anterior; trapezius/rhomboid weakness produces different winging patterns.","perform":"Have the patient push both hands against a wall at shoulder height while you observe both scapulae from behind.","abnormal":"Prominent medial border/inferior-angle winging during forward push supports serratus anterior/long thoracic weakness. Determine the winging pattern before assigning a nerve.","evidence":"Routine peripheral motor localization maneuver.","tags":["scapular winging","long thoracic","serratus anterior","C5","C6","C7","Special Tests"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Special Tests","title":"Shoulder-abduction relief sign","purpose":"Cervical radiculopathy.","perform":"Ask the patient to place the symptomatic hand/forearm on top of the head.","abnormal":"Reduction of familiar radicular arm symptoms is positive.","evidence":"B/C — modest sensitivity and specificity; adjunct only.","tags":["shoulder abduction relief","Bakody","cervical radiculopathy","arm pain","root","Special Tests"],"refs":[{"label":"Shoulder abduction relief review","url":"https://pubmed.ncbi.nlm.nih.gov/41680685/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Cervical nerve root, interpreted with dermatomal/myotomal/reflex pattern.","tool":null,"generalize":""},{"section":"Special Tests","title":"Single-breath count","purpose":"Bedside adjunct for respiratory muscle function.","perform":"Patient sits upright, takes a maximal inspiration, then counts aloud at a steady cadence (~2 numbers/sec) in one breath.","abnormal":"Very low counts can suggest reduced ventilatory reserve; trend and clinical context matter.","evidence":"A/B — correlates moderately with FVC in neuromuscular disease; adjunct only.","tags":["single breath count","SBC","myasthenia","GBS","respiratory weakness","neuromuscular","Special Tests"],"refs":[{"label":"Single-breath count systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/38576972/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"Do not substitute for formal FVC/NIF when respiratory compromise is possible.","localization":"Global respiratory muscle/neuromuscular function; does not localize to a single level.","tool":"breath","generalize":""},{"section":"Special Tests","title":"Slump neurodynamic test","purpose":"Provokes lumbosacral neural mechanosensitivity using sequential spinal and limb loading.","localization":"Lumbosacral nerve roots/sciatic neural system; positive symptoms are not specific to the exact root.","perform":"Seated, progressively add thoracic/lumbar flexion, cervical flexion, knee extension, and ankle upward ankle/foot movement (dorsiflexion) while asking about familiar radicular symptoms; then release one component to see whether symptoms change.","abnormal":"Reproduction of the patient's familiar radiating leg symptoms that changes with structural differentiation supports neural mechanosensitivity. Posterior-thigh stretch alone is not enough.","evidence":"Widely used neurodynamic maneuver; published accuracy varies by population/protocol.","tags":["slump test","sciatica","lumbar radiculopathy","neurodynamic","leg pain","Special Tests"],"refs":[{"label":"Neurodynamic tests diagnostic-accuracy review","url":"https://pubmed.ncbi.nlm.nih.gov/28231784/"},{"label":"Systematic review of neural tissue provocation tests","url":"https://pubmed.ncbi.nlm.nih.gov/17013656/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Special Tests","title":"Spurling test","purpose":"Cervical radiculopathy; relatively useful to rule in.","perform":"Extend, rotate and laterally flex toward the symptomatic side, then add controlled axial compression.","abnormal":"Reproduction of familiar radicular arm symptoms, not merely neck pain.","evidence":"A/B — generally high specificity with modest sensitivity.","tags":["Spurling","cervical radiculopathy","neck pain","arm pain","root","neuromuscular","Special Tests"],"refs":[{"label":"Spurling meta-analysis","url":"https://pubmed.ncbi.nlm.nih.gov/39938056/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Cervical nerve root, interpreted with dermatomal/myotomal/reflex pattern.","tool":null,"generalize":""},{"section":"Special Tests","title":"Straight-leg raise (Lasègue maneuver)","purpose":"Lumbosacral nerve-root irritation, classically L5/S1.","perform":"Supine, passively raise the straight leg. If familiar radiating symptoms occur, use ankle/cervical structural differentiation as appropriate.","abnormal":"Reproduction of familiar radicular leg pain, not just hamstring stretch.","evidence":"A — sensitive in many populations but specificity varies.","tags":["SLR","straight leg raise","sciatica","lumbar radiculopathy","leg pain","root","Special Tests","Lasègue","Lasegue"],"refs":[{"label":"Neurodynamic tests review","url":"https://pubmed.ncbi.nlm.nih.gov/28231784/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Lumbosacral nerve root, commonly L5/S1 depending on symptom distribution.","tool":null,"generalize":""},{"section":"Special Tests","title":"Supine roll test","purpose":"Horizontal-canal BPPV and side lateralization.","perform":"Supine with head elevated ~30°. Rapidly rotate head ~90° to each side and compare horizontal nystagmus.","abnormal":"Geotropic or apogeotropic horizontal nystagmus with side-dependent intensity supports horizontal-canal BPPV.","evidence":"B — prospective work supports good lateralization performance.","tags":["supine roll","BPPV","vertigo","dizziness","horizontal canal","vestibular","Special Tests"],"refs":[{"label":"Supine roll lateralization study","url":"https://pubmed.ncbi.nlm.nih.gov/35678916/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Horizontal semicircular canal; nystagmus direction/intensity helps lateralize.","tool":null,"generalize":"Repeat to both sides from a neutral head position. Geotropic versus apogeotropic nystagmus changes the lateralization rule, so record *direction and relative intensity* rather than only 'positive/negative'."},{"section":"Special Tests","title":"Sustained shoulder-abduction fatigability","purpose":"Looks for proximal fatigability in suspected generalized myasthenia.","localization":"Neuromuscular junction; not specific to myasthenia and can be limited by pain or baseline weakness.","perform":"Establish baseline shoulder-abduction strength, then have the patient hold both arms abducted or repeatedly abduct them for a standardized interval, and immediately retest strength.","abnormal":"A reproducible decline in strength with activity followed by recovery after rest supports fatigability. Do not count pain-limited performance as positive.","evidence":"Bedside fatigability is central to clinical MG assessment, though exact sensitivity depends on protocol.","tags":["myasthenia","fatigability","shoulder abduction","NMJ","proximal weakness","Special Tests"],"refs":[{"label":"Ocular myasthenia review","url":"https://pubmed.ncbi.nlm.nih.gov/29655447/"},{"label":"Clinical evaluation of myasthenia gravis review","url":"https://pubmed.ncbi.nlm.nih.gov/41101824/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Special Tests","title":"Tinel sign at carpal tunnel","purpose":"Median nerve irritability.","perform":"Tap repeatedly over the median nerve at the palm-side of the wrist, directly over the carpal tunnel.","abnormal":"Reproduction of the patient's familiar tingling or electric sensation into the thumb, index, middle, or radial half of the ring finger supports median-nerve irritation at the carpal tunnel.","evidence":"A/C — variable sensitivity; not sufficient alone.","tags":["Tinel","carpal tunnel","CTS","median nerve","hand numbness","paresthesia","Special Tests"],"refs":[{"label":"CTS provocative tests meta-analysis","url":"https://pubmed.ncbi.nlm.nih.gov/37621797/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Median nerve at the carpal tunnel.","tool":null,"generalize":""},{"section":"Special Tests","title":"Trendelenburg sign","purpose":"Tests hip abductor ability to stabilize the pelvis during single-leg stance.","localization":"Gluteus medius/minimus, superior gluteal nerve, predominantly L5 root; pain/orthopedic hip disease also affects the test.","perform":"Stand behind the patient and ask them to lift one foot while standing on the other leg, guarding for safety.","abnormal":"When standing on the weak side, the pelvis drops on the unsupported side. This is a positive Trendelenburg sign.","evidence":"Classic hip-abductor localization maneuver; orthopedic confounding is common.","tags":["Trendelenburg","hip abductor","L5","superior gluteal","gait","Special Tests"],"refs":[{"label":"Structured manual muscle testing of the lower limbs","url":"https://pubmed.ncbi.nlm.nih.gov/37928783/"},{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"},{"label":"Neurological gait assessment (review)","url":"https://pubmed.ncbi.nlm.nih.gov/38135498/"},{"label":"Tandem gait in the neurologic examination (review)","url":"https://pubmed.ncbi.nlm.nih.gov/28894988/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"Special Tests","title":"Upper-limb neurodynamic test","purpose":"Cervical radiculopathy / nerve mechanosensitivity; often more useful to rule out when negative.","perform":"Use a standardized sequence of shoulder depression/abduction, forearm supination, wrist/finger extension, elbow extension, and cervical sensitization appropriate to the nerve bias.","abnormal":"Reproduction of familiar symptoms with structural differentiation.","evidence":"A/C — often sensitive but less specific; technique varies substantially.","tags":["ULTT","upper limb tension","radiculopathy","cervical root","arm pain","neuromuscular","Special Tests"],"refs":[{"label":"Cervical radiculopathy provocative tests review","url":"https://pubmed.ncbi.nlm.nih.gov/17013656/"},{"label":"Neurologic examination: symptoms to localization review","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","localization":"Cervical nerve root, interpreted with dermatomal/myotomal/reflex pattern.","tool":null,"generalize":""},{"section":"Special Tests","title":"Wartenberg sign","purpose":"Tests ulnar intrinsic-hand weakness affecting small-finger adduction.","localization":"Ulnar nerve/intrinsic hand muscles; C8–T1/root disease can produce similar weakness.","perform":"Ask the patient to fully extend and adduct all fingers together. Observe the small finger at rest and during sustained adduction.","abnormal":"Persistent abduction of the small finger away from the ring finger is a positive Wartenberg sign.","evidence":"Established clinical sign of ulnar motor dysfunction.","tags":["Wartenberg","ulnar neuropathy","small finger","interossei","Special Tests"],"refs":[{"label":"Electrodiagnostic evaluation of ulnar neuropathy (clinical review)","url":"https://pubmed.ncbi.nlm.nih.gov/33232078/"},{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""}];
const TOOLS=[{"id":"amsler","group":"Vision & Pupils","title":"Amsler grid","sub":"Central distortion / metamorphopsia screen","kind":"amsler","note":"Useful for metamorphopsia; sensitivity is insufficient to rule out macular disease.","interpret":"Normal: fixation dot and all grid lines remain visible, straight, evenly spaced, and undistorted. Wavy/bent lines = metamorphopsia; missing/dim areas = relative or absolute central/paracentral scotoma; distorted size/spacing can reflect macular pathology. Test each eye separately.","tips":"Have the patient point to or draw the abnormal area for serial comparison. A normal grid does not rule out macular disease; new distortion/scotoma should prompt formal ophthalmic assessment."},{"id":"bright","group":"Vision & Pupils","title":"Brightness comparison","sub":"White luminance target for inter-eye comparison","kind":"bright","note":"Keep device brightness fixed and compare eyes on the same screen.","interpret":"A reproducible monocular brightness asymmetry supports asymmetric afferent visual dysfunction. Marked brightness loss with RAPD/color loss is more persuasive than any one subjective test alone.","tips":"Repeat with the order of eyes reversed to reduce expectation bias. Keep display brightness fixed."},{"id":"acuity","group":"Vision & Pupils","title":"Calibrated near visual acuity","sub":"Tumbling-E near acuity with screen calibration","kind":"acuity","note":"Approximate bedside tool. Calibrate the screen first; formal ETDRS/Snellen testing remains the clinical reference.","interpret":"Record each eye separately at the smallest line/orientation reliably identified. A ≥2-line inter-eye difference or new reduction is clinically meaningful enough to investigate, but this prototype is not a validated ETDRS replacement. Pinhole improvement favors refractive blur; reduced acuity plus RAPD/color loss raises concern for afferent optic neuropathy.","tips":"Use the same device, calibration, distance, correction, and ambient lighting for serial exams. It is particularly useful for documenting change rather than declaring an absolute ophthalmologic acuity."},{"id":"field","group":"Vision & Pupils","title":"Confrontation-field target","sub":"Adjustable small red target for confrontation testing","kind":"field","note":"Move the phone/target through quadrants while the patient fixates the examiner.","interpret":"Map whether loss is monocular, bitemporal, or homonymous. Monocular defects are prechiasmal; bitemporal patterns implicate the chiasm; homonymous defects are retrochiasmal. Confrontation is a screen, not quantitative perimetry.","tips":"Combine finger wiggle/counting with a small red target. Red desaturation can reveal subtler field asymmetry but should not replace formal perimetry."},{"id":"color","group":"Vision & Pupils","title":"Ishihara color plates (public-domain set)","sub":"Real historical plates from Wikimedia Commons","kind":"color","note":"Uses public-domain historical Ishihara plates hosted by Wikimedia Commons. Requires internet to load the plate images in this single-file build.","interpret":"Plate 1 (12) is a demonstration plate expected to be visible to essentially everyone with adequate acuity; failure suggests the test conditions are invalid. Other pseudoisochromatic plates screen red–green discrimination. A few isolated errors do not diagnose a subtype; full Ishihara scoring uses an edition-specific plate set and manual.","tips":"For neurology, inter-eye asymmetry in an acquired deficit can be more useful than congenital color-vision classification. Disable Night Shift/True Tone/color filters, maximize consistent brightness, test monocularly, and interpret alongside red desaturation, acuity, and RAPD."},{"id":"pupil","group":"Vision & Pupils","title":"Pupil gauge","sub":"Calibrated 1–9 mm circles","kind":"pupil","note":"Requires the same screen calibration used by the acuity tool.","interpret":"Compare both pupils in the same illumination and document diameter rather than 'normal'. Anisocoria greater in dark favors sympathetic dysfunction; greater in light favors parasympathetic/CN III dysfunction, but the clinical pattern and reactivity matter.","tips":"Use the same calibrated screen/zoom and avoid estimating tenths of a millimeter from a moving pupil. Combine with light reaction and RAPD testing."},{"id":"pupillometry","group":"Vision & Pupils","title":"Pupil light-response analyzer","sub":"Baseline + post-light photos with normalized constriction","kind":"pupillometry","note":"Experimental bedside measurement aid — not NeurOptics NPi and not a replacement for a validated quantitative pupillometer.","interpret":"After marking pupil and iris edges in both images, the tool reports pupil-to-iris ratio and percent relative constriction. Greater positive constriction indicates a smaller pupil after light. Compare sides and serial measurements; no diagnostic NPi threshold is generated.","tips":"For best consistency, keep the camera angle/distance fixed, dim ambient light before baseline, center the same eye, and use the same stimulus interval. On supported Android/HTTPS installs, the tool can attempt the rear-camera torch; otherwise use an external penlight and capture the post-light image. Normalize to iris diameter whenever possible."},{"id":"rapd","group":"Vision & Pupils","title":"RAPD cadence","sub":"3-second swinging-light metronome","kind":"rapd","note":"A timing aid only; use a real light source and observe both pupils.","interpret":"A normal consensual/direct response should remain constricted as light alternates. Relative dilation or less constriction when moving the light to one eye indicates an RAPD in that eye, reflecting asymmetric afferent retinal/optic-nerve input.","tips":"The 3-second cadence helps adaptation consistency. RAPD is *relative*: severe symmetric bilateral optic neuropathy may produce no RAPD."},{"id":"red","group":"Vision & Pupils","title":"Red desaturation","sub":"Adjustable red target for monocular comparison","kind":"red","note":"Compare the same display monocularly; acquired asymmetry is more informative than absolute color naming.","interpret":"Ask the patient to rate one eye relative to the other (for example, better eye = 100%). A reproducibly washed-out red in one eye supports asymmetric afferent dysfunction, particularly optic neuropathy, but is subjective.","tips":"Adjust target size if a smaller stimulus makes inter-eye comparison easier. Use exactly the same size, screen brightness, distance, and room lighting for both eyes."},{"id":"okr","group":"Eye Movements & Vestibular","title":"OKN stripes","sub":"Direction and speed controls","kind":"okr","note":"Stimulus generator, not an automated acuity or lesion-localization test.","interpret":"Normal OKN shows a slow pursuit phase following the stripes and a fast corrective phase opposite stripe motion. Presence demonstrates sufficient visual input and ocular-motor circuitry to generate the reflex; absence is nonspecific and can reflect poor attention, vision, or ocular-motor disease.","tips":"Reverse direction and compare horizontal versus vertical responses. In claimed profound visual loss, preserved robust OKN is evidence of retained visual processing, but it should be integrated with other positive tests rather than used as a 'gotcha'."},{"id":"cancellation","group":"Language & Cortex","title":"Cancellation test","sub":"Interactive target search","kind":"cancellation","note":"Original cancellation array; useful for bedside neglect screening.","interpret":"Look for lateralized omissions, search organization, perseveration, and total omissions. Contralesional clustering is more suggestive of neglect than scattered errors from poor attention.","tips":"If limb weakness limits tapping/marking, allow verbal identification or pointing with the unaffected hand. Repeat with a more complex array if suspicion remains high."},{"id":"clock","group":"Language & Cortex","title":"Clock / drawing pad","sub":"Functional blank touch/stylus drawing canvas","kind":"clock","note":"Useful for construction, clock drawing, handwriting, or copying tasks.","interpret":"Interpret number placement, omissions, spacing, hand placement, conceptual errors, and perseveration separately. Left-sided omissions/crowding can reflect neglect; disorganization can reflect executive or constructional dysfunction.","tips":"The same canvas can be used for figure copying, spontaneous writing, or pentagon/cube-type construction tasks without reproducing proprietary cognitive tests."},{"id":"line","group":"Language & Cortex","title":"Line bisection","sub":"Staggered lines with signed midpoint-error summary","kind":"line","note":"Adjunct only; cancellation is a better stand-alone neglect screen.","interpret":"Measure directional error from true midpoint across several lines. Consistent ipsilesional deviation supports spatial bias, but a normal result does not exclude neglect.","tips":"Use multiple line lengths/positions and pair with cancellation or extinction testing."},{"id":"nihssstimuli","group":"Language & Cortex","title":"Official NIHSS language & dysarthria stimuli","sub":"Current NINDS scene, naming sheet, reading sheet, and word list","kind":"nihssstimuli","note":"Loads the current official NINDS NIH Stroke Scale PDF rather than recreating standardized visual stimuli. Internet is required in this single-file prototype.","interpret":"Use the scene, object-naming sheet, and reading material as directed for NIHSS Item 9; use the word list for Item 10 when an adequate speech sample is needed. For localization outside formal NIHSS scoring, characterize the specific error (naming, comprehension, reading, articulation) rather than treating the sheet as one omnibus language test.","tips":"The current NINDS NIHSS specifies the picture on p. 10, naming sheet on p. 11, reading sentences on p. 12, and dysarthria word list on p. 13. If the embedded PDF viewer does not render on a phone, use the Open official page button."},{"id":"tapping","group":"Motor & Movement","title":"10-second tapping analyzer","sub":"Tap count + taps/second graph + early/late comparison","kind":"tapping","note":"Use the same finger/technique for serial comparisons.","interpret":"The output shows total taps and taps in each one-second bin. A falling bar pattern can make decrement visually obvious, but decrement alone is not specific for parkinsonism; weakness, pain, fatigue, comprehension, and task strategy can alter performance.","tips":"Start each trial explicitly, use the same finger and excursion, and compare sides under identical conditions. The tool will not auto-start another trial when the 10 seconds end."},{"id":"spiral","group":"Motor & Movement","title":"Archimedes spiral pad","sub":"Functional drawing surface with reference spiral","kind":"spiral","note":"Stores no data after closing in this prototype; useful for qualitative tremor comparison.","interpret":"Regular oscillation suggests tremor; increasing amplitude near the center/outward, directional axis, and task dependence can help phenotype tremor. The drawing itself is qualitative in this prototype.","tips":"Compare both hands, with and without forearm support, and repeat after posture/task changes. Use the blank canvas for handwriting/micrographia too."},{"id":"tremorfreq","group":"Motor & Movement","title":"Tremor frequency estimator","sub":"Tap in rhythm for 5 seconds → median Hz + variability range","kind":"tremorfreq","note":"Approximate manual frequency measurement. Tap once per observed tremor cycle; this is not accelerometry or EMG.","interpret":"The tool converts successive tap intervals to instantaneous frequencies, reports the median frequency, and shows the central 80% range. A narrow range means your tapping was relatively consistent; a wide range may reflect variable tremor or difficulty synchronizing.","tips":"Watch one clearly oscillating body part and tap once per full cycle for the entire 5-second trial. Manual tapping becomes unreliable for very fast tremors, so treat high-frequency estimates cautiously. Use this to describe frequency, not diagnose tremor etiology."},{"id":"timer","group":"Timers & Reference","title":"Bedside timer","sub":"30 sec / 1 / 2 / 5 min","kind":"timer","note":"Useful for upgaze, ice-pack, positional, gait, and timed tasks.","interpret":"Interpretation depends on the maneuver being timed. Use consistent duration and starting conditions for serial comparisons.","tips":"Useful for sustained upgaze, ice-pack testing, positional maneuvers, timed gait, and repeated motor tasks."},{"id":"breath","group":"Timers & Reference","title":"Single-breath-count cadence","sub":"2 numbers/second visual cadence","kind":"breath","note":"Adjunct only; do not replace FVC/NIF when respiratory weakness is a concern.","interpret":"Record the last number reached at a fixed ~2 numbers/second cadence. Lower counts can indicate reduced respiratory reserve, but speech pattern, effort, cognition, and lung disease affect performance.","tips":"Use trends rather than a single cutoff. If neuromuscular respiratory weakness is a concern, obtain formal FVC/NIF and do not let a reassuring count delay escalation."}];
