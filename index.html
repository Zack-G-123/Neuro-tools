const GLOSSARY=[{"term": "Abulia", "category": "Behavior / cognition", "definition": "Pathologic reduction in spontaneous action, speech, and initiative despite preserved basic arousal.", "localization": "Usually frontal-subcortical motivational circuits: medial frontal/anterior cingulate, caudate, thalamus, midbrain, or connecting white matter; often bilateral or network-level.", "url": "https://pubmed.ncbi.nlm.nih.gov/22249571/", "tags": "motivation apathy frontal"}, {"term": "Apathy", "category": "Behavior / cognition", "definition": "Reduced motivation not fully explained by impaired consciousness, cognition, or emotional distress.", "localization": "Distributed frontal-subcortical and mesolimbic networks; occurs in many neurodegenerative, vascular, and psychiatric conditions rather than one focal site.", "url": "https://pubmed.ncbi.nlm.nih.gov/22249571/", "tags": "motivation frontal"}, {"term": "Akinetic mutism", "category": "Behavior / cognition", "definition": "Wakefulness with profound paucity of voluntary movement and speech.", "localization": "Classically bilateral medial frontal/anterior cingulate or mesodiencephalic motivational/arousal circuitry; can arise from several network disruptions.", "url": "https://pubmed.ncbi.nlm.nih.gov/32044373/", "tags": "abulia frontal"}, {"term": "Aphasia", "category": "Language", "definition": "Acquired impairment of language formulation and/or comprehension, affecting speaking, understanding, reading, or writing.", "localization": "Usually dominant-hemisphere distributed perisylvian and extrasylvian language networks; specific domain pattern is more localizing than the generic label.", "url": "https://pubmed.ncbi.nlm.nih.gov/17966959/", "tags": "language dysphasia"}, {"term": "Anomia", "category": "Language", "definition": "Impaired retrieval of names/words despite having the concept available.", "localization": "Dominant temporal lexical-semantic and temporoparietal lexical retrieval networks; common across many aphasias and neurodegenerative syndromes.", "url": "https://pubmed.ncbi.nlm.nih.gov/17966959/", "tags": "naming word finding aphasia"}, {"term": "Paraphasia", "category": "Language", "definition": "Unintended substitution during speech: phonemic (sound-level) or semantic (meaning-related) errors.", "localization": "Phonemic errors often implicate dominant dorsal phonologic networks; semantic errors often involve ventral temporal-semantic language networks; neither is perfectly focal.", "url": "https://pubmed.ncbi.nlm.nih.gov/17966959/", "tags": "phonemic semantic aphasia"}, {"term": "Neologism", "category": "Language", "definition": "A novel/nonword utterance produced as though it were a real word.", "localization": "Often severe fluent aphasia with dominant posterior temporal/perisylvian dysfunction, but can occur across aphasic syndromes.", "url": "https://pubmed.ncbi.nlm.nih.gov/17966959/", "tags": "jargon aphasia"}, {"term": "Jargon aphasia", "category": "Language", "definition": "Fluent but poorly informative speech containing abundant paraphasias/neologisms such that content may be difficult to understand.", "localization": "Usually severe dominant posterior temporal language-network dysfunction, classically Wernicke-type patterns.", "url": "https://pubmed.ncbi.nlm.nih.gov/17966959/", "tags": "Wernicke fluent neologism"}, {"term": "Conduction aphasia", "category": "Language syndrome", "definition": "Fluent speech and relatively preserved comprehension with disproportionately impaired repetition and phonemic errors.", "localization": "Dominant dorsal language network, especially temporoparietal regions and white-matter connections; not simply one arcuate-fasciculus lesion.", "url": "https://pubmed.ncbi.nlm.nih.gov/20711691/", "tags": "repetition arcuate phonemic"}, {"term": "Transcortical motor aphasia", "category": "Language syndrome", "definition": "Nonfluent output with relatively preserved repetition, often with reduced spontaneous speech.", "localization": "Dominant anterior/medial frontal or watershed network isolating frontal language-production systems; can overlap with abulia.", "url": "https://pubmed.ncbi.nlm.nih.gov/17966959/", "tags": "nonfluent repetition frontal"}, {"term": "Transcortical sensory aphasia", "category": "Language syndrome", "definition": "Fluent speech with poor comprehension but relatively preserved repetition.", "localization": "Dominant temporoparietal or posterior watershed/association cortex surrounding core perisylvian language regions.", "url": "https://pubmed.ncbi.nlm.nih.gov/17966959/", "tags": "fluent repetition comprehension"}, {"term": "Global aphasia", "category": "Language syndrome", "definition": "Severe impairment across fluency, comprehension, naming, repetition, reading, and writing.", "localization": "Large dominant-hemisphere language-network injury, commonly extensive MCA territory; smaller strategic lesions/network dysfunction can occasionally mimic it.", "url": "https://pubmed.ncbi.nlm.nih.gov/17966959/", "tags": "MCA stroke severe aphasia"}, {"term": "Alexia", "category": "Language / vision", "definition": "Acquired impairment of reading not explained solely by poor acuity or education.", "localization": "Dominant occipitotemporal and language networks; subtype determines localization.", "url": "https://pubmed.ncbi.nlm.nih.gov/21878722/", "tags": "reading"}, {"term": "Pure alexia (alexia without agraphia)", "category": "Language / vision", "definition": "Marked reading impairment with relatively preserved spontaneous writing.", "localization": "Classically dominant/left occipital and posterior fusiform visual-word pathways, often with splenial disconnection from the opposite visual cortex.", "url": "https://pubmed.ncbi.nlm.nih.gov/31559778/", "tags": "word blindness splenium occipital"}, {"term": "Agraphia", "category": "Language / praxis", "definition": "Acquired impairment of writing beyond weakness, tremor, or education.", "localization": "Dominant parietal/angular, posterior temporal, frontal-premotor, and language networks depending on error type; not a single-area deficit.", "url": "https://pubmed.ncbi.nlm.nih.gov/21878722/", "tags": "writing"}, {"term": "Acalculia", "category": "Higher cortical", "definition": "Acquired impairment of arithmetic/calculation.", "localization": "Often dominant inferior parietal/angular network but can reflect language, executive, visuospatial, or working-memory dysfunction elsewhere.", "url": "https://pubmed.ncbi.nlm.nih.gov/28484905/", "tags": "Gerstmann math parietal"}, {"term": "Apraxia", "category": "Praxis", "definition": "Impaired learned purposeful action not explained by elementary weakness, sensory loss, ataxia, or comprehension failure.", "localization": "Distributed dominant frontoparietal praxis network, premotor cortex, parietal association cortex, basal ganglia, or connecting white matter depending on subtype.", "url": "https://pubmed.ncbi.nlm.nih.gov/28484905/", "tags": "praxis motor planning"}, {"term": "Ideomotor apraxia", "category": "Praxis", "definition": "Impaired performance of learned gestures to command/imitation despite understanding the action goal.", "localization": "Usually dominant parietal-premotor praxis network or connecting white matter; often left hemisphere.", "url": "https://pubmed.ncbi.nlm.nih.gov/28484905/", "tags": "gesture pantomime"}, {"term": "Conceptual / ideational apraxia", "category": "Praxis", "definition": "Loss of knowledge about tool/action concepts or the correct sequence of a multistep action.", "localization": "Dominant parietotemporal semantic-praxis networks; can occur in diffuse neurodegeneration as well as focal lesions.", "url": "https://pubmed.ncbi.nlm.nih.gov/28484905/", "tags": "tool use sequencing"}, {"term": "Apraxia of speech", "category": "Motor speech", "definition": "Impaired planning/programming of speech movements with groping, segmentation, and inconsistent articulatory errors.", "localization": "Dominant premotor/inferior frontal-insular, supplementary motor, and connected speech-motor networks; exact localization is distributed.", "url": "https://pubmed.ncbi.nlm.nih.gov/39698146/", "tags": "AOS motor planning speech"}, {"term": "Agnosia", "category": "Recognition", "definition": "Failure to recognize a stimulus despite adequate primary sensory function.", "localization": "Association cortex/network depends on modality: visual occipitotemporal, auditory temporal, tactile parietal, etc.", "url": "https://pubmed.ncbi.nlm.nih.gov/28484905/", "tags": "recognition"}, {"term": "Prosopagnosia", "category": "Recognition", "definition": "Impaired recognition of familiar faces despite adequate basic vision.", "localization": "Right > left/bilateral occipitotemporal face network, especially fusiform/occipital face regions; can be developmental or acquired.", "url": "https://pubmed.ncbi.nlm.nih.gov/11707067/", "tags": "face blindness fusiform"}, {"term": "Astereognosis", "category": "Cortical sensory", "definition": "Inability to identify a familiar object by touch despite adequate primary sensation and motor exploration.", "localization": "Contralateral parietal association/somatosensory cortex or related network.", "url": "https://pubmed.ncbi.nlm.nih.gov/28484905/", "tags": "stereognosis parietal tactile"}, {"term": "Agraphesthesia", "category": "Cortical sensory", "definition": "Inability to recognize a number/letter traced on the skin despite adequate primary sensation.", "localization": "Contralateral parietal somatosensory association cortex; language impairment can confound.", "url": "https://pubmed.ncbi.nlm.nih.gov/28484905/", "tags": "graphesthesia parietal"}, {"term": "Anosognosia", "category": "Awareness", "definition": "Impaired awareness of one’s neurologic deficit.", "localization": "Often right hemisphere frontoparietal/insula networks in hemiplegia, but can occur with multiple lesions and neurodegenerative conditions.", "url": "https://pubmed.ncbi.nlm.nih.gov/28484905/", "tags": "awareness neglect"}, {"term": "Hemispatial neglect", "category": "Attention", "definition": "Failure to attend/respond to stimuli on one side that is not explained by a primary sensory deficit.", "localization": "Contralateral attention network, classically right inferior parietal/temporoparietal and frontal-subcortical network for left neglect.", "url": "https://pubmed.ncbi.nlm.nih.gov/2571823/", "tags": "hemineglect spatial attention"}, {"term": "Simultanagnosia", "category": "Visual attention", "definition": "Inability to perceive multiple elements of a visual scene simultaneously despite seeing individual objects.", "localization": "Bilateral parieto-occipital/dorsal attention network; classically part of Balint syndrome.", "url": "https://pubmed.ncbi.nlm.nih.gov/28484905/", "tags": "Balint dorsal stream"}, {"term": "Optic ataxia", "category": "Visuomotor", "definition": "Misdirected visually guided reaching not explained by weakness, sensory loss, or cerebellar ataxia.", "localization": "Contralateral superior parietal/dorsal visual-stream network; bilateral in Balint syndrome.", "url": "https://pubmed.ncbi.nlm.nih.gov/28484905/", "tags": "Balint dorsal stream reaching"}, {"term": "Ocular motor apraxia", "category": "Eye movement", "definition": "Difficulty initiating voluntary saccades, often compensated by head thrusts/blinks.", "localization": "Can arise from bilateral frontoparietal/supranuclear ocular-motor networks, degenerative/genetic disorders, or cerebellar circuitry; term is etiologically broad.", "url": "https://pubmed.ncbi.nlm.nih.gov/28484905/", "tags": "saccade initiation head thrust"}, {"term": "Aprosodia", "category": "Communication", "definition": "Impaired production or comprehension of emotional/linguistic prosody (pitch, rhythm, stress, intonation).", "localization": "Affective prosody has strong right-hemisphere network contributions, but both hemispheres and subcortical/callosal systems participate depending on linguistic versus emotional component.", "url": "https://pubmed.ncbi.nlm.nih.gov/35868292/", "tags": "prosody right hemisphere monotone"}, {"term": "Perseveration", "category": "Behavior / language", "definition": "Inappropriate persistence or recurrence of a prior response after the task/stimulus has changed.", "localization": "Frontal-executive/frontostriatal dysfunction or aphasic language networks depending on type; nonspecific.", "url": "https://pubmed.ncbi.nlm.nih.gov/15599820/", "tags": "stuck in set repetitive"}, {"term": "Echolalia", "category": "Behavior / language", "definition": "Involuntary or semiautomatic repetition of another person’s words or phrases.", "localization": "Can occur with transcortical/mixed aphasia, frontal network disease, autism-spectrum conditions, catatonia, and neurodegeneration; not a single localization.", "url": "https://pubmed.ncbi.nlm.nih.gov/29145181/", "tags": "repetition speech"}, {"term": "Palilalia", "category": "Motor speech / behavior", "definition": "Involuntary repetition of one’s own syllables, words, or phrases, often with accelerating rate or decreasing volume.", "localization": "Often basal-ganglia/frontostriatal or diffuse neurologic disease (e.g., parkinsonian syndromes), but can arise from other lesions.", "url": "https://pubmed.ncbi.nlm.nih.gov/29145181/", "tags": "repetition Parkinson"}, {"term": "Dysarthria", "category": "Motor speech", "definition": "Impaired articulation/phonation from abnormal motor execution while language formulation is preserved.", "localization": "Localization depends on phenotype: corticobulbar UMN, bulbar/peripheral LMN, cerebellar, basal ganglia, or mixed.", "url": "https://pubmed.ncbi.nlm.nih.gov/23312647/", "tags": "slurred speech"}, {"term": "Anarthria", "category": "Motor speech", "definition": "Near-complete inability to articulate speech because of severe motor-speech impairment, with language potentially intact.", "localization": "Severe corticobulbar, bulbar, speech-motor cortical/subcortical, or mixed motor dysfunction; must distinguish from aphasia and apraxia of speech.", "url": "https://pubmed.ncbi.nlm.nih.gov/28484905/", "tags": "mute dysarthria"}, {"term": "Spastic dysarthria", "category": "Motor speech phenotype", "definition": "Slow, strained/strangled, effortful speech often with low pitch, reduced prosodic variation, and hypernasality.", "localization": "Bilateral upper motor neuron/corticobulbar pathways; pseudobulbar syndromes and bilateral hemispheric/brainstem disease.", "url": "https://pubmed.ncbi.nlm.nih.gov/23312647/", "tags": "UMN pseudobulbar strained"}, {"term": "Flaccid dysarthria", "category": "Motor speech phenotype", "definition": "Breathy/weak voice, hypernasality, imprecise consonants, and reduced loudness from weakness.", "localization": "Lower motor neuron/bulbar motor nuclei or nerves, neuromuscular junction, or muscle depending on pattern.", "url": "https://pubmed.ncbi.nlm.nih.gov/23312647/", "tags": "LMN bulbar weak breathy"}, {"term": "Ataxic dysarthria", "category": "Motor speech phenotype", "definition": "Irregular articulatory breakdown, excess/equal stress, variable loudness/pitch, and slowed or “scanning” speech.", "localization": "Cerebellum and cerebellar connections, particularly superior/paravermal hemispheric speech-motor regions.", "url": "https://pubmed.ncbi.nlm.nih.gov/1544617/", "tags": "cerebellar scanning irregular"}, {"term": "Scanning speech", "category": "Speech descriptor", "definition": "Speech broken into separated syllables or words with abnormal equal/excess stress; historically associated with cerebellar disease.", "localization": "Most often cerebellar/ataxic dysarthria (including multiple sclerosis), but “scanning” is descriptive and not disease-specific.", "url": "https://pubmed.ncbi.nlm.nih.gov/1544617/", "tags": "ataxic cerebellar MS"}, {"term": "Hypokinetic dysarthria", "category": "Motor speech phenotype", "definition": "Hypophonia, monopitch/monoloudness, rapid or variable rate, short rushes, and imprecise articulation.", "localization": "Basal ganglia hypokinetic network, classically Parkinson disease/parkinsonism.", "url": "https://pubmed.ncbi.nlm.nih.gov/23312647/", "tags": "Parkinson hypophonia festinating speech"}, {"term": "Hyperkinetic dysarthria", "category": "Motor speech phenotype", "definition": "Variable interruptions of voice/articulation from involuntary movements, sometimes with unpredictable pitch/loudness changes.", "localization": "Basal ganglia/extrapyramidal disorders causing dystonia, chorea, tremor, tics, or other hyperkinesias.", "url": "https://pubmed.ncbi.nlm.nih.gov/23312647/", "tags": "dystonia chorea extrapyramidal"}, {"term": "Mixed dysarthria", "category": "Motor speech phenotype", "definition": "Speech contains features from more than one dysarthria type.", "localization": "Multilevel motor-system involvement; classic in ALS (spastic + flaccid) and multiple other diffuse disorders.", "url": "https://pubmed.ncbi.nlm.nih.gov/23312647/", "tags": "ALS mixed UMN LMN"}, {"term": "Hypophonia", "category": "Voice", "definition": "Abnormally reduced speech loudness.", "localization": "Common in hypokinetic/basal-ganglia disorders such as Parkinson disease but can also reflect respiratory, laryngeal, NMJ, or generalized weakness.", "url": "https://pubmed.ncbi.nlm.nih.gov/23312647/", "tags": "quiet voice Parkinson"}, {"term": "Dysphonia", "category": "Voice", "definition": "Abnormal voice quality, pitch, loudness, or phonation rather than language content/articulation per se.", "localization": "Larynx/recurrent laryngeal-vagal pathways, extrapyramidal/cerebellar motor control, NMJ, muscle, or functional voice disorder.", "url": "https://pubmed.ncbi.nlm.nih.gov/23312647/", "tags": "hoarse voice larynx"}, {"term": "Monotone / monoprosodic speech", "category": "Speech descriptor", "definition": "Reduced normal variation in pitch, loudness, and emotional/linguistic intonation.", "localization": "Can reflect hypokinetic dysarthria/basal ganglia disease or aprosodia/right-hemisphere networks; context distinguishes them.", "url": "https://pubmed.ncbi.nlm.nih.gov/35868292/", "tags": "prosody Parkinson"}, {"term": "Functional speech disorder", "category": "Motor speech / FND", "definition": "Speech abnormality with positive inconsistency/incongruence such as marked variability, distractibility, unusual prosody, or rapid reversibility that does not match a structural motor-speech syndrome.", "localization": "Functional neurologic disorder; no structural lesion localization is implied. Organic and functional speech disorders can coexist.", "url": "https://pubmed.ncbi.nlm.nih.gov/36868109/", "tags": "FND psychogenic variable speech"}, {"term": "Paresis", "category": "Motor", "definition": "Partial loss of voluntary muscle strength.", "localization": "Anywhere along motor system from cortex/corticospinal tract to anterior horn, root, nerve, NMJ, or muscle; pattern determines level.", "url": "https://pubmed.ncbi.nlm.nih.gov/42220180/", "tags": "weakness"}, {"term": "Plegia", "category": "Motor", "definition": "Complete or near-complete voluntary paralysis.", "localization": "Same motor pathway levels as paresis; distribution (mono/hemi/para/quadriplegia) helps localize.", "url": "https://pubmed.ncbi.nlm.nih.gov/42220180/", "tags": "paralysis"}, {"term": "Spasticity", "category": "Tone", "definition": "Velocity-dependent increase in tonic stretch reflexes associated with an upper motor neuron syndrome.", "localization": "Descending corticospinal/reticulospinal pathway dysfunction above the affected spinal segment.", "url": "https://pubmed.ncbi.nlm.nih.gov/37903098/", "tags": "UMN tone"}, {"term": "Rigidity", "category": "Tone", "definition": "Velocity-independent increased resistance to passive movement, often lead-pipe or cogwheel.", "localization": "Basal-ganglia/extrapyramidal network dysfunction, classically parkinsonism; can have other causes.", "url": "https://pubmed.ncbi.nlm.nih.gov/24132843/", "tags": "Parkinson tone cogwheel"}, {"term": "Paratonia / gegenhalten", "category": "Tone", "definition": "Variable involuntary resistance to passive movement that often increases with examiner force rather than velocity.", "localization": "Frontal-subcortical dysfunction, commonly advanced dementia; also influenced by attention/comprehension.", "url": "https://pubmed.ncbi.nlm.nih.gov/30422576/", "tags": "frontal dementia tone"}, {"term": "Bradykinesia", "category": "Movement", "definition": "Slowness of voluntary movement with decrement in amplitude/speed during repetitive action in parkinsonism.", "localization": "Basal-ganglia-thalamocortical motor network; not simply weakness.", "url": "https://pubmed.ncbi.nlm.nih.gov/27061062/", "tags": "Parkinson decrement"}, {"term": "Akinesia", "category": "Movement", "definition": "Paucity or failure of movement initiation.", "localization": "Basal ganglia/frontostriatal motor initiation networks, severe frontal motivational disorders, or other causes depending on context.", "url": "https://pubmed.ncbi.nlm.nih.gov/28484905/", "tags": "movement initiation"}, {"term": "Hypokinesia", "category": "Movement", "definition": "Reduced movement amplitude or overall movement quantity.", "localization": "Basal-ganglia hypokinetic syndromes most classically, but may also reflect pain, weakness, or motivational disorders.", "url": "https://pubmed.ncbi.nlm.nih.gov/24132843/", "tags": "Parkinson"}, {"term": "Dyskinesia", "category": "Movement", "definition": "Broad term for abnormal involuntary movement; often used clinically for medication-related choreiform/dystonic movements.", "localization": "Basal ganglia/extrapyramidal networks are common but the term itself does not specify localization.", "url": "https://pubmed.ncbi.nlm.nih.gov/29145181/", "tags": "involuntary movement"}, {"term": "Dystonia", "category": "Movement", "definition": "Sustained or intermittent muscle contractions causing patterned, often twisting movements/postures, sometimes task-specific.", "localization": "Distributed basal-ganglia, cerebellar, sensorimotor cortical, and network dysfunction; can be primary, secondary, or functional.", "url": "https://pubmed.ncbi.nlm.nih.gov/28344020/", "tags": "posturing twisting"}, {"term": "Chorea", "category": "Movement", "definition": "Irregular, flowing, unpredictable nonrhythmic movements that migrate between body regions.", "localization": "Basal-ganglia circuitry, especially striatal disorders; metabolic, autoimmune, vascular, drug, and genetic causes are broad.", "url": "https://pubmed.ncbi.nlm.nih.gov/29145181/", "tags": "hyperkinetic"}, {"term": "Athetosis", "category": "Movement", "definition": "Slow, writhing continuous movements, especially distal limbs, historically distinguished from chorea.", "localization": "Basal-ganglia network disorders; often coexists with chorea/dystonia and is not tightly localizing.", "url": "https://pubmed.ncbi.nlm.nih.gov/28484905/", "tags": "writhing hyperkinetic"}, {"term": "Ballism / hemiballismus", "category": "Movement", "definition": "Large-amplitude flinging proximal limb movements, usually unilateral when “hemiballismus.”", "localization": "Classically contralateral subthalamic/basal-ganglia network but lesions elsewhere in basal ganglia/cortex can cause the phenotype.", "url": "https://pubmed.ncbi.nlm.nih.gov/29145181/", "tags": "flinging subthalamic"}, {"term": "Myoclonus", "category": "Movement", "definition": "Brief shock-like involuntary movement caused by muscle contraction (positive) or interruption of activity (negative).", "localization": "Can arise from cortex, subcortex, brainstem, spinal cord, peripheral system, or metabolic/toxic network dysfunction; physiology is more localizing than appearance alone.", "url": "https://pubmed.ncbi.nlm.nih.gov/29145181/", "tags": "jerk"}, {"term": "Asterixis", "category": "Movement", "definition": "Brief lapses of sustained posture producing irregular “flapping” negative myoclonus.", "localization": "Commonly diffuse metabolic/toxic encephalopathy; unilateral asterixis can occur with focal thalamic, cortical, brainstem, or cerebellar lesions.", "url": "https://pubmed.ncbi.nlm.nih.gov/29145181/", "tags": "negative myoclonus flapping"}, {"term": "Tremor", "category": "Movement", "definition": "Rhythmic oscillatory movement produced by alternating or synchronous muscle activity.", "localization": "Localization depends on phenotype: cerebellothalamic, basal-ganglia, enhanced physiologic, peripheral/mechanical, functional, etc.", "url": "https://pubmed.ncbi.nlm.nih.gov/27346607/", "tags": "oscillation"}, {"term": "Dysmetria", "category": "Coordination", "definition": "Inability to scale movement accurately, producing overshoot or undershoot of a target.", "localization": "Ipsilateral cerebellar hemisphere/peduncles are classic, but proprioceptive loss and weakness can mimic it.", "url": "https://pubmed.ncbi.nlm.nih.gov/16769946/", "tags": "cerebellar overshoot"}, {"term": "Dysdiadochokinesia", "category": "Coordination", "definition": "Impaired rapid alternating movements with irregular rhythm/timing.", "localization": "Cerebellar circuitry, usually ipsilateral limb; weakness and extrapyramidal slowing can mimic it.", "url": "https://pubmed.ncbi.nlm.nih.gov/16769946/", "tags": "RAM cerebellar"}, {"term": "Ataxia", "category": "Coordination / gait", "definition": "Incoordination not explained by primary weakness; can affect limb, gait, stance, eye movement, or speech.", "localization": "Cerebellar, sensory/proprioceptive, vestibular, frontal, medication/toxic, or mixed systems; subtype localizes better than the word alone.", "url": "https://pubmed.ncbi.nlm.nih.gov/16769946/", "tags": "incoordination"}, {"term": "Sensory ataxia", "category": "Coordination / gait", "definition": "Incoordination from impaired proprioceptive input, typically worse without visual feedback.", "localization": "Large-fiber peripheral nerves, dorsal roots, posterior columns, medial lemniscus, or sensory cortex depending on other findings.", "url": "https://pubmed.ncbi.nlm.nih.gov/42220180/", "tags": "Romberg proprioception"}, {"term": "Paresthesia", "category": "Sensory", "definition": "Abnormal sensation such as tingling/pins-and-needles that is not necessarily unpleasant.", "localization": "Anywhere along peripheral or central sensory pathways; distribution and triggers determine localization.", "url": "https://pubmed.ncbi.nlm.nih.gov/28484905/", "tags": "tingling"}, {"term": "Dysesthesia", "category": "Sensory", "definition": "Abnormal unpleasant sensation, spontaneous or evoked.", "localization": "Peripheral or central sensory pathways; common in neuropathic pain syndromes and not focal by definition.", "url": "https://pubmed.ncbi.nlm.nih.gov/28484905/", "tags": "unpleasant sensation neuropathic"}, {"term": "Allodynia", "category": "Sensory / pain", "definition": "Pain provoked by a stimulus that does not normally cause pain.", "localization": "Peripheral or central sensitization; can occur in neuropathy, migraine, spinal/central pain syndromes, CRPS, etc.", "url": "https://pubmed.ncbi.nlm.nih.gov/28484905/", "tags": "pain light touch"}, {"term": "Hyperalgesia", "category": "Sensory / pain", "definition": "Exaggerated pain response to a stimulus that is normally painful.", "localization": "Peripheral/central sensitization across multiple pain pathways; not specifically localizing.", "url": "https://pubmed.ncbi.nlm.nih.gov/28484905/", "tags": "pain"}, {"term": "Hypoesthesia", "category": "Sensory", "definition": "Reduced sensitivity to sensory stimulation.", "localization": "Peripheral nerve/root, cord, brainstem, thalamus, cortex, or functional sensory symptoms depending on pattern.", "url": "https://pubmed.ncbi.nlm.nih.gov/42220180/", "tags": "numbness reduced sensation"}, {"term": "Anesthesia", "category": "Sensory", "definition": "Complete loss of a sensory modality in a region.", "localization": "Any sensory pathway level depending on modality/distribution; exact complete boundaries should be interpreted carefully.", "url": "https://pubmed.ncbi.nlm.nih.gov/42220180/", "tags": "sensory loss"}, {"term": "Dyschromatopsia", "category": "Vision", "definition": "Abnormal color perception.", "localization": "Retina/optic nerve in acquired asymmetric disease; cortical achromatopsia involves ventral occipitotemporal color networks; congenital red–green deficiency is retinal/photopigment based.", "url": "https://www.ncbi.nlm.nih.gov/books/NBK217823/", "tags": "color vision optic nerve"}, {"term": "Achromatopsia", "category": "Vision", "definition": "Severe loss of color perception; can be congenital retinal disease or acquired cortical color loss.", "localization": "Congenital forms are retinal cone disorders; acquired cerebral achromatopsia often involves bilateral/left-dominant ventral occipitotemporal color-processing regions.", "url": "https://pubmed.ncbi.nlm.nih.gov/28484905/", "tags": "color blindness cortical"}, {"term": "Metamorphopsia", "category": "Vision", "definition": "Visual distortion in which straight lines/shapes appear bent, warped, or altered in size/shape.", "localization": "Most commonly macular/retinal pathology; can also arise from cortical visual processing disturbances less commonly.", "url": "https://eyewiki.org/Retinal_Displacement_Following_Rhegmatogenous_Retinal_Detachment_Repair", "tags": "Amsler macula distortion"}, {"term": "Scotoma", "category": "Vision", "definition": "Localized area of reduced or absent vision within the visual field.", "localization": "Retina, optic nerve, or retrochiasmal visual pathway depending on monocular/binocular and field geometry.", "url": "https://eyewiki.org/Acute_Macular_Neuroretinopathy", "tags": "blind spot field"}, {"term": "Hemianopia", "category": "Vision", "definition": "Loss of one half of the visual field.", "localization": "Homonymous hemianopia localizes retrochiasmally to optic tract/LGN/radiations/occipital cortex; bitemporal hemianopia localizes to the chiasm.", "url": "https://pubmed.ncbi.nlm.nih.gov/20385890/", "tags": "visual field"}, {"term": "Palinopsia", "category": "Vision", "definition": "Persistence or recurrence of a visual image after the stimulus is gone.", "localization": "Posterior cortical/occipital-parietal disease, seizures, migraine, medications, or visual-perceptual disorders; mechanism matters.", "url": "https://pubmed.ncbi.nlm.nih.gov/29145181/", "tags": "visual persistence"}];
const NIHSS_URL="https://www.ninds.nih.gov/sites/default/files/2025-03/KnowStroke_NIHStrokeScale_March2025_508c.pdf";
let historyStack=[], currentScreen="home", currentCategory=null, currentTool=null, metro=null, timerInt=null, tapTimeout=null, taps=0, glossarySort="alphabetical";
const settingsKey="neuroExamToolkit.settings.v1";
let settings=Object.assign({theme:"system",font:"standard",compact:false,evidence:true},JSON.parse(localStorage.getItem(settingsKey)||"{}"));

function show(id,push=true,restoreY=0){
 if(push && currentScreen!==id) historyStack.push({screen:currentScreen,y:window.scrollY});
 document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active"); currentScreen=id;
 document.getElementById("topBack").classList.toggle("hidden",id==="home");
 requestAnimationFrame(()=>window.scrollTo(0,restoreY||0));
}
function goBack(){ stopDynamic(); const prev=historyStack.pop()||{screen:"home",y:0}; show(prev.screen,false,prev.y||0); }
function stopDynamic(){
 if(typeof stopPupilCamera==="function")stopPupilCamera();
 if(typeof pursuitStop2==="function")pursuitStop2();
 if(metro)clearInterval(metro);metro=null;
 if(timerInt)clearInterval(timerInt);timerInt=null;
 if(tapTimeout)clearTimeout(tapTimeout);tapTimeout=null;
 if(typeof tapEndTimer!=="undefined"&&tapEndTimer)clearTimeout(tapEndTimer);
 if(typeof tremorTimer!=="undefined"&&tremorTimer)clearTimeout(tremorTimer);
 if(typeof tremorCountdownRAF!=="undefined"&&tremorCountdownRAF)cancelAnimationFrame(tremorCountdownRAF);
}

const favoritesKey="neuroExamToolkit.favorites.v1";
let favorites=Object.assign({maneuvers:[],tools:[],terms:[]},JSON.parse(localStorage.getItem(favoritesKey)||"{}"));
function slug(s){return norm(s).replace(/\s+/g,"-")}
function maneuverId(x){return slug(x.section+"-"+x.title)}
function isFav(type,id){return (favorites[type]||[]).includes(id)}
function saveFavs(){localStorage.setItem(favoritesKey,JSON.stringify(favorites))}

function maneuverSubcategory(x){
 const t=norm(x.title+" "+x.purpose+" "+x.tags.join(" "));
 const title=norm(x.title);
 if(x.section==="HIF"){
   if(/conceptual similarities|phonemic verbal fluency|motor series|conflicting instructions|go no go inhibitory control|prehension environmental autonomy/.test(title))return "Frontal / executive bedside tests";
   if(/orientation to time|orientation to place|immediate registration|delayed free recall|cued recall|digit span|months backward/.test(title))return "Attention, orientation & memory";
   if(/cancellation test|line bisection|visual extinction|auditory extinction|personal neglect/.test(title))return "Attention & neglect";
   if(/alternating motion rate|sequential motion rate|sustained vowel|multisyllabic|contrastive stress|loudness during sustained counting/.test(title))return "Motor speech & voice";
   if(/transitive gesture|intransitive .*gesture|meaningful gesture imitation|meaningless hand|meaningless finger|actual single tool|multi object action|tool selection|gesture recognition/.test(title))return "Praxis & learned actions";
   if(/finger recognition|right left orientation|bedside calculation|body part identification|crossed body part command/.test(title))return "Dominant parietal / body schema";
   if(/simultanagnosia|optic ataxia|visual object recognition|figure copying|clock drawing/.test(title))return "Visuospatial & recognition";
   if(/naming|comprehension|command|repetition|reading|writing|aphasia|paraphasia|grammar|connected speech|automatic speech|verbal category fluency/.test(t))return "Language";
   return "Other higher integrative functions";
 }
 if(x.section==="CN"){
   if(/visual acuity|color vision|red desaturation|brightness|visual field|optic/.test(t))return "Afferent vision";
   if(/pupil|rapd|anisocoria|near response/.test(t))return "Pupils";
   if(/myasthenia|peek sign|curtain sign|enhanced ptosis/.test(t))return "Ocular fatigability / NMJ";
   if(/ptosis|eye movement|extraocular|saccade|pursuit|gaze|cover|convergence|nystagmus|skew|okn|bielschowsky|dynamic visual acuity/.test(t))return "Ocular motor & gaze stabilization";
   if(/trigeminal|facial sensation|forehead|eye closure|smile|corneal|jaw/.test(t))return "Trigeminal & facial";
   if(/weber|rinne|hearing|finger-rub|vestibular|head impulse/.test(t))return "Hearing & vestibular";
   return "Bulbar & lower cranial nerves";
 }
 if(x.section==="Motor"){
   if(/functional|hoover|abductor sign|drift without pronation|give-way|co-contraction|spinal injuries|paradoxical|scm sign/.test(t))return "Functional weakness";
   if(/tone|spasticity|rigidity|paratonia/.test(t))return "Tone";
   if(/muscle bulk|fasciculation/.test(t))return "Inspection / lower motor neuron";
   if(/neck flexion|neck extension/.test(t))return "Axial strength";
   if(/gowers/.test(t))return "Proximal weakness patterns";
   if(/shoulder|elbow|wrist|finger extension|finger abduction strength|thumb/.test(t))return "Upper limb strength";
   if(/hip|knee|ankle|great-toe|great toe|plantarflexion/.test(t))return "Lower limb strength";
   return "Subtle pyramidal weakness";
 }
 if(x.section==="Sensory"){
   if(/functional|midline|vibration splitting|bowlus|forced-choice|inconsistency|nonanatomic/.test(t))return "Functional sensory signs";
   if(/graphesthesia|stereognosis|two-point|point localization|barognosis|texture discrimination|quality extinction|cortical sensory/.test(t))return "Cortical / discriminative sensory";
   if(/vibration with|joint position|proprioception|monofilament|large-fiber/.test(t))return "Large-fiber / proprioception";
   if(/sensory level|saddle|cauda|conus/.test(t))return "Spinal / sacral localization";
   if(/dermatomal|distal-to-proximal|stocking/.test(t))return "Pattern mapping";
   return "Primary sensory modalities";
 }
 if(x.section==="Reflexes"){
   if(/glabellar|palmomental|grasp|snout|rooting|primitive|frontal-release/.test(t))return "Primitive / frontal-release";
   if(/babinski|hoffmann|tromner|clonus|inverted|crossed adductor|finger flexor/.test(t))return "Pathologic UMN / myelopathy";
   if(/abdominal|cremasteric|anal wink/.test(t))return "Superficial / segmental reflexes";
   if(/jendrassik/.test(t))return "Reflex technique";
   if(/pendular/.test(t))return "Cerebellar / tone-related reflexes";
   return "Deep tendon reflexes";
 }
 if(x.section==="Coordination"){
   if(/truncal|sitting|tandem stance/.test(t))return "Axial / balance coordination";
   if(/rhythmic hand|rhythmic foot/.test(t))return "Rhythmic timing";
   if(/rebound|past pointing|ballistic/.test(t))return "Special cerebellar signs";
   return "Appendicular coordination";
 }
 if(x.section==="Gait"){
   if(/functional|chair|dragging|buckling|exaggerated sway|effort|backward/.test(t))return "Functional gait";
   if(/romberg|tandem|single-leg|ataxia|balance/.test(t))return "Balance & ataxia";
   if(/freezing|initiation|arm swing|parkinson|retropulsion|pull/.test(t))return "Parkinsonian / postural response";
   if(/heel walking|toe walking|sit-to-stand/.test(t))return "Strength during gait";
   if(/10-meter|dual-task/.test(t))return "Quantitative / challenge gait";
   return "Core gait observation";
 }
 if(x.section==="Special Tests"){
   if(/dix|supine roll|head-shak|hints|fukuda|vertigo|vestibular/.test(t))return "Vestibular";
   if(/beevor/.test(t))return "Neuromuscular / truncal signs";
   if(/lhermitte|mcardle|finger escape|grip-and-release|grip and release/.test(t))return "Cervical myelopathy / long-tract signs";
   if(/myasthenia|ice-pack|single-breath|fatigability|neuromuscular|nmj/.test(t))return "NMJ / fatigability";
   if(/spurling|straight-leg|crossed straight|slump|femoral|radicul|neurodynamic|shoulder-abduction relief/.test(t))return "Roots / radiculopathy";
   if(/phalen|tinel|durkan|carpal|froment|wartenberg|anterior interosseous|elbow flexion test|scapular winging/.test(t))return "Peripheral nerve localization";
   if(/trendelenburg/.test(t))return "Proximal / plexus localization";
   if(/functional tremor|entrainment|distractibility|ballistic pause|loading response/.test(t))return "Functional movement";
   if(/mening|kernig|brudzinski|nuchal/.test(t))return "Meningeal signs";
   return "Other special tests";
 }
 return "Other";
}

function toolSubcategory(t){
 const z=norm(t.title+" "+t.sub);
 if(t.group==="Vision & Pupils"){
   if(/pupil|rapd/.test(z))return "Pupils";
   if(/field|amsler/.test(z))return "Fields & retinal screening";
   return "Acuity & color";
 }
 if(t.group==="Eye Movements & Vestibular"){
   if(/okn/.test(z))return "Optokinetic stimulus";
   return "Vestibular";
 }
 if(t.group==="Language & Cortex"){
   if(/nihss/.test(z))return "Validated clinical stimuli";
   if(/cancellation|line bisection|clock/.test(z))return "Neglect & visuospatial";
   return "Language";
 }
 if(t.group==="Motor & Movement"){
   if(/tremor|spiral/.test(z))return "Tremor characterization";
   return "Rapid motor testing";
 }
 return "Timers & reference";
}
function glossaryLocalizationGroup(x){
 const z=norm(x.localization+" "+x.category+" "+x.tags);
 if(/language|dominant|aphasia|alexia|agraphia|angular|broca|wernicke/.test(z))return "Dominant language network";
 if(/frontal|executive|abulia|cingulate|frontostriatal/.test(z))return "Frontal / executive networks";
 if(/parietal|spatial|neglect|praxis|dorsal stream/.test(z))return "Parietal / attention-praxis networks";
 if(/temporal|semantic|prosopagnosia/.test(z))return "Temporal / semantic networks";
 if(/occipital|visual|retina|optic|fusiform/.test(z))return "Visual system / occipitotemporal";
 if(/basal ganglia|subthalam|parkinson|chorea|dystonia/.test(z))return "Basal ganglia / movement networks";
 if(/cerebell|ataxia|dysmetria|coordination/.test(z))return "Cerebellar system";
 if(/brainstem|bulbar|cranial|cn |vestibular/.test(z))return "Brainstem / cranial nerve systems";
 if(/spinal|root|peripheral|neurop|dorsal column|large fiber/.test(z))return "Spinal cord / peripheral sensory-motor";
 return "Distributed / multiple possible levels";
}

function norm(s){return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim()}
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=0;i<=m;i++)d[i][0]=i;for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function expandQuery(q){let base=norm(q).split(" ").filter(Boolean),out=[...base];for(const b of base){for(const [k,vals] of Object.entries(SYN)){const nk=norm(k);if(b===nk||nk.includes(b)||b.includes(nk))vals.forEach(v=>out.push(...norm(v).split(" ")))}}return [...new Set(out)]}
function scoreItem(x,q){if(!q)return 1;const qs=expandQuery(q),title=norm(x.title),tags=norm(x.tags.join(" ")),loc=norm(x.localization),fn=norm(x.purpose),perf=norm(x.perform),sec=norm(x.section+" "+maneuverSubcategory(x)),all=(title+" "+tags+" "+loc+" "+fn+" "+perf+" "+sec).split(" ");let s=0;for(const z of qs){if(title.includes(z))s+=12;if(tags.includes(z))s+=9;if(loc.includes(z))s+=6;if(fn.includes(z))s+=5;if(sec.includes(z))s+=3;if(z.length>=4){let best=99;for(const a of all){if(Math.abs(a.length-z.length)<=2)best=Math.min(best,lev(z,a))}if(best<=1)s+=4;else if(best<=2&&z.length>=7)s+=2}}return s}

function interpretationTerms(x){
 const text=norm((x.abnormal||"")+" "+(x.localization||"")),hits=[];
 GLOSSARY.forEach(g=>{const term=norm(g.term);if(term.length>=4 && (text.includes(term)||text.includes(term.replace(/s$/,""))) && !hits.some(h=>h.term===g.term))hits.push(g)});
 return hits.slice(0,6);
}

 else if(t.kind==="amsler")b.innerHTML=`<div class="center"><div class="gridAmsler"></div><div class="note">Test one eye at a time at a consistent near distance. Ask whether any lines are wavy, missing, dim, blurred, or distorted while fixation remains on the center dot.</div></div>`;

function percentile(a,p){if(!a.length)return NaN;const x=[...a].sort((u,v)=>u-v),i=(x.length-1)*p,lo=Math.floor(i),hi=Math.ceil(i);return lo===hi?x[lo]:x[lo]+(x[hi]-x[lo])*(i-lo)}



let activeDrawKind=null;
function renderDrawingTool(b,kind){
 activeDrawKind=kind;
 const guide=kind==="spiral"?`<svg class="drawGuide" viewBox="0 0 500 500" preserveAspectRatio="xMidYMid meet"><path d="${makeSpiralPath()}" fill="none" stroke="#b7b7b7" stroke-width="2"/></svg>`:"";
 const wrapClass=kind==="spiral"?"drawWrap spiralWrap":"drawWrap";
 b.innerHTML=`<div class="controls"><button class="btn" onclick="clearDrawing()">Clear</button>${kind==="clock"?'<button class="btn" onclick="setClockPrompt()">New time prompt</button>':""}</div>${kind==="clock"?'<div id="clockPrompt" class="note" style="text-align:center;margin:8px">Draw a clock, put in all the numbers, and set the hands to 10 past 11.</div>':""}<div class="${wrapClass}" id="drawWrap">${guide}<canvas id="drawCanvas" class="drawCanvas"></canvas></div>`;
 requestAnimationFrame(setupDrawingCanvas);
}
function makeSpiralPath(){let d="",cx=250,cy=250;for(let a=0;a<Math.PI*13;a+=.055){const r=4.6*a,px=cx+r*Math.cos(a),py=cy+r*Math.sin(a);d+=(d?"L":"M")+px.toFixed(1)+" "+py.toFixed(1)+" "}return d}
function setupDrawingCanvas(){const c=document.getElementById("drawCanvas"),wrap=document.getElementById("drawWrap");if(!c||!wrap)return;const dpr=window.devicePixelRatio||1,r=wrap.getBoundingClientRect();c.width=Math.max(1,Math.round(r.width*dpr));c.height=Math.max(1,Math.round(r.height*dpr));const ctx=c.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=3;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#111";let drawing=false;const point=e=>{const rr=c.getBoundingClientRect();return [e.clientX-rr.left,e.clientY-rr.top]};c.onpointerdown=e=>{drawing=true;c.setPointerCapture?.(e.pointerId);const [x,y]=point(e);ctx.beginPath();ctx.moveTo(x,y);e.preventDefault()};c.onpointermove=e=>{if(!drawing)return;const [x,y]=point(e);ctx.lineTo(x,y);ctx.stroke();e.preventDefault()};const end=e=>{drawing=false;try{c.releasePointerCapture?.(e.pointerId)}catch(_){};e.preventDefault()};c.onpointerup=end;c.onpointercancel=end}
function clearDrawing(){const c=document.getElementById("drawCanvas");if(!c)return;const ctx=c.getContext("2d");ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);ctx.restore()}
function setClockPrompt(){const times=["10 past 11","20 past 8","quarter to 3","25 past 4","5 past 2"];document.getElementById("clockPrompt").textContent="Draw a clock, put in all the numbers, and set the hands to "+times[Math.floor(Math.random()*times.length)]+". ";clearDrawing()}

let lineResponses=[];
function renderLineBisection(b){
 lineResponses=[];
 const specs=Array.from({length:7},()=>{const width=50+Math.random()*34,left=4+Math.random()*(92-width);return {width,left}});
 b.innerHTML=`<div class="center"><div class="note">Tap the perceived midpoint of every line. Lines are intentionally staggered so their true centers do not form one vertical reference.</div><div id="lineArea" style="width:100%;display:grid;gap:18px">${specs.map((o,i)=>`<div class="lineRow" data-i="${i}" data-left="${o.left}" data-width="${o.width}" onclick="markBisection(event,this)"><div class="testLine" style="left:${o.left}%;width:${o.width}%"></div></div>`).join("")}</div><div class="controls"><button class="btn primary" onclick="scoreBisection()">Score</button><button class="btn" onclick="renderLineBisection(document.getElementById('toolBody'))">New set</button></div><div id="lineScore" class="note">No score yet.</div></div>`;
}
function markBisection(e,row){row.querySelectorAll(".lineMark").forEach(x=>x.remove());const r=row.getBoundingClientRect(),x=e.clientX-r.left,m=document.createElement("div");m.className="lineMark";m.style.left=x+"px";row.appendChild(m);const i=Number(row.dataset.i);lineResponses[i]=x}
function scoreBisection(){const rows=[...document.querySelectorAll("#lineArea .lineRow")],errs=[];rows.forEach(row=>{const i=Number(row.dataset.i),x=lineResponses[i];if(x==null)return;const r=row.getBoundingClientRect(),left=Number(row.dataset.left)/100*r.width,width=Number(row.dataset.width)/100*r.width,mid=left+width/2;errs.push((x-mid)/width*100)});const e=document.getElementById("lineScore");if(!errs.length){e.textContent="Tap at least one line first.";return}const mean=errs.reduce((a,b)=>a+b,0)/errs.length,abs=errs.reduce((a,b)=>a+Math.abs(b),0)/errs.length;e.textContent=`${errs.length}/${rows.length} lines marked. Mean signed error ${mean>=0?"+":""}${mean.toFixed(1)}% of line length (${mean<0?"left":"right"} of true center); mean absolute error ${abs.toFixed(1)}%. No single touchscreen cutoff diagnoses neglect—look for a consistent directional bias and corroborate with cancellation/clinical testing.`}


let okndir=1;function oknStart(){const e=document.getElementById("okn");if(e)e.style.animationPlayState="running"}function oknStop(){const e=document.getElementById("okn");if(e)e.style.animationPlayState="paused"}function oknReverse(){okndir*=-1;document.getElementById("okn").style.animationDirection=okndir>0?"normal":"reverse"}function oknSpeed(s){document.getElementById("okn").style.animationDuration=s+"s"}
function startRAPD(){stopDynamic();let n=3,eye="RIGHT";const e=document.getElementById("rapdEye"),c=document.getElementById("rapdCount");c.textContent=n;e.textContent=eye;timerInt=setInterval(()=>{n--;if(n===0){eye=eye==="RIGHT"?"LEFT":"RIGHT";n=3;navigator.vibrate?.(70)}c.textContent=n;e.textContent=eye},1000)}

function openGlossary(){document.getElementById("glossarySort").value=glossarySort;renderGlossary(document.getElementById("glossarySearch").value.trim());show("glossary")}
function glossScore(x,q){if(!q)return 1;const nq=norm(q),tokens=expandQuery(q),hay=norm(x.term+" "+x.category+" "+x.definition+" "+x.localization+" "+x.tags);let score=0;if(norm(x.term).includes(nq))score+=20;for(const t of tokens){if(norm(x.term).includes(t))score+=10;if(hay.includes(t))score+=4;const words=hay.split(" ");if(t.length>=4&&words.some(w=>Math.abs(w.length-t.length)<=2&&lev(t,w)<=1))score+=2}return score}
function termId(x){return slug(x.term)}
function setGlossarySort(v){glossarySort=v;renderGlossary(document.getElementById("glossarySearch").value.trim())}
function glossaryCard(x){const id=termId(x),d=document.createElement("div");d.className="termCard";d.innerHTML=`<div class="row"><div style="flex:1"><div class="glossCat">${esc(x.category)}</div><h3>${esc(x.term)}</h3><p>${esc(x.definition)}</p></div>${favButton("terms",id)}</div>`;d.onclick=()=>openGlossTerm(x);return d}
function openGlossTerm(x){const id=termId(x),root=document.getElementById("termBody");root.innerHTML=`<div class="detail"><div class="detailTop"><div><div class="eyebrow">${esc(x.category)} · ${esc(glossaryLocalizationGroup(x))}</div><h1>${esc(x.term)}</h1></div>${favButton("terms",id)}</div><div class="detailBlock"><div class="detailLabel">Definition</div><p>${esc(x.definition)}</p></div><div class="detailBlock"><div class="detailLabel">Localization</div><p>${esc(x.localization)}</p></div><div class="detailBlock"><div class="detailLabel">Read more</div><div class="refs"><a href="${x.url}" target="_blank" rel="noopener">Open reference</a></div></div></div>`;show("termScreen");refreshFavoriteButtons()}
function renderGlossary(q){
 const root=document.getElementById("glossaryBody");let arr=GLOSSARY.map(x=>({...x,_s:glossScore(x,q)})).filter(x=>x._s>0);
 if(q)arr.sort((a,b)=>b._s-a._s||a.term.localeCompare(b.term));
 else if(glossarySort==="alphabetical")arr.sort((a,b)=>a.term.localeCompare(b.term));
 else if(glossarySort==="category")arr.sort((a,b)=>a.category.localeCompare(b.category)||a.term.localeCompare(b.term));
 else arr.sort((a,b)=>glossaryLocalizationGroup(a).localeCompare(glossaryLocalizationGroup(b))||a.term.localeCompare(b.term));
 document.getElementById("glossaryMeta").textContent=`${arr.length} term${arr.length===1?"":"s"}`;root.innerHTML="";
 if(q||glossarySort==="alphabetical"){arr.forEach(x=>root.appendChild(glossaryCard(x)))}
 else{
   let last="";arr.forEach(x=>{const g=glossarySort==="category"?x.category:glossaryLocalizationGroup(x);if(g!==last){const h=document.createElement("div");h.className="groupHeader";h.textContent=g;root.appendChild(h);last=g}root.appendChild(glossaryCard(x))})
 }
 refreshFavoriteButtons();
}

 r.innerHTML=`<div class="setting"><label>Appearance</label><div class="seg">${["system","light","dark"].map(v=>`<button class="${settings.theme===v?"on":""}" onclick="setSetting('theme','${v}')">${v[0].toUpperCase()+v.slice(1)}</button>`).join("")}</div></div>
 <div class="setting"><label>Text size</label><div class="seg">${["small","standard","large"].map(v=>`<button class="${settings.font===v?"on":""}" onclick="setSetting('font','${v}')">${v[0].toUpperCase()+v.slice(1)}</button>`).join("")}</div></div>

let deferredInstallPrompt=null;

function isIOSDevice(){
 const ua=navigator.userAgent||"";
 return /iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
}
function isStandaloneMode(){return window.matchMedia?.("(display-mode: standalone)").matches||navigator.standalone===true}

async function installApp(){
 const help=document.getElementById("installHelp");
 if(isStandaloneMode()){if(help)help.textContent="Already running as an installed web app.";return}
 if(deferredInstallPrompt){
   deferredInstallPrompt.prompt();
   try{await deferredInstallPrompt.userChoice}catch(_){}
   deferredInstallPrompt=null;
   return;
 }
 if(isIOSDevice()){
   if(help)help.textContent="On iPhone/iPad: open this site in Safari → Share → Add to Home Screen → keep “Open as Web App” enabled → Add.";
 }else{
   if(help)help.textContent="Use your browser menu and choose Install app / Add to Home screen. Chrome may also show an install icon in the address bar.";
 }
}

async function requestPersistentStorage(){
 try{
   if(navigator.storage?.persist) await navigator.storage.persist();
 }catch(_){}
}

async function refreshOfflineStatus(){
 const el=document.getElementById("offlineStatus");if(!el)return;
 if(!("serviceWorker" in navigator)){el.textContent="Offline app caching is not supported in this browser.";return}
 try{
   const reg=await navigator.serviceWorker.getRegistration("./");
   const parts=[];
   if(isStandaloneMode())parts.push("Installed");
   parts.push(reg?"Offline cache active":"Offline cache not active yet");
   if(navigator.onLine===false)parts.push("currently offline");
   el.textContent=parts.join(" · ")+".";
 }catch(_){el.textContent="Offline cache status unavailable."}
}

const OFFLINE_VALIDATED_RESOURCES=[
 "https://upload.wikimedia.org/wikipedia/commons/4/4b/Ishihara_1.PNG",
 "https://upload.wikimedia.org/wikipedia/commons/c/c3/Ishihara_11.PNG",
 "https://upload.wikimedia.org/wikipedia/commons/b/b1/Ishihara_9.svg",
 "https://upload.wikimedia.org/wikipedia/commons/f/f0/Ishihara_23.PNG",
 "https://www.ninds.nih.gov/sites/default/files/2025-03/KnowStroke_NIHStrokeScale_March2025_508c.pdf"
];

async function prepareOfflineResources(){
 const help=document.getElementById("installHelp");
 if(help)help.textContent="Preparing offline resources… keep the app open while connected.";
 let ok=0;
 for(const url of OFFLINE_VALIDATED_RESOURCES){
   try{await fetch(url,{mode:"no-cors",cache:"reload"});ok++}catch(_){}
 }
 if(help)help.textContent=`Offline preparation attempted for ${ok}/${OFFLINE_VALIDATED_RESOURCES.length} validated resources. The app shell itself is cached automatically; literature links still need internet.`;
}

async function registerServiceWorker(){
 if(!("serviceWorker" in navigator))return;
 try{
   const reg=await navigator.serviceWorker.register("./service-worker.js",{scope:"./"});
   try{await reg.update()}catch(_){}
   await navigator.serviceWorker.ready;
   refreshOfflineStatus();
 }catch(e){console.warn("Service worker registration failed",e)}
}

function applySettings(){let th=settings.theme;if(th==="system")th=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.dataset.theme=th;document.documentElement.dataset.font=settings.font==="standard"?"":settings.font;document.body.classList.toggle("compact",settings.compact);document.body.classList.toggle("hideEvidence",!settings.evidence)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
