<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6b66">
<title>Neuro Exam Toolkit</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
 --bg:#f4f7f7;--card:#fff;--card2:#f8fbfb;--text:#102224;--muted:#647477;--line:#dde7e7;
 --accent:#0c6b66;--accentSoft:#e2f2f0;--danger:#a83d3d;--warn:#fff6d9;--shadow:0 8px 28px rgba(21,45,47,.07);
 --fs:16px;--radius:18px;
}
html[data-theme="dark"]{--bg:#0c1314;--card:#132023;--card2:#17272a;--text:#edf7f7;--muted:#9eb0b2;--line:#293b3e;--accent:#62d0c4;--accentSoft:#173b39;--warn:#493e17;--shadow:none}
html[data-font="large"]{--fs:18px} html[data-font="small"]{--fs:14px}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:var(--fs)/1.42 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select{font:inherit}.app{max-width:900px;margin:auto;min-height:100vh;padding:0 14px 90px}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);display:flex;align-items:center;gap:10px;padding:12px 0 10px}
.brand{font-size:20px;font-weight:850;letter-spacing:-.02em;flex:1}.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--text);width:42px;height:42px;border-radius:13px}
.back{border:0;background:transparent;color:var(--accent);font-weight:750;padding:9px 4px}.screen{display:none}.screen.active{display:block}
.hero{padding:24px 2px 12px}.hero h1{font-size:30px;line-height:1.05;letter-spacing:-.04em;margin:0 0 8px}.hero p{color:var(--muted);margin:0;max-width:620px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 13px;box-shadow:var(--shadow);margin:14px 0 18px}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:17px}
.homeGrid{display:grid;gap:12px}.homeCard{display:flex;align-items:center;gap:13px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:var(--radius);padding:17px;box-shadow:var(--shadow)}
.homeIcon{width:45px;height:45px;border-radius:14px;background:var(--accentSoft);display:grid;place-items:center;font-size:22px}.homeCard b{display:block;font-size:17px}.homeCard span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.pageHead{display:flex;align-items:center;gap:9px;padding:10px 0 6px}.pageHead h2{margin:0;font-size:22px;letter-spacing:-.02em}
.categoryList,.toolList{display:grid;gap:10px}.categoryBtn,.toolCard{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:15px;text-align:left;box-shadow:var(--shadow)}
.categoryBtn{display:flex;justify-content:space-between;align-items:center}.categoryBtn b{font-size:16px}.categoryBtn small,.toolCard small{color:var(--muted)}.countPill{background:var(--accentSoft);padding:4px 8px;border-radius:999px;font-size:12px}
.sectionTitle{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:18px 2px 8px}
.maneuver{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin:9px 0;box-shadow:var(--shadow);cursor:pointer}
.maneuver .row{display:flex;justify-content:space-between;gap:12px}.maneuver h3{margin:0 0 4px;font-size:16px}.maneuver p{margin:0;color:var(--muted);font-size:13px}.ev{font-size:11px;color:var(--muted);max-width:150px;text-align:right}
.tagrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.tag{background:var(--accentSoft);border-radius:999px;padding:3px 7px;font-size:10px;color:var(--text)}
.detail{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:var(--shadow);margin:8px 0}.detail h1{font-size:24px;line-height:1.12;margin:3px 0 4px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:850}
.detailBlock{padding:13px 0;border-top:1px solid var(--line)}.detailBlock:first-of-type{border-top:0}.detailLabel{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:850;margin-bottom:4px}.detailBlock p{margin:0}
.pitfall{background:var(--warn);border-radius:13px;padding:11px 12px}.toolLaunch{width:100%;border:0;background:var(--accent);color:white;font-weight:800;padding:12px;border-radius:13px;margin:4px 0 14px}
.refs a{display:block;color:var(--accent);text-decoration:none;padding:6px 0}.refs a:after{content:" ↗"}
.searchMeta{color:var(--muted);font-size:13px;margin:8px 2px 12px}
.toolGroup{margin-bottom:18px}.toolCard b{display:block}.toolCard{width:100%;margin:6px 0;cursor:pointer}.toolCard .sub{color:var(--muted);font-size:13px;margin-top:3px}
.toolShell{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}.toolHeader{padding:16px;border-bottom:1px solid var(--line)}.toolHeader h2{margin:0 0 4px}.toolHeader p{margin:0;color:var(--muted);font-size:13px}
.toolBody{min-height:420px;padding:16px}.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:360px}.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;padding:10px 12px}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}
.okn{width:100%;height:340px;border-radius:16px;background:repeating-linear-gradient(90deg,#000 0 30px,#fff 30px 60px);background-size:120px 100%;animation:oknmove 1s linear infinite}@keyframes oknmove{to{background-position:120px 0}}
.stage{position:relative;width:100%;height:360px;background:#111;border-radius:16px;overflow:hidden}.dot{position:absolute;width:25px;height:25px;background:#fff;border-radius:50%;top:167px;left:10px;animation:pursuit 3s ease-in-out infinite alternate}@keyframes pursuit{to{left:calc(100% - 35px)}}
.canvas{touch-action:none;width:100%;height:420px;border:1px solid var(--line);background:white;border-radius:14px}.gridAmsler{width:min(85vw,430px);aspect-ratio:1;background-color:white;background-image:linear-gradient(#777 1px,transparent 1px),linear-gradient(90deg,#777 1px,transparent 1px);background-size:20px 20px;position:relative}.gridAmsler:after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;background:#111;border-radius:50%;transform:translate(-50%,-50%)}
.settings{display:grid;gap:13px}.setting{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.setting label{font-weight:800;display:block;margin-bottom:7px}.seg{display:flex;gap:6px}.seg button{flex:1;border:1px solid var(--line);background:var(--card2);color:var(--text);padding:9px;border-radius:10px}.seg button.on{background:var(--accent);color:white;border-color:var(--accent)}
.note{font-size:12px;color:var(--muted);line-height:1.4}.bigNum{font-size:46px;font-weight:900}.hidden{display:none!important}
body.compact .maneuver{padding:10px 12px;margin:6px 0}body.compact .maneuver p{display:none}body.hideEvidence .ev{display:none}
@media(min-width:700px){.homeGrid{grid-template-columns:1fr 1fr}.categoryList{grid-template-columns:1fr 1fr}.toolList{grid-template-columns:1fr 1fr}.toolCard{height:100%}}

.glossCard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin:9px 0;box-shadow:var(--shadow)}.glossCard h3{margin:0 0 3px;font-size:17px}.glossCat{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:850}.glossLoc{font-size:13px;color:var(--muted);margin-top:7px}.glossCard a{color:var(--accent);text-decoration:none;font-size:13px}.guide{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}.guideBox{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:9px}.guideBox b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}.ishImg{width:min(86vw,480px);max-height:58vh;object-fit:contain;border-radius:14px;background:#111}.plateNav{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.cameraGrid{display:grid;grid-template-columns:1fr;gap:12px}.photoCard{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px}.photoCard canvas,.photoCard img{width:100%;max-height:340px;object-fit:contain;background:#050505;border-radius:10px}.cameraVideo{width:100%;max-height:380px;background:#050505;border-radius:14px}.metricGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{background:var(--accentSoft);border-radius:12px;padding:10px;text-align:center}.metric b{display:block;font-size:20px}.measurementPrompt{font-size:12px;color:var(--muted);margin-top:6px}.sourceCredit{font-size:11px;color:var(--muted);text-align:center;max-width:560px}.generalize{background:color-mix(in srgb,var(--accentSoft) 75%,var(--card));border-radius:13px;padding:11px 12px}.generalize b{display:block;margin-bottom:4px}@media(min-width:720px){.cameraGrid{grid-template-columns:1fr 1fr}}

.subgroupTitle{font-size:12px;text-transform:uppercase;letter-spacing:.075em;color:var(--accent);font-weight:850;margin:18px 2px 7px;padding-top:4px}
.favoriteBtn{border:0;background:transparent;color:var(--muted);font-size:23px;line-height:1;padding:3px 5px;border-radius:9px;flex:0 0 auto}
.favoriteBtn.on{color:#d99b16}
.sortRow{display:flex;align-items:center;gap:9px;margin:8px 0 13px}.sortRow label{font-size:13px;color:var(--muted);font-weight:750}.sortRow select{flex:1;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 11px}
.groupHeader{position:sticky;top:65px;z-index:7;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:850;padding:10px 3px 6px;margin-top:12px}
.emptyState{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted)}
.detailTop{display:flex;align-items:flex-start;gap:8px}.detailTop>div:first-child{flex:1}
.termCard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin:9px 0;box-shadow:var(--shadow);cursor:pointer}
.termCard h3{margin:2px 0 4px;font-size:17px}.termCard p{margin:0;color:var(--muted);font-size:13px}.termCard .row{display:flex;justify-content:space-between;gap:10px}
.favoriteSection{margin-bottom:20px}


.navButtonGrid{display:grid;gap:10px}
.navChoice{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:15px;box-shadow:var(--shadow)}
.navChoice b{display:block;font-size:16px}.navChoice span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.navChoice .arrow{font-size:20px;color:var(--accent)}
.terminologyHelp{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}.terminologyHelp summary{cursor:pointer;padding:9px 11px;font-size:12px;font-weight:800;color:var(--accent);background:var(--card2)}.termHelpBody{padding:9px 11px}.termHelpItem{font-size:12px;margin:0 0 8px}.termHelpItem:last-child{margin-bottom:0}.termHelpItem b{color:var(--text)}
@media(min-width:700px){.navButtonGrid{grid-template-columns:1fr 1fr}}

.maneuver,.toolCard,.termCard,.detail,.toolHeader{position:relative}
.favoriteBtn{position:absolute!important;top:9px;right:9px;z-index:6;background:color-mix(in srgb,var(--card) 92%,transparent)!important;border:1px solid var(--line)!important;width:34px;height:34px;display:grid;place-items:center;padding:0!important;border-radius:11px!important}
.maneuver .row,.termCard .row,.toolCard>div,.detailTop,.toolHeader>div{padding-right:40px}
.mobileStage{position:relative;width:100%;height:min(68vh,560px);min-height:360px;background:#0b0f10;border-radius:16px;overflow:hidden}
.mobileTarget{position:absolute;width:32px;height:32px;border-radius:50%;background:#fff;left:8px;top:calc(50% - 16px);will-change:left,top}
.drawWrap{position:relative;width:100%;height:min(62vh,520px);min-height:360px;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;touch-action:none}
.drawGuide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.drawCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.tapPad{width:min(82vw,360px);height:150px;border-radius:22px;font-size:26px;font-weight:850}
.tapChart{width:100%;max-width:560px;height:180px;display:flex;align-items:flex-end;gap:5px;padding:16px 8px 24px;border:1px solid var(--line);border-radius:14px;background:var(--card2);position:relative}
.tapBar{flex:1;min-width:0;background:var(--accent);border-radius:6px 6px 0 0;position:relative}
.tapBar span{position:absolute;bottom:-21px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}
.tapBar b{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--text)}
.rangeRow{width:min(90%,460px);display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.nihssTabs{display:flex;gap:6px;overflow:auto;padding-bottom:8px}.nihssTabs button{white-space:nowrap}
.nihssFrame{width:100%;height:min(72vh,680px);border:1px solid var(--line);border-radius:14px;background:white}
.lineRow{position:relative;height:42px;width:100%}.testLine{position:absolute;top:19px;border-top:3px solid var(--text)}.lineMark{position:absolute;top:6px;height:28px;border-left:3px solid #d33}


.spiralWrap{aspect-ratio:1/1!important;height:auto!important;min-height:0!important;max-height:none!important;max-width:520px;margin:0 auto}
#breathDisplay{width:100%;min-height:min(60vh,520px);display:grid;place-items:center;background:var(--card2);border:1px solid var(--line);border-radius:18px}
#breathN{font-size:clamp(110px,34vw,220px);font-weight:900;line-height:.9}
.tremorCountdown{font-size:clamp(64px,22vw,120px);font-weight:900;line-height:1}
.tremorPadFlash{transform:scale(.96);background:var(--accent)!important;color:white!important}


.appStatus{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.45}
.installAction{width:100%;border:0;background:var(--accent);color:white;font-weight:800;padding:11px 13px;border-radius:12px;margin-top:8px}
.installAction.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}

</style>
</head>
<body><div class="app">
<header class="topbar"><button id="topBack" class="back hidden" onclick="goBack()">← Back</button><div class="brand" id="brand">Neuro Exam Toolkit</div></header>

<section id="home" class="screen active">
 <div class="hero"><h1>Localize the deficit.</h1><p>Bedside neurologic examination, localization, terminology, and phone-based tools.</p></div>
 <div class="search"><span>⌕</span><input id="homeSearch" placeholder="Search exam, symptom, syndrome, localization…" autocomplete="off"></div>
 <div class="homeGrid">
  <button class="homeCard" onclick="openExam()"><div class="homeIcon">☰</div><div><b>Exam catalog</b><span>HIF, CN, motor, sensory, reflexes, coordination, gait, special tests</span></div></button>
  <button class="homeCard" onclick="openTools()"><div class="homeIcon">◉</div><div><b>Tools</b><span>Visual, ocular-motor, language, neglect, movement, timers</span></div></button>
  <button class="homeCard" onclick="openFavorites()"><div class="homeIcon">★</div><div><b>Favorites</b><span>Saved maneuvers, tools, and glossary terms</span></div></button>
  <button class="homeCard" onclick="openGlossary()"><div class="homeIcon">Aa</div><div><b>Glossary</b><span>Neurologic deficit terminology, phenotypes, and localization</span></div></button>
  <button class="homeCard" onclick="openSettings()"><div class="homeIcon">⚙</div><div><b>Settings</b><span>Appearance, text size, density, evidence display</span></div></button>
 </div>
</section>

<section id="exam" class="screen"><div class="pageHead"><h2>Exam catalog</h2></div><div class="categoryList" id="categoryList"></div></section>
<section id="category" class="screen"><div class="pageHead"><h2 id="categoryTitle"></h2></div><div id="categoryBody"></div></section>
<section id="subcategory" class="screen"><div class="pageHead"><h2 id="subcategoryTitle"></h2></div><div id="subcategoryBody"></div></section>
<section id="searchResults" class="screen"><div class="pageHead"><h2>Search</h2></div><div class="search"><span>⌕</span><input id="resultSearch" autocomplete="off"></div><div class="searchMeta" id="searchMeta"></div><div id="searchBody"></div></section>
<section id="detailScreen" class="screen"><div id="detailBody"></div></section>
<section id="tools" class="screen"><div class="pageHead"><h2>Tools</h2></div><div id="toolsBody"></div></section>
<section id="toolGroupScreen" class="screen"><div class="pageHead"><h2 id="toolGroupTitle"></h2></div><div id="toolGroupBody"></div></section>
<section id="toolSubcategoryScreen" class="screen"><div class="pageHead"><h2 id="toolSubcategoryTitle"></h2></div><div id="toolSubcategoryBody"></div></section>
<section id="toolScreen" class="screen"><div id="toolMount"></div></section>
<section id="glossary" class="screen"><div class="pageHead"><h2>Glossary</h2></div><div class="search"><span>⌕</span><input id="glossarySearch" placeholder="Search terminology…" autocomplete="off"></div><div class="sortRow"><label for="glossarySort">Sort by</label><select id="glossarySort" onchange="setGlossarySort(this.value)"><option value="alphabetical">Alphabetical</option><option value="category">Category</option><option value="localization">Localization</option></select></div><div class="searchMeta" id="glossaryMeta"></div><div id="glossaryBody"></div></section>
<section id="termScreen" class="screen"><div id="termBody"></div></section>
<section id="favorites" class="screen"><div class="pageHead"><h2>Favorites</h2></div><div id="favoritesBody"></div></section>
<section id="settings" class="screen"><div class="pageHead"><h2>Settings</h2></div><div class="settings" id="settingsBody"></div></section>
</div>

<script>
const DATA=[{"section":"HIF","title":"Actual single-tool use","purpose":"Tests whether a patient can correctly manipulate a real familiar tool.","localization":"Distributed left praxis/tool-use network; inferior parietal technical-reasoning systems are especially important.","perform":"Provide a safe familiar object and its normal target when possible, then ask the patient to demonstrate actual use. Do not demonstrate first.","abnormal":"Incorrect grip, orientation, target, or mechanical action despite recognizing the tool is abnormal. Better actual use than pantomime can occur, so both should be tested.","evidence":"Actual use is a core praxis domain that can dissociate from pantomime.","tags":["apraxia","praxis","actual tool use","tool use","dominant parietal","HIF"],"refs":[{"label":"Ideomotor apraxia review","url":"https://pubmed.ncbi.nlm.nih.gov/17507030/"},{"label":"Tool use without a tool / actual use comparison","url":"https://pubmed.ncbi.nlm.nih.gov/22349499/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Alternating motion rate: /ka/","purpose":"Tests rapid repetitive posterior tongue/velar articulation.","localization":"Motor speech system with tongue/palatal coordination; not a pure cranial-nerve localization.","perform":"Ask the patient to repeat 'ka-ka-ka...' as quickly and evenly as possible for several seconds.","abnormal":"Marked slowness, imprecision, or irregularity is abnormal. Compare with /pa/ and /ta/.","evidence":"AMR is a standardized motor-speech assessment paradigm.","tags":["ka","AMR","diadochokinesis","dysarthria","speech motor","HIF"],"refs":[{"label":"Oral/laryngeal diadochokinesis scoping review","url":"https://pubmed.ncbi.nlm.nih.gov/34958599/"},{"label":"Speech recording/acoustic analysis recommendations in dysarthria","url":"https://pubmed.ncbi.nlm.nih.gov/33373483/"}],"pitfalls":"","tool":"nihssstimuli","generalize":""},{"section":"HIF","title":"Alternating motion rate: /pa/","purpose":"Tests rapid repetitive bilabial articulation, emphasizing lip/jaw motor control.","localization":"Motor speech system; CN VII/orofacial weakness and dysarthria can affect performance, but the test is not a single-nerve localization.","perform":"Ask the patient to repeat 'pa-pa-pa...' as quickly and evenly as possible for several seconds on one breath.","abnormal":"Abnormal findings include marked slowness, irregular timing, reduced precision, or breakdown. Interpret alongside /ta/, /ka/, and connected speech rather than assigning a diagnosis from /pa/ alone.","evidence":"AMR is a widely studied motor-speech task with extensive reference literature.","tags":["pa","AMR","diadochokinesis","dysarthria","speech motor","lips","HIF"],"refs":[{"label":"Oral/laryngeal diadochokinesis scoping review","url":"https://pubmed.ncbi.nlm.nih.gov/34958599/"},{"label":"Speech recording/acoustic analysis recommendations in dysarthria","url":"https://pubmed.ncbi.nlm.nih.gov/33373483/"}],"pitfalls":"","tool":"nihssstimuli","generalize":""},{"section":"HIF","title":"Alternating motion rate: /ta/","purpose":"Tests rapid repetitive anterior tongue-tip/alveolar articulation.","localization":"Motor speech system with prominent lingual/CN XII contribution; not a pure hypoglossal nerve test.","perform":"Ask the patient to repeat 'ta-ta-ta...' as quickly and evenly as possible for several seconds.","abnormal":"Marked slowness, imprecision, or irregularity is abnormal. Compare with /pa/ and /ka/ to determine whether impairment is generalized or articulation-place dependent.","evidence":"AMR is a standardized motor-speech assessment paradigm.","tags":["ta","AMR","diadochokinesis","dysarthria","tongue","speech motor","HIF"],"refs":[{"label":"Oral/laryngeal diadochokinesis scoping review","url":"https://pubmed.ncbi.nlm.nih.gov/34958599/"},{"label":"Speech recording/acoustic analysis recommendations in dysarthria","url":"https://pubmed.ncbi.nlm.nih.gov/33373483/"}],"pitfalls":"","tool":"nihssstimuli","generalize":""},{"section":"HIF","title":"Auditory extinction / bilateral sound comparison","purpose":"Tests lateralized auditory attention when unilateral sounds are heard normally.","localization":"Higher auditory-attention network, often right hemisphere for left auditory neglect/extinction; bedside testing is less clean than visual/tactile testing.","perform":"Confirm each side is heard alone. Then present brief comparable sounds from left, right, or both sides at equal distance and loudness in unpredictable order.","abnormal":"Failure to acknowledge one side specifically during bilateral stimulation supports auditory extinction. Ear-specific hearing loss must be excluded first.","evidence":"Auditory neglect/extinction is recognized but requires careful separation of ear and spatial effects.","tags":["auditory extinction","auditory neglect","double simultaneous","parietal","attention","HIF"],"refs":[{"label":"Auditory neglect review","url":"https://pubmed.ncbi.nlm.nih.gov/23778964/"},{"label":"Neglect and extinction across sensory modalities","url":"https://pubmed.ncbi.nlm.nih.gov/17119300/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Auditory single-word comprehension","purpose":"Tests access from heard word to semantic representation, minimizing working-memory and syntax demands.","localization":"Dominant temporal semantic-language network, particularly middle/anterior temporal regions; severe deficits can occur in Wernicke-type and semantic syndromes.","perform":"Place several objects/pictures in view and ask the patient to point to a named item. Include semantically related foils (e.g., key/lock, cup/bowl) and repeat with body parts or colors if needed.","abnormal":"Incorrect selection despite intact hearing/vision suggests lexical-semantic comprehension impairment. Compare with written word comprehension to separate auditory-language from broader semantic dysfunction.","evidence":"Language-domain/localization evidence from aphasia and PPA literature.","tags":["comprehension","receptive aphasia","Wernicke","word meaning","semantic","trouble speaking","language","HIF"],"refs":[{"label":"Naming neuroanatomy review","url":"https://pubmed.ncbi.nlm.nih.gov/26115732/"},{"label":"Modern aphasia overview","url":"https://pubmed.ncbi.nlm.nih.gov/32644741/"},{"label":"Higher cortical dysfunction bedside review","url":"https://pubmed.ncbi.nlm.nih.gov/15651306/"},{"label":"Cortical function deficits review","url":"https://pubmed.ncbi.nlm.nih.gov/19566501/"}],"pitfalls":"","tool":"nihssstimuli","generalize":""},{"section":"HIF","title":"Automatic speech sequence","purpose":"Tests overlearned verbal sequences and can reveal dissociation from propositional speech.","localization":"Distributed language/motor network; preserved automatic speech despite poor spontaneous language can occur in severe aphasia.","perform":"Ask the patient to count 1–10, recite days of the week, or complete another highly familiar sequence.","abnormal":"Inability despite adequate alertness/hearing is abnormal. Preserved automatic sequences with markedly impaired propositional speech suggests a language-production disorder rather than complete loss of speech motor output.","evidence":"Traditional bedside language maneuver; localization is syndrome-level rather than focal.","tags":["automatic speech","counting","aphasia","language","speech","HIF"],"refs":[{"label":"Assessment of language impairment and function (review)","url":"https://pubmed.ncbi.nlm.nih.gov/35078598/"},{"label":"Neuroanatomical foundations of naming impairments (review)","url":"https://pubmed.ncbi.nlm.nih.gov/26115732/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Bedside calculation","purpose":"Acalculia; dominant parietal/language network dysfunction.","perform":"Test simple oral and written arithmetic, escalating from single-digit operations if needed.","abnormal":"New disproportionate calculation impairment not explained by education, language, or attention.","evidence":"B — cortical stimulation and lesion data support angular-gyrus network involvement.","tags":["acalculia","Gerstmann","parietal","angular gyrus","math","cortical","HIF","dominant parietal"],"refs":[{"label":"Angular gyrus stimulation study","url":"https://pubmed.ncbi.nlm.nih.gov/14567608/"},{"label":"Cortical function deficits review","url":"https://pubmed.ncbi.nlm.nih.gov/19566501/"}],"pitfalls":"","localization":"Dominant parietal/angular-gyrus network, with distributed language/executive contributions.","tool":null,"generalize":""},{"section":"HIF","title":"Body-part identification / autotopagnosia screen","purpose":"Tests knowledge/localization of body parts independent of primary sensation.","localization":"Dominant parietal body-schema network, often temporoparietal/inferior parietal; broader lesions can produce similar deficits.","perform":"Ask the patient to point to named body parts on themselves. Then test the same body parts on the examiner or a picture to separate self-body representation from word comprehension.","abnormal":"Consistent mislocalization of body parts despite understanding the body-part name is abnormal. Compare self versus examiner performance and right-left orientation.","evidence":"Modern parietal-lobe bedside reviews recommend explicit body-schema testing.","tags":["autotopagnosia","body schema","body part identification","parietal","dominant parietal","HIF"],"refs":[{"label":"Clinical assessment of parietal lobe function","url":"https://pubmed.ncbi.nlm.nih.gov/37328276/"},{"label":"Constructional apraxia — review","url":"https://pubmed.ncbi.nlm.nih.gov/29519467/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Cancellation test","purpose":"Hemispatial neglect / spatial attention, commonly right parietal-attention network dysfunction.","perform":"Present a dense field of targets and distractors spanning both hemispaces. Ask the patient to mark every target without cueing toward either side.","abnormal":"Lateralized omissions, especially contralesional, or markedly asymmetric search pattern.","evidence":"A — cancellation is among the best-supported rapid bedside neglect screens.","tags":["neglect","hemineglect","spatial attention","parietal","stroke","visual neglect","cortical","HIF","cognition"],"refs":[{"label":"Star cancellation validation","url":"https://pubmed.ncbi.nlm.nih.gov/2571823/"},{"label":"Cortical function deficits review","url":"https://pubmed.ncbi.nlm.nih.gov/19566501/"}],"pitfalls":"Visual field loss, aphasia, poor acuity, and impaired motor output can confound performance.","localization":"Right > left frontoparietal attention network; classically nondominant inferior parietal/temporoparietal lesions for left neglect.","tool":"cancellation","generalize":"Vary target density and visual complexity if the patient is high functioning, but keep stimuli symmetric across hemispaces. If motor output is limiting, use pointing rather than pen marking. Pair with extinction/figure copying when suspicion remains high despite a normal cancellation screen."},{"section":"HIF","title":"Clock drawing","purpose":"Visuoconstruction and executive organization; may reveal neglect.","perform":"Ask the patient to draw a clock face, place all numbers, and set a specified time.","abnormal":"Spatial crowding/omissions, conceptual errors, perseveration, poor planning, or neglect pattern.","evidence":"B/C — useful cognitive task; limited as an isolated neglect test.","tags":["clock drawing","executive","visuospatial","neglect","construction","dementia","parietal","frontal","HIF"],"refs":[{"label":"Clock drawing and neglect","url":"https://pubmed.ncbi.nlm.nih.gov/8423871/"},{"label":"Cortical function deficits review","url":"https://pubmed.ncbi.nlm.nih.gov/19566501/"}],"pitfalls":"","localization":"Distributed frontal-executive and parietal-visuospatial networks; lateralized omissions may reflect neglect.","tool":"clock","generalize":""},{"section":"HIF","title":"Conceptual similarities (FAB-style)","purpose":"Tests abstraction/concept formation rather than factual knowledge.","localization":"Frontal-executive and distributed semantic networks; impaired performance is not specific to the frontal lobes.","perform":"Give several pairs of familiar items and ask what they have in common at the most general useful level. Use different item pairs if repeating the test. Do not initially offer categories.","abnormal":"A concrete answer states a superficial feature or use ('both have wheels'); an abstract answer gives the shared category or principle ('both are forms of transportation'). Persistent concrete responding across several pairs is abnormal.","evidence":"One of the six constructs in the validated Frontal Assessment Battery; best interpreted as executive abstraction rather than a focal frontal sign.","tags":["FAB","frontal assessment battery","similarities","conceptualization","abstraction","executive","frontal","HIF"],"refs":[{"label":"Original Frontal Assessment Battery validation","url":"https://pubmed.ncbi.nlm.nih.gov/11113214/"},{"label":"FAB in clinical practice — systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/28627719/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Conflicting instructions (FAB component)","purpose":"Tests sensitivity to interference: maintaining a rule that conflicts with the examiner's imitative tendency.","localization":"Frontal inhibitory/control networks, especially frontostriatal systems; not a single-locus sign.","perform":"Establish an arbitrary response rule in which the patient must give a different response from yours (for example, one tap in response to two taps and two taps in response to one). Confirm that the rule is understood, then present a mixed sequence.","abnormal":"Echoing the examiner instead of following the learned opposite-response rule, especially after initially demonstrating understanding, indicates interference susceptibility.","evidence":"One of the six validated FAB domains.","tags":["FAB","frontal assessment battery","conflicting instructions","interference","executive","frontal","HIF"],"refs":[{"label":"Original Frontal Assessment Battery validation","url":"https://pubmed.ncbi.nlm.nih.gov/11113214/"},{"label":"FAB in clinical practice — systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/28627719/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Connected speech: fluency","purpose":"Determines whether spontaneous verbal output is fluent or effortful/nonfluent.","localization":"Nonfluent output often implicates dominant frontal-premotor/insula language-motor networks; fluent aphasia more often involves posterior temporal language networks, but language is distributed.","perform":"Ask an open-ended question requiring several sentences, such as 'Tell me what happened that brought you here.' Do not use a yes/no question.","abnormal":"Nonfluent speech has short phrases, reduced output, and increased effort/pauses. Fluent speech has normal or excessive phrase length even if content is empty or incorrect.","evidence":"Language assessment review supports separating fluency from naming, comprehension, repetition, reading, and writing.","tags":["speech fluency","nonfluent","fluent aphasia","Broca","Wernicke","language","trouble speaking","HIF"],"refs":[{"label":"Assessment of language impairment and function (review)","url":"https://pubmed.ncbi.nlm.nih.gov/35078598/"},{"label":"Neuroanatomical foundations of naming impairments (review)","url":"https://pubmed.ncbi.nlm.nih.gov/26115732/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Connected speech: grammar","purpose":"Tests grammatical sentence construction independently from naming and articulation.","localization":"Agrammatism commonly reflects dominant frontal language-network dysfunction but can occur in broader aphasic syndromes.","perform":"During an open-ended speech sample, listen specifically for function words, verb inflection, word order, and sentence complexity.","abnormal":"Agrammatism means simplified or telegraphic grammar (for example, omitted articles/auxiliary verbs or malformed sentence structure), not merely slow speech.","evidence":"Supported by modern aphasia-domain assessment literature.","tags":["grammar","agrammatism","syntax","Broca","aphasia","language","HIF"],"refs":[{"label":"Assessment of language impairment and function (review)","url":"https://pubmed.ncbi.nlm.nih.gov/35078598/"},{"label":"Neuroanatomical foundations of naming impairments (review)","url":"https://pubmed.ncbi.nlm.nih.gov/26115732/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Connected speech: paraphasias","purpose":"Identifies sound-level versus meaning-level word errors in spontaneous speech.","localization":"Sound-level (phonemic) errors often implicate dominant dorsal phonologic language networks; semantic errors more often reflect lexical-semantic temporal networks, though both can coexist.","perform":"Obtain at least several sentences of spontaneous speech and note incorrect words. Determine whether errors resemble the intended word in sound, meaning, or neither.","abnormal":"A phonemic paraphasia is a sound error (for example 'tephelone' for 'telephone'). A semantic paraphasia substitutes a related word (for example 'fork' for 'spoon'). Record the error type rather than simply 'aphasic.'","evidence":"Language-domain assessment and naming-network literature support error-type analysis.","tags":["paraphasia","phonemic paraphasia","semantic paraphasia","aphasia","language","HIF"],"refs":[{"label":"Assessment of language impairment and function (review)","url":"https://pubmed.ncbi.nlm.nih.gov/35078598/"},{"label":"Neuroanatomical foundations of naming impairments (review)","url":"https://pubmed.ncbi.nlm.nih.gov/26115732/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Contrastive stress / prosody","purpose":"Tests control of linguistic stress and prosodic timing.","localization":"Distributed right-hemisphere prosodic and bilateral motor-speech networks; ataxic and apraxic speech can also distort prosody.","perform":"Give the same short sentence with different target emphasis, for example 'I wanted the RED pen' versus 'I wanted the red PEN,' and ask the patient to imitate.","abnormal":"Failure to shift stress appropriately, excess/equal stress, or markedly segmented rhythm is abnormal. Interpret with articulation, language comprehension, and affective prosody.","evidence":"Prosody is an established motor-speech/language assessment domain; localization is distributed.","tags":["prosody","stress","scanning speech","ataxic dysarthria","apraxia of speech","HIF"],"refs":[{"label":"Speech recording/acoustic recommendations","url":"https://pubmed.ncbi.nlm.nih.gov/33373483/"},{"label":"Assessment of language impairment and function","url":"https://pubmed.ncbi.nlm.nih.gov/35078598/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Crossed body-part command","purpose":"Stresses language comprehension, right-left orientation, and praxis.","localization":"Dominant parietal/language network; abnormality is not interpretable as pure comprehension failure without simpler comparison tasks.","perform":"After confirming simple right-left commands, ask something like 'Touch your right ear with your left hand.'","abnormal":"Failure only on crossed commands can reflect right-left disorientation, praxis, or higher-order comprehension difficulty. Compare with simple commands before localizing.","evidence":"Classic higher-cortical bedside maneuver.","tags":["crossed command","right left","Gerstmann","parietal","comprehension","HIF"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"},{"label":"Angular gyrus stimulation study","url":"https://pubmed.ncbi.nlm.nih.gov/14567608/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Cued recall / recognition","purpose":"Helps distinguish retrieval difficulty from loss of the stored memory trace.","localization":"Frontal-subcortical retrieval dysfunction may improve substantially with cues; medial temporal storage failure often remains impaired even with recognition.","perform":"For each missed delayed-recall item, first provide a semantic category cue. If still missed, offer a forced-choice recognition set containing the target and plausible distractors.","abnormal":"Marked improvement with cueing/recognition supports a retrieval problem. Failure to recognize previously learned material despite good initial registration more strongly supports a storage/encoding deficit.","evidence":"Classic clinical memory distinction; not perfectly specific to one disease.","tags":["recognition","cued recall","memory","hippocampus","frontal","retrieval","HIF"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Delayed free recall","purpose":"Tests spontaneous retrieval of recently encoded information.","localization":"Medial temporal/hippocampal memory systems and frontal retrieval networks both contribute; cue response helps distinguish patterns.","perform":"After a delay of roughly 3–5 minutes filled with other tasks, ask for the previously registered words without giving hints.","abnormal":"Failure to freely recall is abnormal when registration was successful. Proceed to semantic cueing or recognition rather than assuming hippocampal storage failure.","evidence":"Routine bedside episodic-memory maneuver; interpretation improves when paired with cueing/recognition.","tags":["delayed recall","memory","hippocampus","amnestic","dementia","HIF"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Digit span backward","purpose":"Adds working-memory manipulation and executive demand to simple auditory span.","localization":"Frontoparietal working-memory network; less anatomically specific than a focal language test.","perform":"Read a short digit sequence and ask the patient to repeat it in reverse order. Start with two digits and increase gradually.","abnormal":"Disproportionate failure compared with forward span suggests impaired working-memory manipulation/executive control rather than a pure auditory span problem.","evidence":"Widely used bedside executive-attention task; nonspecific localization.","tags":["digit span backward","working memory","executive","frontal","attention","HIF"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Digit span forward","purpose":"Tests auditory attention and immediate verbal span.","localization":"Distributed auditory-attention and phonologic short-term memory network, including dominant temporoparietal regions.","perform":"Read digits at about one per second and ask the patient to repeat them in the same order. Increase list length until failure on repeated trials.","abnormal":"A short span relative to expected baseline suggests impaired attention or auditory-verbal short-term memory; hearing/language deficits can mimic impairment.","evidence":"Standard bedside attention task; interpretation is influenced by age/education.","tags":["digit span","attention","working memory","auditory verbal memory","HIF"],"refs":[{"label":"Assessment of language impairment and function","url":"https://pubmed.ncbi.nlm.nih.gov/35078598/"},{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Figure copying","purpose":"Constructional praxis and neglect.","perform":"Ask the patient to copy a symmetric figure or simple scene spanning both hemispaces.","abnormal":"Omissions, distortion, spatial disorganization, or lateralized neglect.","evidence":"B — figure copying can complement cancellation testing.","tags":["figure copy","construction","neglect","parietal","visuospatial","apraxia","HIF"],"refs":[{"label":"Neglect screening combinations","url":"https://pubmed.ncbi.nlm.nih.gov/29105618/"},{"label":"Cortical function deficits review","url":"https://pubmed.ncbi.nlm.nih.gov/19566501/"}],"pitfalls":"","localization":"Parietal visuospatial/constructional networks, usually nondominant hemisphere for spatial organization.","tool":null,"generalize":""},{"section":"HIF","title":"Finger recognition","purpose":"Finger agnosia / dominant parietal function, classically within a Gerstmann-type cluster.","perform":"With vision controlled, touch or name individual fingers on the patient or examiner and ask the patient to identify them.","abnormal":"Consistent inability to identify fingers despite intact primary sensation and language comprehension.","evidence":"B — localization evidence supports inferior parietal/angular-supramarginal involvement.","tags":["finger agnosia","Gerstmann","parietal","angular gyrus","cortical","HIF","dominant hemisphere","dominant parietal"],"refs":[{"label":"Angular gyrus stimulation study","url":"https://pubmed.ncbi.nlm.nih.gov/14567608/"},{"label":"Cortical function deficits review","url":"https://pubmed.ncbi.nlm.nih.gov/19566501/"}],"pitfalls":"","localization":"Dominant inferior parietal lobule/angular-supramarginal region within a broader Gerstmann network.","tool":null,"generalize":""},{"section":"HIF","title":"Gesture recognition / action semantics","purpose":"Tests whether the patient understands the meaning of a gesture even if they cannot produce it.","localization":"Left praxis/action-semantic network including inferior parietal and lateral occipitotemporal regions; language deficits can confound verbal answers.","perform":"Demonstrate or show several familiar gestures and ask the patient to identify their meaning or select the matching action/object from choices. Permit a nonverbal pointing response when aphasia is present.","abnormal":"Failure to recognize a familiar gesture despite adequate vision suggests an action-recognition/semantic praxis deficit. Preserved recognition with impaired production supports a more output-side praxis problem.","evidence":"Gesture understanding is one of the four major praxis domains in modern lesion meta-analysis.","tags":["apraxia","praxis","gesture recognition","action semantics","tool knowledge","parietal","HIF"],"refs":[{"label":"Neural correlates of limb apraxia — meta-analysis","url":"https://pubmed.ncbi.nlm.nih.gov/38754714/"},{"label":"Pantomime, praxis, and aphasia","url":"https://pubmed.ncbi.nlm.nih.gov/1377075/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Go / no-go inhibitory control (FAB component)","purpose":"Tests suppression of a prepotent motor response.","localization":"Frontal inhibitory/frontostriatal networks; impaired inhibition can occur in many diffuse or subcortical disorders.","perform":"Teach a simple go/no-go rule with two different examiner cues. Once the patient demonstrates the rule, present a mixed sequence at a steady pace.","abnormal":"Responding on no-go trials or repeatedly perseverating despite understanding the rule is abnormal. Distinguish rule-forgetting from failure to inhibit.","evidence":"The FAB includes an inhibitory-control go/no-go task; bedside interpretation should focus on error type rather than only a total score.","tags":["FAB","frontal assessment battery","go no go","inhibition","executive","frontal","HIF"],"refs":[{"label":"Original Frontal Assessment Battery validation","url":"https://pubmed.ncbi.nlm.nih.gov/11113214/"},{"label":"FAB in clinical practice — systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/28627719/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Immediate registration of 3 words","purpose":"Tests initial attention/encoding before delayed-memory testing.","localization":"Attention and medial temporal memory systems both contribute; failure to register often reflects attention, hearing, language, or severe amnestic dysfunction.","perform":"Say three unrelated concrete words clearly at about one word per second. Ask the patient to repeat all three. Repeat the list only as needed to achieve registration and record the number of learning trials.","abnormal":"Failure to repeat words even after several presentations means delayed recall cannot be interpreted as a pure storage test.","evidence":"Common bedside memory paradigm; primarily useful for separating encoding from later recall.","tags":["registration","memory","3 words","encoding","attention","dementia","HIF"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Intransitive communicative gesture to command","purpose":"Tests production of learned symbolic gestures that do not require an object.","localization":"Broad left-lateralized praxis network with bilateral social-gesture contributions; not restricted to a single parietal locus.","perform":"Ask for a familiar communicative gesture such as waving goodbye, saluting, or signaling 'come here' without demonstrating it.","abnormal":"Wrong configuration, spatial orientation, or inability to produce the learned gesture despite adequate strength/comprehension is abnormal. Compare with imitation of the same gesture.","evidence":"Meaningful intransitive gestures are a validated praxis domain and may dissociate from tool-related pantomime.","tags":["apraxia","praxis","intransitive gesture","symbolic gesture","wave goodbye","dominant parietal","HIF"],"refs":[{"label":"Meaningful intransitive gestures — 2024 meta-analysis","url":"https://pubmed.ncbi.nlm.nih.gov/38448754/"},{"label":"Meaningful intransitive gestures — 2025 neural meta-analysis","url":"https://pubmed.ncbi.nlm.nih.gov/40759326/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Line bisection","purpose":"Spatial bias / neglect adjunct.","perform":"Show several horizontal lines of varying lengths and ask the patient to mark the midpoint of each.","abnormal":"Consistent displacement away from the neglected hemispace.","evidence":"C — useful adjunct but poor as a stand-alone neglect screen; can miss many cases.","tags":["neglect","line bisection","parietal","spatial attention","hemianopia","cortical","HIF"],"refs":[{"label":"Line bisection can miss neglect","url":"https://pubmed.ncbi.nlm.nih.gov/11778637/"},{"label":"Cortical function deficits review","url":"https://pubmed.ncbi.nlm.nih.gov/19566501/"}],"pitfalls":"Do not use alone to rule out neglect; field deficits and constructional strategy can affect results.","localization":"Spatial-attention network, especially nondominant parietal cortex; not specific to a single region.","tool":"line","generalize":"Use several line lengths and positions rather than one line. It can demonstrate directional spatial bias but should be paired with cancellation because some patients with neglect bisect lines normally."},{"section":"HIF","title":"Loudness during sustained counting","purpose":"Screens hypophonia and ability to maintain speech amplitude across a familiar sequence.","localization":"Basal-ganglia/hypokinetic speech systems, respiratory-phonatory apparatus, and laryngeal function.","perform":"Ask the patient to count from 1 to 20 at a normal conversational loudness while listening for progressive fading or globally low volume.","abnormal":"Consistently reduced volume or progressive fading is hypophonia. This is common in parkinsonism but can also reflect respiratory weakness, vocal-fold disease, or effort.","evidence":"Common clinical speech task; pattern is supportive rather than disease-specific.","tags":["hypophonia","quiet speech","Parkinson","parkinsonism","voice","speech","HIF"],"refs":[{"label":"Speech recording/acoustic recommendations","url":"https://pubmed.ncbi.nlm.nih.gov/33373483/"},{"label":"Dysarthria and stroke systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/32519528/"}],"pitfalls":"","tool":"nihssstimuli","generalize":""},{"section":"HIF","title":"Meaningful gesture imitation","purpose":"Tests reproduction of a familiar gesture from visual demonstration.","localization":"Praxis-imitation network with inferior parietal and lateral occipitotemporal contributions; semantic familiarity can support performance.","perform":"Demonstrate a familiar gesture silently and ask the patient to copy it exactly with the same limb.","abnormal":"Spatial/postural errors despite adequate vision, strength, and comprehension indicate impaired gesture imitation. Compare with meaningless imitation to determine whether familiarity helps.","evidence":"TULIA validates meaningful-gesture imitation as a distinct praxis subdomain.","tags":["apraxia","praxis","gesture imitation","meaningful gesture","dominant parietal","HIF"],"refs":[{"label":"TULIA validation","url":"https://pubmed.ncbi.nlm.nih.gov/19614961/"},{"label":"Apraxia Screen of TULIA validation","url":"https://pubmed.ncbi.nlm.nih.gov/20935324/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Meaningless finger-configuration imitation","purpose":"Tests fine body-schema/visuo-imitative praxis at the finger level.","localization":"Inferior parietal/body-representation networks; hand versus finger imitation can dissociate.","perform":"Demonstrate an unfamiliar configuration involving individual fingers while keeping the arm otherwise still. Ask the patient to copy exactly and repeat with several configurations.","abnormal":"Wrong finger selection, order, or configuration despite intact elementary finger strength is abnormal. Compare with whole-hand postures because hand and finger imitation can dissociate.","evidence":"Finger-imitation deficits are described in ideomotor apraxia and body-representation disorders.","tags":["apraxia","praxis","finger imitation","meaningless gesture","parietal","body schema","HIF"],"refs":[{"label":"Meaning of meaningless gestures","url":"https://pubmed.ncbi.nlm.nih.gov/9051681/"},{"label":"Effect of meaning on apraxic finger imitation","url":"https://pubmed.ncbi.nlm.nih.gov/26721762/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Meaningless hand-posture imitation","purpose":"Tests direct visuomotor transformation/body-schema processing with minimal semantic support.","localization":"Left inferior parietal and lateral occipitotemporal praxis-imitation networks are particularly important.","perform":"Create an unfamiliar whole-hand/arm posture that has no obvious symbolic meaning and ask the patient to mirror or copy it exactly. Use several different postures.","abnormal":"Consistent spatial errors in limb position or hand orientation despite preserved strength and vision are abnormal. Meaningless gestures are especially useful when aphasia makes verbal-command testing difficult.","evidence":"Meaningless imitation is validated in TULIA/AST and lesion studies and can dissociate from meaningful gestures.","tags":["apraxia","praxis","meaningless gesture","hand posture imitation","body schema","parietal","HIF"],"refs":[{"label":"TULIA validation","url":"https://pubmed.ncbi.nlm.nih.gov/19614961/"},{"label":"Apraxia Screen of TULIA validation","url":"https://pubmed.ncbi.nlm.nih.gov/20935324/"},{"label":"Meaning of meaningless gestures","url":"https://pubmed.ncbi.nlm.nih.gov/9051681/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Months backward","purpose":"Attention, working memory, processing speed; useful for delirium/encephalopathy screening.","perform":"Ask the patient to recite the months from December backward to January. Note omissions, sequencing errors, perseveration, and inability to complete.","abnormal":"Errors, marked slowing, or inability to complete despite comprehension.","evidence":"A/B — frequently studied as a brief attention task; sensitivity varies by population and scoring.","tags":["attention","delirium","encephalopathy","cognition","altered mental status","ams","executive","working memory","months backward","HIF"],"refs":[{"label":"Months backward review (PubMed)","url":"https://pubmed.ncbi.nlm.nih.gov/26425444/"},{"label":"Higher cortical dysfunction bedside review","url":"https://pubmed.ncbi.nlm.nih.gov/19566501/"}],"pitfalls":"","localization":"Distributed attention/working-memory network; frontal-subcortical and parietal systems. Abnormality is not anatomically specific.","tool":null,"generalize":""},{"section":"HIF","title":"Motor series / Luria sequence (FAB component)","purpose":"Tests acquisition and maintenance of a novel motor sequence.","localization":"Frontal-premotor/frontostriatal networks with broader motor-programming contributions; abnormality is not specific to one frontal region.","perform":"Demonstrate a three-step hand sequence such as fist → edge → palm several times, then ask the patient to reproduce it and continue independently.","abnormal":"Failure to learn the sequence after demonstration, loss of the sequence after initial success, or perseveration on one element is abnormal. Separate misunderstanding from true motor-programming failure.","evidence":"Validated as the motor-programming component of the FAB; related tasks are widely used in bedside frontal assessment.","tags":["FAB","frontal assessment battery","Luria","fist edge palm","motor series","motor programming","frontal","HIF"],"refs":[{"label":"Original Frontal Assessment Battery validation","url":"https://pubmed.ncbi.nlm.nih.gov/11113214/"},{"label":"FAB in clinical practice — systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/28627719/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Multi-object action sequence","purpose":"Tests organization of a learned multi-step practical action.","localization":"Distributed left frontoparietal praxis/executive network; sequence errors can reflect apraxia, executive dysfunction, or comprehension problems.","perform":"Give several safe objects needed for a familiar multistep task and ask the patient to complete the task without coaching. Choose a culturally familiar activity.","abnormal":"Omitting required steps, using objects in the wrong order, or applying an object to the wrong target is abnormal. Determine whether the patient knows the goal and individual object functions before labeling the error apraxic.","evidence":"Action sequencing is repeatedly used in praxis research and is especially relevant in corticobasal and degenerative syndromes.","tags":["apraxia","praxis","action sequencing","tool use","executive","corticobasal","HIF"],"refs":[{"label":"Apraxia review","url":"https://pubmed.ncbi.nlm.nih.gov/26304239/"},{"label":"Limb apraxia in parkinsonian syndromes systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/42399458/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Multistep auditory command","purpose":"Tests sentence comprehension plus auditory-verbal working memory.","localization":"Dominant posterior temporal/inferior parietal language network with frontoparietal working-memory contribution.","perform":"Give a two- or three-step command without demonstrating it, such as 'Touch your left ear, then point to the ceiling, then close your eyes.'","abnormal":"If one-step commands are intact but multistep commands fail, consider working-memory/syntactic load rather than labeling comprehension globally absent.","evidence":"Supported by aphasia and auditory-verbal short-term memory literature.","tags":["multistep command","auditory comprehension","working memory","aphasia","language","HIF"],"refs":[{"label":"Assessment of language impairment and function","url":"https://pubmed.ncbi.nlm.nih.gov/35078598/"},{"label":"Repetition and auditory-verbal short-term memory lesion study","url":"https://pubmed.ncbi.nlm.nih.gov/24976669/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Object naming","purpose":"Tests lexical retrieval and helps distinguish anomia from visual agnosia or semantic loss.","localization":"Distributed dominant temporal language network; temporal pole/anterior temporal regions contribute semantic knowledge, while posterior temporal/inferior parietal regions contribute lexical-phonologic retrieval.","perform":"Show several common objects or clear pictures, including a few lower-frequency items. Ask 'What is this?' If incorrect, determine whether the patient recognizes the object's use, then offer a semantic cue followed by a phonemic cue.","abnormal":"Record no response, circumlocution, semantic paraphasia, phonemic paraphasia, visual misidentification, and cue responsiveness. Preserved recognition/use with inability to name supports lexical retrieval failure rather than agnosia.","evidence":"Strong localization literature for naming networks; naming is intentionally tested as a separate language domain.","tags":["naming","anomia","aphasia","word finding","trouble speaking","temporal lobe","language","HIF"],"refs":[{"label":"Naming neuroanatomy review","url":"https://pubmed.ncbi.nlm.nih.gov/26115732/"},{"label":"Modern aphasia overview","url":"https://pubmed.ncbi.nlm.nih.gov/32644741/"}],"pitfalls":"","tool":"nihssstimuli","generalize":""},{"section":"HIF","title":"One-step auditory command","purpose":"Tests basic spoken-language comprehension with minimal working-memory load.","localization":"Dominant temporal language comprehension network, while execution also requires intact motor/praxis systems.","perform":"Give a simple command using a body part or object, such as 'Close your eyes' or 'Point to the cup.' Avoid gesturing toward the answer.","abnormal":"Failure of repeated simple commands despite adequate hearing/attention suggests severe auditory-language comprehension impairment.","evidence":"Language assessment literature supports separating simple from complex command comprehension.","tags":["one step command","auditory comprehension","receptive aphasia","language","HIF"],"refs":[{"label":"Assessment of language impairment and function (review)","url":"https://pubmed.ncbi.nlm.nih.gov/35078598/"},{"label":"Neuroanatomical foundations of naming impairments (review)","url":"https://pubmed.ncbi.nlm.nih.gov/26115732/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Optic ataxia","purpose":"Visually guided reaching distinct from limb weakness or cerebellar dysmetria.","localization":"Contralateral superior parietal/dorsal visual-stream network; bilateral disease occurs in Balint syndrome.","perform":"Have the patient fixate centrally and reach toward peripheral visual targets, comparing performance when looking directly at the target versus reaching under fixation.","abnormal":"Misdirected reaching to visual targets that improves when gaze shifts to the target and is not explained by weakness/ataxia supports optic ataxia.","evidence":"Classical cortical-localization sign; quantitative bedside validation is limited.","tags":["optic ataxia","Balint","parietal","dorsal stream","reaching","HIF"],"refs":[{"label":"Higher cortical dysfunction bedside review","url":"https://pubmed.ncbi.nlm.nih.gov/15651306/"},{"label":"Cortical function deficits review","url":"https://pubmed.ncbi.nlm.nih.gov/19566501/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Orientation to place and situation","purpose":"Tests awareness of current environment and reason for evaluation.","localization":"Distributed memory-attention network; abnormalities are typically global rather than focal.","perform":"Ask where the patient is (building/type of place, city) and why they are being evaluated. Phrase the situation question neutrally.","abnormal":"Inability to identify the setting or grossly inaccurate explanation of the situation is abnormal, after accounting for communication barriers or lack of information.","evidence":"Routine cognitive examination; not a focal localization test.","tags":["orientation","place","situation","delirium","encephalopathy","dementia","HIF"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Orientation to time","purpose":"Tests temporal orientation as a quick marker of global cognitive dysfunction.","localization":"Distributed attention-memory network; impaired temporal orientation is common in delirium, encephalopathy, and dementia and does not localize to one cortical area.","perform":"Ask the year, month, date/day of week, and approximate time of day. Avoid giving multiple-choice cues initially.","abnormal":"A single missed date by one day may be benign. Multiple temporal errors, especially wrong month/year or inability to use environmental cues, are clearly abnormal.","evidence":"Routine bedside cognitive assessment; useful for severity/trending rather than focal localization.","tags":["orientation","time","delirium","encephalopathy","dementia","altered mental status","HIF"],"refs":[{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"},{"label":"Language/cognitive bedside assessment review","url":"https://pubmed.ncbi.nlm.nih.gov/35078598/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Personal neglect grooming test","purpose":"Looks for neglect of the contralesional side of the patient's own body.","localization":"Right-hemisphere spatial-attention network; personal neglect can dissociate from extrapersonal neglect.","perform":"Ask the patient to perform a natural bilateral grooming action such as combing/brushing the hair or wiping the face, without drawing attention to either side. Observe distribution of actions across the two body sides.","abnormal":"Markedly fewer grooming actions directed to the contralesional side supports personal neglect. It should be compared with cancellation/visual neglect testing rather than assumed to be the same deficit.","evidence":"The Comb and Razor paradigm has validated sensitivity/reliability for personal neglect.","tags":["personal neglect","comb and razor","body neglect","hemineglect","parietal","HIF"],"refs":[{"label":"Reformulated Comb and Razor test validation","url":"https://pubmed.ncbi.nlm.nih.gov/10815712/"},{"label":"Quantitative unilateral neglect battery validation","url":"https://pubmed.ncbi.nlm.nih.gov/17119304/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Phonemic verbal fluency (FAB-style)","purpose":"Tests self-generated lexical search under a rule, emphasizing mental flexibility and executive retrieval.","localization":"Left frontal language/executive network with distributed semantic-language contributions; poor performance is not anatomically specific.","perform":"Choose a letter and ask the patient to generate as many different words beginning with that letter as possible for 60 seconds. Exclude proper nouns and repeated variants according to your chosen protocol.","abnormal":"Low output, repeated words, or repeated rule violations is abnormal. Compare with category fluency: disproportionately poor letter fluency can emphasize executive retrieval, whereas semantic-category loss can be more temporal/semantic.","evidence":"The FAB uses a phonemic-fluency construct; verbal-fluency performance varies with language, age, and education.","tags":["FAB","frontal assessment battery","phonemic fluency","letter fluency","executive","frontal","HIF"],"refs":[{"label":"Original Frontal Assessment Battery validation","url":"https://pubmed.ncbi.nlm.nih.gov/11113214/"},{"label":"FAB in clinical practice — systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/28627719/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Prehension / environmental autonomy (FAB component)","purpose":"Looks for stimulus-bound grasping behavior and impaired suppression of environmentally triggered action.","localization":"Medial/orbitofrontal-frontostriatal control networks can be involved; a positive response is not uniquely localizing.","perform":"Position the patient's hands relaxed and open. Without instructing them to grasp, bring your hands toward the patient's palms and lightly make contact, first once and then again if needed.","abnormal":"Automatic grasping of the examiner's hands despite no instruction to do so supports abnormal environmental dependency/prehension behavior. Do not count a reflexive finger movement caused by surprise as a definite positive.","evidence":"One of the six FAB constructs; stimulus-bound grasping overlaps with the classic grasp reflex.","tags":["FAB","frontal assessment battery","prehension","environmental autonomy","grasp","frontal","HIF"],"refs":[{"label":"Original Frontal Assessment Battery validation","url":"https://pubmed.ncbi.nlm.nih.gov/11113214/"},{"label":"FAB in clinical practice — systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/28627719/"}],"pitfalls":"Explain or stop if the patient appears confused or distressed; this is not a test of cooperation.","tool":null,"generalize":""},{"section":"HIF","title":"Reading aloud","purpose":"Tests visual word recognition plus phonologic/lexical output.","localization":"Dominant occipitotemporal visual-word network plus dorsal/ventral language pathways; pure alexia classically involves left occipital/fusiform pathways with splenial disconnection.","perform":"Ask the patient to read single common words, irregular words, pseudowords if appropriate, then a sentence. Note letter-by-letter reading, semantic substitutions, phonologic errors, and visual-field limitations.","abnormal":"Letter-by-letter reading with preserved writing suggests pure alexia; broader reading plus naming/comprehension deficits suggest a more general language disorder.","evidence":"Localization supported by lesion and reading-network literature.","tags":["alexia","reading","pure alexia","occipital","fusiform","splenium","language","HIF"],"refs":[{"label":"Alexia/agraphia localization review","url":"https://pubmed.ncbi.nlm.nih.gov/21878722/"},{"label":"Anatomy of reading review","url":"https://pubmed.ncbi.nlm.nih.gov/355914/"}],"pitfalls":"","tool":"nihssstimuli","generalize":""},{"section":"HIF","title":"Reading comprehension","purpose":"Tests extraction of meaning from written language independent of speech output.","localization":"Dominant ventral occipitotemporal-temporal semantic language network; dissociation from auditory comprehension can refine modality-specific deficits.","perform":"Have the patient match written words to objects/pictures, then follow simple written commands. Use pointing responses when spoken output is impaired.","abnormal":"Failure with preserved auditory comprehension suggests a reading-specific language pathway problem; failure across modalities suggests broader semantic/comprehension dysfunction.","evidence":"Supported by higher-cortical and alexia literature.","tags":["reading comprehension","alexia","language","occipital","temporal","HIF"],"refs":[{"label":"Alexia/agraphia localization review","url":"https://pubmed.ncbi.nlm.nih.gov/21878722/"},{"label":"Higher cortical dysfunction bedside review","url":"https://pubmed.ncbi.nlm.nih.gov/15651306/"},{"label":"Cortical function deficits review","url":"https://pubmed.ncbi.nlm.nih.gov/19566501/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Repeated multisyllabic-word production","purpose":"Looks for articulatory planning difficulty and changes across repeated complex word productions.","localization":"Dominant premotor/inferior frontal-insular speech-planning network can contribute in acquired apraxia of speech; aphasia can also produce sound errors.","perform":"Choose a multisyllabic word and ask for 4–5 immediate repetitions at a comfortable rate. Record sound substitutions, segmentation, groping, and whether errors change across attempts.","abnormal":"Repeated sound errors and disrupted transitions can support a motor-speech disorder, but error inconsistency is NOT specific for apraxia of speech and also occurs in aphasia.","evidence":"Modern apraxia-of-speech literature specifically cautions against using error consistency as a stand-alone diagnostic marker.","tags":["multisyllabic word","apraxia of speech","AOS","groping","phonetic errors","speech","HIF"],"refs":[{"label":"Acquired apraxia of speech diagnostic template","url":"https://pubmed.ncbi.nlm.nih.gov/42017773/"},{"label":"Repeated word production in aphasia and apraxia of speech","url":"https://pubmed.ncbi.nlm.nih.gov/34924672/"}],"pitfalls":"","tool":"nihssstimuli","generalize":""},{"section":"HIF","title":"Right-left orientation","purpose":"Dominant parietal symbolic/spatial processing.","perform":"Start with simple commands (show your left hand), then crossed commands (touch my right ear with your left hand).","abnormal":"Consistent right-left confusion despite adequate language comprehension.","evidence":"B — best interpreted as part of a broader dominant parietal syndrome rather than a uniquely localizing sign.","tags":["right left confusion","Gerstmann","parietal","angular gyrus","cortical","HIF","dominant hemisphere","dominant parietal"],"refs":[{"label":"Angular gyrus stimulation study","url":"https://pubmed.ncbi.nlm.nih.gov/14567608/"},{"label":"Cortical function deficits review","url":"https://pubmed.ncbi.nlm.nih.gov/19566501/"}],"pitfalls":"","localization":"Dominant parietal association cortex; often angular-gyrus network.","tool":null,"generalize":""},{"section":"HIF","title":"Sentence repetition","purpose":"Stresses phonologic working memory and dorsal language-network connectivity more than single-word repetition.","localization":"Left posterior temporoparietal cortex and dorsal language network; disproportionate sentence-repetition impairment is characteristic of logopenic/conduction patterns.","perform":"Use sentences that increase gradually in length and syntactic complexity. Have the patient repeat exactly once after a single presentation; avoid allowing multiple rehearsal attempts.","abnormal":"Omissions, phonemic errors, word-order changes, or breakdown that scales strongly with sentence length are abnormal. Compare with comprehension and digit span to assess auditory-verbal short-term memory.","evidence":"Strong lesion-symptom and aphasia-phenotype evidence.","tags":["sentence repetition","logopenic","conduction aphasia","auditory verbal memory","language","HIF"],"refs":[{"label":"Repetition lesion-symptom mapping","url":"https://pubmed.ncbi.nlm.nih.gov/24976669/"},{"label":"Conduction aphasia review","url":"https://pubmed.ncbi.nlm.nih.gov/20711691/"},{"label":"Logopenic PPA heterogeneity","url":"https://pubmed.ncbi.nlm.nih.gov/25955499/"}],"pitfalls":"","tool":"nihssstimuli","generalize":""},{"section":"HIF","title":"Sequential motion rate: /pa-ta-ka/","purpose":"Tests rapid sequencing across different articulatory placements; useful for motor-speech planning and cerebellar/ataxic speech assessment.","localization":"Distributed speech motor planning/execution network including dominant premotor regions and cerebellar/bulbar systems.","perform":"Ask the patient to repeat 'pa-ta-ka, pa-ta-ka...' rapidly and evenly for several cycles.","abnormal":"Listen for segmentation, loss of sequence, irregular rhythm, and imprecise consonants. Do not equate a poor result with apraxia of speech by itself; dysarthria and general motor impairment can also impair the task.","evidence":"Sequential motion rate is a standard motor-speech task; interpretation must be contextual.","tags":["pa ta ka","SMR","diadochokinesis","apraxia of speech","dysarthria","ataxic speech","HIF"],"refs":[{"label":"Oral/laryngeal diadochokinesis scoping review","url":"https://pubmed.ncbi.nlm.nih.gov/34958599/"},{"label":"Speech recording/acoustic analysis recommendations in dysarthria","url":"https://pubmed.ncbi.nlm.nih.gov/33373483/"}],"pitfalls":"","tool":"nihssstimuli","generalize":""},{"section":"HIF","title":"Simultanagnosia / complex-scene perception","purpose":"Tests ability to perceive multiple elements of a visual scene simultaneously.","localization":"Bilateral parieto-occipital dorsal attention network; classically part of Balint syndrome.","perform":"Show a complex scene and first ask for the overall event, then specific elements. Compare with recognition of isolated objects.","abnormal":"Reporting only one element at a time despite adequate object recognition/fields supports simultanagnosia.","evidence":"Localization is supported by Balint/parieto-occipital lesion literature; bedside sensitivity is not well quantified.","tags":["simultanagnosia","Balint","parieto-occipital","dorsal stream","visual attention","HIF"],"refs":[{"label":"Higher cortical dysfunction bedside review","url":"https://pubmed.ncbi.nlm.nih.gov/15651306/"},{"label":"Cortical function deficits review","url":"https://pubmed.ncbi.nlm.nih.gov/19566501/"}],"pitfalls":"","tool":"nihssstimuli","generalize":""},{"section":"HIF","title":"Single-word repetition","purpose":"Tests phonologic input-output mapping with relatively low working-memory demand.","localization":"Dominant posterior superior temporal/inferior parietal-dorsal language network; isolated deficits can occur with conduction-type lesions.","perform":"Ask the patient to repeat several words of increasing phonologic complexity, including multisyllabic words. Listen to the exact error rather than scoring only correct/incorrect.","abnormal":"Phonemic substitutions, repeated approximations, or inability despite preserved comprehension are abnormal. Compare with sentence repetition and spontaneous speech.","evidence":"Strong lesion-symptom mapping and conduction-aphasia literature.","tags":["repetition","conduction aphasia","arcuate","phonemic paraphasia","language","trouble speaking","HIF"],"refs":[{"label":"Repetition lesion-symptom mapping","url":"https://pubmed.ncbi.nlm.nih.gov/24976669/"},{"label":"Conduction aphasia review","url":"https://pubmed.ncbi.nlm.nih.gov/20711691/"}],"pitfalls":"","tool":"nihssstimuli","generalize":""},{"section":"HIF","title":"Spontaneous sentence writing","purpose":"Tests self-generated written language.","localization":"Dominant language network with orthographic, executive, and graphomotor contributions.","perform":"Ask the patient to write one complete meaningful sentence of their own choosing. If abnormal, compare with dictation and copying.","abnormal":"Omitted/incorrect words or letters with preserved copying supports a language-based writing deficit. Purely shaky, weak, or poorly formed handwriting without language errors suggests a motor rather than linguistic problem.","evidence":"Standard bedside agraphia assessment component.","tags":["spontaneous writing","agraphia","writing","language","HIF","dominant parietal","Gerstmann"],"refs":[{"label":"Alexia/agraphia localization review","url":"https://pubmed.ncbi.nlm.nih.gov/21878722/"},{"label":"Neurologic examination: from symptoms to localization (review)","url":"https://pubmed.ncbi.nlm.nih.gov/42220180/"}],"pitfalls":"","tool":null,"generalize":""},{"section":"HIF","title":"Sustained vowel / maximum phonation","purpose":"Samples respiratory-phonatory support and voice quality without articulation demands.","localization":"Larynx/CN X, respiratory muscles, corticobulbar and extrapyramidal systems; abnormality is not specific to one level.","perform":"Ask for a comfortable deep breath followed by a sustained 'ah' at normal pitch/loud
